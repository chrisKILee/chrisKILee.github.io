<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VNTG / CATALOG — Service Marketplace</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --text:#fafafa;
    --text-secondary:#a3a3a3;
    --text-muted:#525252;
    --border:#262626;
    --border-hover:#525252;
    --card-hover-bg:#111111;
    --white:#ffffff;
    --font-sans:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ -webkit-font-smoothing:antialiased; }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-sans);
    line-height:1.5;
    min-height:100vh;
  }

  .mono{ font-family:var(--font-mono); }

  a{ color:inherit; text-decoration:none; }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }

  .wrap{
    max-width:1360px;
    margin:0 auto;
    padding:0 32px;
  }

  /* ---------- Header ---------- */
  header{
    border-bottom:1px solid var(--border);
    padding:36px 0;
  }

  .header-inner{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
    flex-wrap:wrap;
  }

  .logo{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:20px;
    letter-spacing:0.06em;
    margin-bottom:10px;
  }

  .tagline{
    color:var(--text-secondary);
    font-size:15px;
  }

  .btn-outline{
    border:1px solid var(--border);
    padding:11px 20px;
    font-family:var(--font-mono);
    font-size:13px;
    letter-spacing:0.04em;
    white-space:nowrap;
    transition:border-color .2s ease, background-color .2s ease, color .2s ease;
  }

  .btn-outline:hover{
    border-color:var(--white);
    background:var(--white);
    color:#0a0a0a;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    padding:28px 0 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:24px;
    flex-wrap:wrap;
  }

  .tabs{
    display:flex;
    gap:4px;
    flex-wrap:wrap;
  }

  .tab{
    font-family:var(--font-mono);
    font-size:13px;
    letter-spacing:0.08em;
    padding:9px 16px;
    border:1px solid transparent;
    color:var(--text-secondary);
    transition:all .2s ease;
  }

  .tab:hover{
    color:var(--text);
    border-color:var(--border);
  }

  .tab.active{
    background:var(--white);
    color:#0a0a0a;
    border-color:var(--white);
  }

  .search-box{
    display:flex;
    align-items:center;
    gap:8px;
    border-bottom:1px solid var(--border);
    padding:8px 2px;
    min-width:220px;
    transition:border-color .2s ease;
  }

  .search-box:focus-within{
    border-color:var(--white);
  }

  .search-box svg{
    color:var(--text-muted);
    flex-shrink:0;
  }

  .search-box input{
    background:none;
    border:none;
    outline:none;
    color:var(--text);
    font-family:var(--font-sans);
    font-size:14px;
    width:100%;
  }

  .search-box input::placeholder{
    color:var(--text-muted);
  }

  .count-row{
    padding-bottom:20px;
    border-bottom:1px solid var(--border);
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:0.1em;
    color:var(--text-muted);
  }

  #countNum{ color:var(--text-secondary); }

  /* ---------- Grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:1px;
    background:var(--border);
    margin:32px 0 80px;
    border:1px solid var(--border);
  }

  .card{
    background:var(--bg);
    padding:26px 24px;
    display:flex;
    flex-direction:column;
    cursor:pointer;
    transition:background-color .2s ease;
    min-height:230px;
  }

  .card:hover{
    background:var(--card-hover-bg);
  }

  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:18px;
  }

  .card-id-group{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .card-index{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-muted);
    letter-spacing:0.05em;
  }

  .card-initials{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:12px;
    letter-spacing:0.05em;
    border:1px solid var(--border);
    padding:6px 8px;
    color:var(--text-secondary);
    transition:border-color .2s ease, color .2s ease;
  }

  .card:hover .card-initials{
    border-color:var(--border-hover);
    color:var(--text);
  }

  .card-status{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.08em;
    display:flex;
    align-items:center;
    gap:5px;
    white-space:nowrap;
    padding-top:2px;
  }

  .status-live{ color:var(--text); }
  .status-beta{ color:var(--text-secondary); }
  .status-wip{ color:var(--text-muted); }

  .card-name{
    font-family:var(--font-sans);
    font-size:19px;
    font-weight:600;
    margin-bottom:8px;
  }

  .card-category{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--text-muted);
    display:inline-block;
    margin-bottom:14px;
  }

  .card-desc{
    color:var(--text-secondary);
    font-size:14px;
    line-height:1.6;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    flex:1;
    margin-bottom:20px;
  }

  .card-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding-top:16px;
    border-top:1px solid var(--border);
  }

  .card-metrics{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-muted);
    letter-spacing:0.02em;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .card-view{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-secondary);
    white-space:nowrap;
    transition:color .2s ease, transform .2s ease;
  }

  .card:hover .card-view{
    color:var(--white);
    transform:translateX(2px);
  }

  .empty-state{
    grid-column:1/-1;
    background:var(--bg);
    text-align:center;
    padding:80px 20px;
    color:var(--text-muted);
    font-family:var(--font-mono);
    font-size:13px;
    letter-spacing:0.05em;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }

  .modal-overlay.open{
    opacity:1;
    pointer-events:auto;
  }

  .modal{
    background:var(--bg);
    border:1px solid var(--border-hover);
    max-width:560px;
    width:100%;
    max-height:86vh;
    overflow-y:auto;
    padding:36px;
    transform:translateY(12px);
    transition:transform .25s ease;
  }

  .modal-overlay.open .modal{
    transform:translateY(0);
  }

  .modal-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:24px;
  }

  .modal-id-group{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .modal-index{
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--text-muted);
  }

  .modal-initials{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:14px;
    letter-spacing:0.05em;
    border:1px solid var(--border-hover);
    padding:8px 10px;
  }

  .modal-close{
    color:var(--text-secondary);
    padding:4px;
    transition:color .2s ease, transform .2s ease;
  }

  .modal-close:hover{
    color:var(--white);
    transform:rotate(90deg);
  }

  .modal-name{
    font-family:var(--font-sans);
    font-size:26px;
    font-weight:700;
    margin-bottom:12px;
  }

  .modal-meta{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:24px;
  }

  .modal-category{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:0.1em;
    color:var(--text-secondary);
    border:1px solid var(--border);
    padding:5px 10px;
  }

  .modal-status{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:0.08em;
    display:flex;
    align-items:center;
    gap:6px;
  }

  .modal-desc{
    color:var(--text-secondary);
    font-size:15px;
    line-height:1.75;
    margin-bottom:28px;
  }

  .modal-metrics-label{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--text-muted);
    margin-bottom:12px;
  }

  .modal-metrics-list{
    display:flex;
    flex-direction:column;
    gap:0;
    border-top:1px solid var(--border);
    margin-bottom:32px;
  }

  .modal-metric-item{
    font-family:var(--font-mono);
    font-size:14px;
    color:var(--text);
    padding:14px 0;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
  }

  .modal-metric-item::before{
    content:"—";
    color:var(--text-muted);
    margin-right:12px;
  }

  .modal-view-btn{
    width:100%;
    border:1px solid var(--white);
    padding:16px;
    font-family:var(--font-mono);
    font-size:14px;
    letter-spacing:0.08em;
    text-align:center;
    background:var(--white);
    color:#0a0a0a;
    transition:opacity .2s ease;
  }

  .modal-view-btn:hover{
    opacity:0.85;
  }

  /* ---------- Footer ---------- */
  footer{
    border-top:1px solid var(--border);
    padding:28px 0 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-muted);
    letter-spacing:0.03em;
  }

  /* ---------- Responsive ---------- */
  @media (max-width:768px){
    .wrap{ padding:0 20px; }
    header{ padding:28px 0; }
    .header-inner{ flex-direction:column; align-items:flex-start; }
    .toolbar{ flex-direction:column; align-items:flex-start; }
    .search-box{ width:100%; }
    .grid{ grid-template-columns:1fr; margin:24px 0 60px; }
    .modal{ padding:26px; }
    .modal-name{ font-size:22px; }
    footer{ flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap header-inner">
    <div>
      <div class="logo">VNTG / CATALOG</div>
      <div class="tagline">운영을 자동화하는 15개의 서비스</div>

</header>

<div class="wrap">

<footer>

</footer>

<div class="modal-overlay" id="modalOverlay" aria-hidden="true">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <div class="modal-top">
      <div class="modal-id-group">
        <span class="modal-index mono" id="modalIndex"></span>
        <span class="modal-initials mono" id="modalInitials"></span>
      </div>
      <button class="modal-close" id="modalClose" aria-label="닫기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <line x1="6" y1="6" x2="18" y2="18"></line>
          <line x1="6" y1="18" x2="18" y2="6"></line>
        </svg>
      </button>

    <h2 class="modal-name" id="modalName"></h2>

    <div class="modal-meta">
      <span class="modal-category mono" id="modalCategory"></span>
      <span class="modal-status mono" id="modalStatus"></span>

    <p class="modal-desc" id="modalDesc"></p>

    <div class="modal-metrics-label mono">METRICS</div>
    <div class="modal-metrics-list" id="modalMetrics"></div>

    <button class="modal-view-btn mono" type="button">VIEW →</button>
  </div>
</div>

      index: "12", name: "DLP", category: "SEC", status: "LIVE", initials: "DL",
      short: "정보유출방지 통제.",
      long: "전사 데이터 이동을 통제·모니터링하는 정보유출방지(DLP). 표준 운영 프로세스로 상시 운영.",
      metrics: ["전사 적용"]
    },
    {
      index: "13", name: "NAC", category: "SEC", status: "LIVE", initials: "NA",
      short: "네트워크 접근통제.",
      long: "비인가 단말의 네트워크 접근을 자동 차단하는 접근통제(NAC). 전사 네트워크에 적용.",
      metrics: ["전사 적용"]
    },
    {
      index: "14", name: "ITAM", category: "SEC", status: "WIP", initials: "IT",
      short: "IT 자산 통합관리.",
      long: "라이선스·단말 등 IT 자산 현황을 통합 관리·가시화하는 시스템(ITAM). 자산 기반 보안·비용 최적화의 토대.",
      metrics: ["자산 가시화"]
    },
    {
      index: "15", name: "EDR", category: "SEC", status: "LIVE", initials: "ED",
      short: "엔드포인트 위협 탐지·대응.",
      long: "엔드포인트의 위협을 탐지·대응(EDR)한다. 그룹 계열사에 배포·운영.",
      metrics: ["그룹 배포"]
    }
  ];

  var state = {
    category: "ALL",
    query: ""
  };

  var gridEl = document.getElementById("grid");
  var countEl = document.getElementById("countNum");
  var tabsEl = document.getElementById("tabs");
  var searchInput = document.getElementById("searchInput");
  var modalOverlay = document.getElementById("modalOverlay");
  var modalClose = document.getElementById("modalClose");

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function statusBadge(status){
    var meta = STATUS_META[status];
    return '<span class="card-status mono ' + meta.cls + '">' +
      '<span aria-hidden="true">' + meta.symbol + '</span>' + meta.label +
      '</span>';
  }

  function cardTemplate(service){
    return (
      '<article class="card" data-index="' + service.index + '" role="listitem" tabindex="0" aria-label="' + escapeHtml(service.name) + '">' +
        '<div class="card-top">' +
          '<div class="card-id-group">' +
            '<span class="card-index mono">' + service.index + '</span>' +
            '<span class="card-initials">' + service.initials + '</span>' +
          '</div>' +
          statusBadge(service.status) +
        '</div>' +
        '<h3 class="card-name">' + escapeHtml(service.name) + '</h3>' +
        '<span class="card-category mono">' + service.category + '</span>' +
        '<p class="card-desc">' + escapeHtml(service.short) + '</p>' +
        '<div class="card-footer">' +
          '<span class="card-metrics">' + escapeHtml(service.metrics.join(" · ")) + '</span>' +
          '<span class="card-view">VIEW →</span>' +
        '</div>' +
      '</article>'
    );
  }

  function getFiltered(){
    var q = state.query.trim().toLowerCase();
    return SERVICES.filter(function(service){
      var matchesCategory = state.category === "ALL" || service.category === state.category;
      var matchesQuery = !q ||
        service.name.toLowerCase().indexOf(q) !== -1 ||
        service.short.toLowerCase().indexOf(q) !== -1 ||
        service.long.toLowerCase().indexOf(q) !== -1;
      return matchesCategory && matchesQuery;
    });
  }

  function render(){
    var filtered = getFiltered();
    countEl.textContent = filtered.length;

    if (filtered.length === 0){
      gridEl.innerHTML = '<div class="empty-state">조건에 맞는 서비스가 없습니다.</div>';
      return;
    }

    gridEl.innerHTML = filtered.map(cardTemplate).join("");

    Array.prototype.forEach.call(gridEl.querySelectorAll(".card"), function(cardEl){
      cardEl.addEventListener("click", function(){
        openModal(cardEl.getAttribute("data-index"));
      });
      cardEl.addEventListener("keydown", function(e){
        if (e.key === "Enter" || e.key === " "){
          e.preventDefault();
          openModal(cardEl.getAttribute("data-index"));
        }
      });
    });
  }

  function findByIndex(index){
    for (var i = 0; i < SERVICES.length; i++){
      if (SERVICES[i].index === index) return SERVICES[i];
    }
    return null;
  }

  function openModal(index){
    var service = findByIndex(index);
    if (!service) return;

    document.getElementById("modalIndex").textContent = service.index;
    document.getElementById("modalInitials").textContent = service.initials;
    document.getElementById("modalName").textContent = service.name;
    document.getElementById("modalCategory").textContent = service.category;
    document.getElementById("modalStatus").innerHTML = statusBadgeInline(service.status);
    document.getElementById("modalDesc").textContent = service.long;
    document.getElementById("modalMetrics").innerHTML = service.metrics.map(function(m){
      return '<div class="modal-metric-item">' + escapeHtml(m) + '</div>';
    }).join("");

    modalOverlay.classList.add("open");
    modalOverlay.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    modalClose.focus();
  }

  function statusBadgeInline(status){
    var meta = STATUS_META[status];
    return '<span class="' + meta.cls + '"><span aria-hidden="true">' + meta.symbol + '</span></span> ' + meta.label;
  }

  function closeModal(){
    modalOverlay.classList.remove("open");
    modalOverlay.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
  }

  tabsEl.addEventListener("click", function(e){
    var tab = e.target.closest(".tab");
    if (!tab) return;

    Array.prototype.forEach.call(tabsEl.querySelectorAll(".tab"), function(t){
      t.classList.remove("active");
      t.setAttribute("aria-selected", "false");
    });
    tab.classList.add("active");
    tab.setAttribute("aria-selected", "true");

    state.category = tab.getAttribute("data-category");
    render();
  });

  searchInput.addEventListener("input", function(e){
    state.query = e.target.value;
    render();
  });

  modalClose.addEventListener("click", closeModal);

  modalOverlay.addEventListener("click", function(e){
    if (e.target === modalOverlay) closeModal();
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && modalOverlay.classList.contains("open")){
      closeModal();
    }
  });

  render();
})();
</script>

</body>
</html>
