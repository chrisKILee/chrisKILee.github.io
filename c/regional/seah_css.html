<!DOCTYPE html>
<html lang="ko">
  <head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8" />
    <title>세아창원특수강 공정 상세도</title>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React / ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel (JSX 변환용) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="/assets/js/page-header.js"></script>
</head>
  <body class="bg-slate-900">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const ProcessVisualizer = () => {
        const [activeTab, setActiveTab] = useState('steelmaking'); // steelmaking or rolling
        const [currentStep, setCurrentStep] = useState(0);
        const [isPlaying, setIsPlaying] = useState(true);

        // 제강 공정 데이터 (아이콘을 이모지로 단순화)
        const steelSteps = [
          {
            id: 'eaf',
            title: '1. EAF (Electric Arc Furnace)',
            subtitle: '60/100톤 전기로 용해',
            desc: '스크랩과 합금철을 아크열로 용해합니다. 세아창원특수강은 특수강 전용 전기로를 운영하여 고합금강 생산의 기초를 다집니다.',
            detail: 'Tapping Temp: ~1,650℃',
            icon: '⚡',
            color: 'bg-orange-600',
          },
          {
            id: 'aod',
            title: '2. AOD (Argon Oxygen Decarburization)',
            subtitle: '주력 탈탄 정련',
            desc: '스테인리스강 제조의 핵심 설비입니다. Ar/O₂ 가스 비율을 제어하여 크롬(Cr) 산화 없이 탄소(C)만 정밀하게 제거합니다.',
            detail: 'Cr 회수율 극대화 공정',
            icon: '💨',
            color: 'bg-red-500',
          },
          {
            id: 'vod',
            title: '3. VOD (Vacuum Oxygen Decarburization)',
            subtitle: '진공 정련 및 탈가스',
            desc: '진공 상태에서 산소를 취입하여 극저탄소(ELC) 강종을 생산하고, 가스(H, N)를 제거하여 청정도를 극대화합니다.',
            detail: '고청정 베어링강/항공소재 필수',
            icon: '🔬',
            color: 'bg-purple-700',
          },
          {
            id: 'cc',
            title: '4. 수직 연속 주조 (Vertical C.C)',
            subtitle: '대단면 블룸(Bloom) 생산',
            desc: '세계 최대급 단면의 블룸을 수직형 연주기로 생산하여 내부 품질이 균일하고 편석이 적은 소재를 만듭니다.',
            detail: 'Bloom Size: Max □500mm 등',
            icon: '📦',
            color: 'bg-orange-800',
          },
        ];

        // 압연 공정 데이터
        const rollingSteps = [
          {
            id: 'reheat',
            title: '1. 가열로 (Reheating)',
            subtitle: 'Walking Beam Furnace',
            desc: '블룸/빌렛을 강종별 최적 온도로 가열합니다. 탈탄 방지와 균일 가열을 위해 분위기 제어가 이루어집니다.',
            detail: 'Temp: 1,050 ~ 1,250℃',
            icon: '🌡️',
            color: 'bg-red-700',
          },
          {
            id: 'rough',
            title: '2. 조압연 & Vision AI',
            subtitle: 'AI 기반 치수 제어',
            desc: '강력한 압하력으로 단면을 줄입니다. 최근 도입된 "Vision AI"가 실시간으로 외경을 측정하고 롤 셋팅을 가이드합니다.',
            detail: 'AI Monitoring System 적용',
            icon: '👁️',
            color: 'bg-slate-600',
          },
          {
            id: 'finish',
            title: '3. 사상 압연 (Sizing Block)',
            subtitle: 'RSB / Precision Rolling',
            desc: 'RSB(Reducing Sizing Block) 설비를 통과시켜 0.1mm 단위의 정밀한 치수와 우수한 표면 조도를 확보합니다.',
            detail: 'High Precision Tolerance',
            icon: '📏',
            color: 'bg-blue-600',
          },
          {
            id: 'finish_proc',
            title: '4. 정정 및 검사 (Finishing)',
            subtitle: 'Straightening & NDT',
            desc: '냉각 후 교정(Straightening)을 거쳐 비파괴 검사(NDT)로 내부/표면 결함을 전수 보증 후 출하합니다.',
            detail: 'UST / ECT / Leakage Test',
            icon: '🗃️',
            color: 'bg-slate-500',
          },
        ];

        const currentStepsData = activeTab === 'steelmaking' ? steelSteps : rollingSteps;

        useEffect(() => {
          let interval;
          if (isPlaying) {
            interval = setInterval(() => {
              setCurrentStep((prev) => (prev + 1) % currentStepsData.length);
            }, 3500);
          }
          return () => clearInterval(interval);
        }, [isPlaying, activeTab, currentStepsData.length]);

        const handleTabChange = (tab) => {
          setActiveTab(tab);
          setCurrentStep(0);
          setIsPlaying(true);
        };

        return (
          <div className="flex flex-col items-center justify-center min-h-screen bg-slate-900 text-white p-4 font-sans selection:bg-blue-500 selection:text-white">
            <div className="max-w-5xl w-full bg-slate-800 rounded-2xl shadow-2xl overflow-hidden border border-slate-700">
              {/* Header */}
              <div className="p-6 border-b border-slate-700 flex flex-col md:flex-row justify-between items-center bg-gradient-to-r from-slate-800 to-slate-900">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="bg-blue-600 text-xs font-bold px-2 py-1 rounded text-white">
                      V2.0 Enhanced
                    </span>
                    <h1 className="text-2xl font-bold text-white mb-1">
                      세아창원특수강 공정 상세도
                    </h1>
                  </div>
                  <p className="text-slate-400 text-sm">
                    SeAH CSS Smart Process: Vision AI &amp; High Purity Tech
                  </p>
                </div>
                <div className="flex space-x-2 mt-4 md:mt-0 bg-slate-900/50 p-1 rounded-xl">
                  <button
                    onClick={() => handleTabChange('steelmaking')}
                    className={`px-5 py-2.5 rounded-lg text-sm font-bold transition-all duration-300 ${
                      activeTab === 'steelmaking'
                        ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20'
                        : 'text-slate-400 hover:text-white hover:bg-slate-700'
                    }`}
                  >
                    제강 (Steelmaking)
                  </button>
                  <button
                    onClick={() => handleTabChange('rolling')}
                    className={`px-5 py-2.5 rounded-lg text-sm font-bold transition-all duration-300 ${
                      activeTab === 'rolling'
                        ? 'bg-orange-600 text-white shadow-lg shadow-orange-500/20'
                        : 'text-slate-400 hover:text-white hover:bg-slate-700'
                    }`}
                  >
                    압연 (Rolling &amp; AI)
                  </button>
                </div>
              </div>

              {/* Main Visual Stage (단순화 – 원본 애니메이션 구조 유지) */}
              <div className="relative h-96 bg-slate-950 overflow-hidden flex items-center justify-center p-8">
                {/* 배경 그리드 */}
                <div
                  className="absolute inset-0 opacity-20"
                  style={{
                    backgroundImage:
                      'linear-gradient(rgba(59, 130, 246, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(59, 130, 246, 0.1) 1px, transparent 1px)',
                    backgroundSize: '40px 40px',
                  }}
                ></div>

                {/* 메인 컨텐츠 – 여기서는 애니메이션 일부만 유지 */}
                <div className="relative z-10 w-full max-w-3xl flex flex-col items-center">
                  <div className="h-56 w-full flex items-center justify-center relative mb-4">
                    <div className="text-center">
                      <div className="mb-4 text-sm text-slate-300">
                        {activeTab === 'steelmaking' ? '제강 공정' : '압연 공정'} 단계
                      </div>
                      <div className="text-6xl mb-4">
                        {currentStepsData[currentStep].icon}
                      </div>
                      <div className="text-lg text-slate-300">
                        {currentStepsData[currentStep].subtitle}
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              {/* Info Panel */}
              <div className="bg-slate-800 p-6 border-t border-slate-700">
                <div className="flex items-center justify-between mb-6">
                  <div className="flex space-x-1.5 flex-1 mr-8">
                    {currentStepsData.map((_, idx) => (
                      <button
                        key={idx}
                        onClick={() => {
                          setCurrentStep(idx);
                          setIsPlaying(false);
                        }}
                        className={`h-1.5 rounded-full transition-all duration-500 ${
                          idx === currentStep
                            ? 'flex-1 bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.5)]'
                            : 'w-4 bg-slate-700 hover:bg-slate-600'
                        }`}
                      />
                    ))}
                  </div>
                  <button
                    onClick={() => setIsPlaying(!isPlaying)}
                    className="flex items-center gap-2 px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 transition-all hover:scale-105 active:scale-95 text-xs font-bold uppercase tracking-wide"
                  >
                    {isPlaying ? '⏸ PAUSE' : '▶ PLAY'}
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-[auto_1fr] gap-6">
                  <div
                    className={`w-16 h-16 rounded-2xl flex items-center justify-center shadow-lg ${currentStepsData[currentStep].color}`}
                  >
                    <span className="text-3xl">
                      {currentStepsData[currentStep].icon}
                    </span>
                  </div>

                  <div>
                    <div className="flex flex-col md:flex-row md:items-center gap-2 mb-2">
                      <h2 className="text-2xl font-bold text-white tracking-tight">
                        {currentStepsData[currentStep].title}
                      </h2>
                      <span className="px-2 py-0.5 rounded bg-slate-700 text-xs text-blue-300 font-mono border border-slate-600">
                        {currentStepsData[currentStep].subtitle}
                      </span>
                    </div>

                    <p className="text-slate-300 leading-relaxed text-sm md:text-base mb-3">
                      {currentStepsData[currentStep].desc}
                    </p>

                    <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded bg-slate-700/50 border border-slate-600/50">
                      <span className="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
                      <span className="text-xs text-blue-200 font-medium">
                        Tech Note: {currentStepsData[currentStep].detail}
                      </span>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div className="mt-6 flex gap-4 text-xs text-slate-500">
              <span className="flex items-center gap-1">⚡ VIM/ESR 공정은 특수합금(항공/방산) 전용입니다.</span>
              <span className="flex items-center gap-1">👁️ Vision AI는 압연 정밀도를 보증합니다.</span>
            </div>

            <style>{`
              @keyframes pulse-slow {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.5; }
              }
              .animate-pulse-slow {
                animation: pulse-slow 3s ease-in-out infinite;
              }
            `}</style>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<ProcessVisualizer />);
    </script>
  </body>
</html>
