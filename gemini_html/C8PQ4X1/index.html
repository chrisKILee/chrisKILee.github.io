<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Travel - Adventures & Journeys</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #A7F3D0 0%, #34D399 100%);
            min-height: 100vh;
            color: #333;
            transition: background 0.5s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            color: #065F46;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .stats {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 12px 25px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        .search-box {
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 16px 25px;
            font-size: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.6);
            color: #064E3B;
            outline: none;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .file-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            border: 1px solid white;
        }

        .file-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(52, 211, 153, 0.3);
            border-color: #10B981;
        }

        .file-icon {
            font-size: 2rem;
            color: #059669;
            margin-bottom: 16px;
        }

        .file-name {
            font-weight: 600;
            color: #064E3B;
            margin-bottom: 12px;
        }

        .file-meta {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #065F46;
        }

        .file-badge {
            background: #D1FAE5;
            color: #059669;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .content-view {
            animation: fadeIn 0.5s ease;
            background: white;
            min-height: 100vh;
        }

        .content-header {
            padding: 15px 25px;
            background: white;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-back {
            background: #ECFDF5;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            color: #047857;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }


        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div id="fileListView" class="container">
        <div class="header">
            <h1>✈️ Travel Lounge</h1>
            <p>Capturing the essence of discovery</p>
        </div>
        <div class="stats">
            <div class="stat-card">
                <h3 id="totalFiles">0</h3>
                <p>Destinations</p>
            </div>
        </div>
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="Search trips...">
        </div>
        <div id="filesContainer" class="file-grid"></div>
    </div>

    <div id="fileContentView" class="content-view" style="display:none;">
        <div id="contentFrame"></div>
    </div>

    <script>
        const SECRET_LIST_HASH = 't-travel-auth-55';
        const CONFIG_PATH = './files.json';
        const CONTENT_BASE_PATH = './';

        let filesData = [];
        let folderConfig = {};

        async function init() {
            try {
                const resp = await fetch(`${CONFIG_PATH}?v=${new Date().getTime()}`);
                if (!resp.ok) throw new Error('404');
                folderConfig = await resp.json();
                const order = folderConfig._order || [];
                filesData = order.map(name => ({ name, type: 'file' }));
                document.getElementById('totalFiles').innerText = filesData.length;
                renderGrid();
                checkHash();
            } catch (e) { showStealth404(); }
        }

        function renderGrid() {
            const container = document.getElementById('filesContainer');
            const icons = ['map-marked-alt', 'camera-retro', 'globe-asia', 'plane-arrival', 'umbrella-beach', 'hiking'];
            container.innerHTML = filesData.map((file, idx) => {
                const displayName = folderConfig[file.name] || file.name.replace('.html', '');
                const hashName = file.name.replace(/\.[^/.]+$/, "");
                return `
                    <div class="file-card" onclick="window.location.hash='${hashName}'">
                        <div class="file-icon"><i class="fas fa-${icons[idx % icons.length]}"></i></div>
                        <div class="file-name">${displayName}</div>
                        <div class="file-meta">
                            <span>Travelogue</span>
                            <span class="file-badge">LOG</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function checkHash() {
            const hash = decodeURIComponent(window.location.hash.substring(1));
            if (!hash) return showStealth404();
            if (hash === SECRET_LIST_HASH) {
                toggleView('list');
            } else {
                const file = filesData.find(f => f.name.replace(/\.[^/.]+$/, "") === hash);
                if (file) {
                    toggleView('content');
                    loadContent(file.name);
                } else { showStealth404(); }
            }
        }

        function toggleView(view) {
            document.getElementById('fileListView').style.display = view === 'list' ? 'block' : 'none';
            document.getElementById('fileContentView').style.display = view === 'content' ? 'block' : 'none';
            document.body.style.background = view === 'list' ? 'linear-gradient(135deg, #A7F3D0 0%, #34D399 100%)' : 'white';
        }

        async function loadContent(filename) {
            const frame = document.getElementById('contentFrame');
            frame.innerHTML = '<div style="padding: 20px; color: #059669;">Loading travelogue...</div>';

            try {
                const resp = await fetch(`${CONTENT_BASE_PATH}${filename}?v=${new Date().getTime()}`);
                if (!resp.ok) throw new Error('Not found');
                const text = await resp.text();

                if (!frame.shadowRoot) frame.attachShadow({ mode: 'open' });
                const shadow = frame.shadowRoot;
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const styles = Array.from(doc.querySelectorAll('style, link[rel="stylesheet"]')).map(s => s.outerHTML).join('');

                shadow.innerHTML = `
                    <style>
                        :host { display: block; background: white; min-height: 100vh; }
                        @import url('https://fonts.googleapis.com/css2?family=Inter&display=swap');
                        * { font-family: 'Inter', sans-serif !important; }
                    </style>
                    ${styles}
                    <div class="shadow-content-wrapper">${doc.body.innerHTML}</div>
                `;

                doc.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');
                    if (oldScript.src) newScript.src = oldScript.src;
                    else newScript.textContent = oldScript.textContent;
                    shadow.appendChild(newScript);
                });
            } catch (e) {
                frame.innerHTML = '<div style="padding: 20px; color: #ef4444;">Error loading content.</div>';
            }
        }

        function showStealth404() {
            document.body.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; color:#059669; background:#ECFDF5; text-align:center;">
                <h1 style="font-size:15vw; opacity:0.1;">404</h1>
                <p>Private Route. Forbidden access.</p>
            </div>`;
        }

        window.addEventListener('hashchange', checkHash);
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
