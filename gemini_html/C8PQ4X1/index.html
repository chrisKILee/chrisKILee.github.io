<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Travel - Adventures & Journeys</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #A7F3D0 0%, #34D399 100%);
            min-height: 100vh;
            color: #333;
            transition: background 0.5s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            color: #065F46;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .stats {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 12px 25px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        .search-box {
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 16px 25px;
            font-size: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.6);
            color: #064E3B;
            outline: none;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .file-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            border: 1px solid white;
        }

        .file-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(52, 211, 153, 0.3);
            border-color: #10B981;
        }

        .file-icon {
            font-size: 2rem;
            color: #059669;
            margin-bottom: 16px;
        }

        .file-name {
            font-weight: 600;
            color: #064E3B;
            margin-bottom: 12px;
        }

        .file-meta {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #065F46;
        }

        .file-badge {
            background: #D1FAE5;
            color: #059669;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .content-view {
            animation: fadeIn 0.5s ease;
            background: white;
            min-height: 100vh;
        }

        .content-header {
            padding: 15px 25px;
            background: white;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        iframe {
            width: 100%;
            border: none;
            height: 100vh;
            display: block;
        }


        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .new-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ef4444;
            color: white;
            font-size: 0.62rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 10px;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            animation: pulseBadge 2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes pulseBadge {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.75; transform: scale(0.95); }
        }
    </style>
</head>

<body>
    <div id="fileListView" class="container">
        <div class="header">
            <h1>✈️ Travel Lounge</h1>
            <p>Capturing the essence of discovery</p>
        </div>
        <div class="stats">
            <div class="stat-card">
                <h3 id="totalFiles">0</h3>
                <p>Destinations</p>
            </div>
        </div>
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="Search trips...">
        </div>
        <div id="filesContainer" class="file-grid"></div>
    </div>

    <div id="fileContentView" class="content-view" style="display:none;">
        <iframe id="contentFrame" style="width:100%;height:100vh;border:none;display:block;"></iframe>
    </div>

            <script>
        const SECRET_LIST_HASH = 't-travel-auth-55';
        const CATEGORY_HASH = 'C8PQ4X1';
        let filesData = []; // [{hash, filename, displayName}]

        async function init() {
            try {
                const resp = await fetch(`../site.json?v=${Date.now()}`);
                const site = await resp.json();
                filesData = Object.entries(site.files || {})
                    .filter(([, f]) => f.categoryHash === CATEGORY_HASH && f.visible !== false)
                    .sort((a, b) => (a[1].order || 999) - (b[1].order || 999))
                    .map(([hash, f]) => ({ hash, filename: f.filename, displayName: f.displayName, createdAt: f.createdAt }));
                renderGrid(); checkHash();
            } catch (e) { showStealth404(); }
        }

        function renderGrid() {
            const container = document.getElementById('filesContainer');
            container.innerHTML = filesData.map(file => `
                <div class="file-card" onclick="location.href='../${file.filename}'" style="position:relative">
                    ${(file.createdAt && (Date.now()-new Date(file.createdAt))<604800000)?'<span class="new-badge">NEW</span>':''}
                    <div class="file-icon"><i class="fas fa-leaf"></i></div>
                    <div class="file-name">${file.displayName}</div>
                </div>`).join('');
        }

        function checkHash() {
            const hash = decodeURIComponent(window.location.hash.substring(1));
            if (!hash) return showStealth404();
            if (hash === SECRET_LIST_HASH) toggleView('list');
            else {
                const file = filesData.find(f => f.hash === hash);
                if (file) { toggleView('content'); loadContent(file); } else showStealth404();
            }
        }

        function toggleView(view) {
            document.getElementById('fileListView').style.display = view === 'list' ? 'block' : 'none';
            document.getElementById('fileContentView').style.display = view === 'content' ? 'block' : 'none';
        }

        function loadContent(file) {
            const iframe = document.getElementById('contentFrame');
            iframe.src = `../${file.filename}?v=${Date.now()}`;
        }

        function showStealth404() { document.body.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100vh; color:#94a3b8; background:#f8fafc;"><h1>404 Not Found</h1></div>`; }
        window.addEventListener('hashchange', checkHash); window.addEventListener('DOMContentLoaded', init);
    </script>
    <!-- Version: 2026-03-18 flat architecture v4.0 -->
</body>

</html>
