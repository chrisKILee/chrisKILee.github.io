<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 Life - Vintage & AI Life</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #ECFDF5;
            min-height: 100vh;
            color: #064E3B;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            color: #059669;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .file-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            border: 1px solid #D1FAE5;
            box-shadow: 0 10px 15px -3px rgba(5, 150, 105, 0.05);
            cursor: pointer;
        }

        .file-card:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(5, 150, 105, 0.1);
        }

        .file-icon {
            font-size: 2rem;
            color: #10B981;
            margin-bottom: 20px;
        }

        .file-name {
            font-weight: 700;
            color: #064E3B;
        }

        .content-view {
            background: white;
            min-height: 100vh;
        }

        .content-header {
            padding: 20px;
            background: #F0FDF4;
            border-bottom: 1px solid #DCFCE7;
            display: flex;
            align-items: center;
        }

        .nav-back {
            background: #059669;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        iframe {
            width: 100%;
            border: none;
            height: calc(100vh - 80px);
        }
    </style>
</head>

<body>
    <div id="fileListView" class="container">
        <div class="header">
            <h1>🌿 Life & Vintage</h1>
            <p>Elegant living through AI and style</p>
        </div>
        <div id="filesContainer" class="file-grid"></div>
    </div>
    <div id="fileContentView" class="content-view" style="display:none;">
        <div class="content-header"><button onclick="window.location.hash=SECRET_LIST_HASH" class="nav-back">←
                Back</button></div>
        <div id="contentFrame"></div>
    </div>
    <script>
        const SECRET_LIST_HASH = 'l-life-auth-77';
        const CONFIG_PATH = './files.json';
        let filesData = [];
        let folderConfig = {};
        async function init() {
            try {
                const resp = await fetch(`${CONFIG_PATH}?v=${new Date().getTime()}`);
                folderConfig = await resp.json();
                filesData = (folderConfig._order || []).map(name => ({ name }));
                renderGrid(); checkHash();
            } catch (e) { showStealth404(); }
        }
        function renderGrid() {
            const container = document.getElementById('filesContainer');
            container.innerHTML = filesData.map(file => `
                <div class="file-card" onclick="window.location.hash='${file.name.replace(/\.[^/.]+$/, "")}'">
                    <div class="file-icon"><i class="fas fa-leaf"></i></div>
                    <div class="file-name">${folderConfig[file.name] || file.name}</div>
                </div>`).join('');
        }
        function checkHash() {
            const hash = decodeURIComponent(window.location.hash.substring(1));
            if (!hash) return showStealth404();
            if (hash === SECRET_LIST_HASH) toggleView('list');
            else {
                const file = filesData.find(f => f.name.replace(/\.[^/.]+$/, "") === hash);
                if (file) { toggleView('content'); loadContent(file.name); } else showStealth404();
            }
        }
        function toggleView(view) {
            document.getElementById('fileListView').style.display = view === 'list' ? 'block' : 'none';
            document.getElementById('fileContentView').style.display = view === 'content' ? 'block' : 'none';
        }
        function loadContent(filename) {
            const iframe = document.createElement('iframe');
            iframe.src = `./${filename}?v=${new Date().getTime()}`;
            document.getElementById('contentFrame').innerHTML = '';
            document.getElementById('contentFrame').appendChild(iframe);
        }
        function showStealth404() { document.body.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100vh; color:#94a3b8; background:#f8fafc;"><h1>404 Not Found</h1></div>`; }
        window.addEventListener('hashchange', checkHash); window.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
