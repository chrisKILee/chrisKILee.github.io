<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 VNTG AI Study - Corporate AI Research</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Version: 3.0 - Corporate Green Glassmorphism Theme */
        :root {
            --primary: #10b981;
            --primary-light: #34d399;
            --primary-glow: rgba(16, 185, 129, 0.4);
            --bg-dark: #022c22;
            --bg-darker: #064e3b;
            --card-glass: rgba(255, 255, 255, 0.05);
            --card-border: rgba(16, 185, 129, 0.2);
            --text-primary: #ecfdf5;
            --text-secondary: #a7f3d0;
            --text-muted: #6ee7b7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 100%);
            min-height: 100vh;
            padding: 60px 20px 80px;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(16, 185, 129, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(52, 211, 153, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .page-header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .page-title {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 50%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.03em;
            line-height: 1.2;
            text-shadow: 0 0 60px var(--primary-glow);
            filter: drop-shadow(0 0 20px var(--primary-glow));
        }

        .page-subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            font-weight: 500;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Search */
        .search-container {
            max-width: 700px;
            margin: 0 auto 60px;
            position: relative;
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
        }

        .search-wrapper {
            position: relative;
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-wrapper:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            box-shadow: 0 12px 40px rgba(16, 185, 129, 0.3);
        }

        .search-wrapper:focus-within {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            box-shadow: 0 12px 40px var(--primary-glow), 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 20px;
            pointer-events: none;
            z-index: 1;
        }

        .search-input {
            width: 100%;
            padding: 20px 24px 20px 60px;
            border: none;
            border-radius: 16px;
            font-size: 1.0625rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            color: var(--text-primary);
            background: transparent;
            outline: none;
        }

        .search-input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Grid */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 28px;
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
        }

        .file-card {
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 32px;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .file-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-light) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .file-card::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .file-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            box-shadow:
                0 24px 48px rgba(16, 185, 129, 0.3),
                0 0 40px var(--primary-glow),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .file-card:hover::before {
            opacity: 1;
        }

        .file-card:hover::after {
            width: 600px;
            height: 600px;
            opacity: 0.15;
        }

        .file-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 24px var(--primary-glow);
            position: relative;
            z-index: 1;
        }

        .file-card:hover .file-icon {
            transform: scale(1.15) rotate(8deg);
            box-shadow: 0 12px 32px var(--primary-glow);
        }

        .file-icon i {
            font-size: 26px;
            color: white;
        }

        .file-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.4;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            position: relative;
            z-index: 1;
        }

        .file-meta {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9375rem;
            color: var(--text-secondary);
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        .file-badge {
            padding: 6px 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8125rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        /* Loading */
        .loading {
            text-align: center;
            grid-column: 1 / -1;
            padding: 60px;
            color: var(--text-muted);
            font-size: 1.125rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-title {
                font-size: 2.5rem;
            }

            .file-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .file-card {
                padding: 24px;
            }
        }

        #fileListView.active {
            display: block;
        }

        #fileContentView {
            display: none;
        }

        #fileContentView.active {
            display: block;
        }

        #fileListView {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="fileListView" class="active">
            <header class="page-header">
                <h1 class="page-title">VNTG AI Research</h1>
                <p class="page-subtitle">Enterprise AI & Digital Transformation</p>
            </header>

            <div class="search-container">
                <div class="search-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search AI research...">
                </div>
            </div>

            <div id="filesContainer" class="file-grid">
                <div class="loading">Loading files...</div>
            </div>
        </div>

        <div id="fileContentView">
            <div id="contentFrame"></div>
        </div>
    </div>

    <script>
        const GITHUB_API = `https://api.github.com/repos/chrisKILee/chrisKILee.github.io/contents/gemini_html/06_VNTG_AI_STUDY`;
        const CONFIG_PATH = '../06_VNTG_AI_STUDY/files.json';
        const CONTENT_BASE_PATH = '../06_VNTG_AI_STUDY/';
        let filesData = [];

        async function loadFiles() {
            try {
                const filesResp = await fetch(GITHUB_API);
                if (!filesResp.ok) throw new Error('GitHub API Error');
                const rawFiles = await filesResp.json();

                filesData = rawFiles.filter(item =>
                    item.type === 'file' &&
                    !['files.json', 'files_config.js', 'index.html'].includes(item.name) &&
                    !item.name.endsWith('.Identifier')
                );

                let config = {};
                try {
                    const cfgResp = await fetch(CONFIG_PATH);
                    if (cfgResp.ok) config = await cfgResp.json();
                } catch (e) { }

                const order = config._order || [];
                const sorted = [...filesData].sort((a, b) => {
                    const idxA = order.indexOf(a.name);
                    const idxB = order.indexOf(b.name);
                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return a.name.localeCompare(b.name);
                });

                const icons = ['rocket', 'bolt', 'cube', 'network-wired', 'server', 'microchip', 'sitemap', 'cogs'];

                document.getElementById('filesContainer').innerHTML = sorted.map((file, idx) => {
                    const displayName = config[file.name] || file.name;
                    const fileNameNoExt = file.name.replace(/\.[^/.]+$/, "");
                    const ext = file.name.split('.').pop().toUpperCase();
                    const icon = icons[idx % icons.length];
                    return `
                        <div class="file-card" onclick="openFile('${fileNameNoExt}')" data-name="${file.name.toLowerCase()}">
                            <div class="file-icon">
                                <i class="fas fa-${icon}"></i>
                            </div>
                            <div class="file-name">${displayName}</div>
                            <div class="file-meta">
                                <span>${(file.size / 1024).toFixed(1)} KB</span>
                                <span class="file-badge">${ext}</span>
                            </div>
                        </div>
                     `;
                }).join('');

                checkHash();

            } catch (e) {
                console.error(e);
                document.getElementById('filesContainer').innerHTML = `<p class="loading" style="color:#ef4444">Failed to load content.</p>`;
            }
        }

        function openFile(noExtName) {
            window.location.hash = noExtName;
        }

        function toggleView(showContent) {
            const list = document.getElementById('fileListView');
            const content = document.getElementById('fileContentView');
            if (showContent) {
                list.classList.remove('active');
                content.classList.add('active');
            } else {
                content.classList.remove('active');
                list.classList.add('active');
                document.getElementById('contentFrame').innerHTML = '';
            }
        }

        function checkHash() {
            const hash = decodeURIComponent(window.location.hash.substring(1));
            if (!hash) {
                toggleView(false);
                return;
            }

            const file = filesData.find(f => f.name.replace(/\.[^/.]+$/, "") === hash);
            if (file) {
                toggleView(true);
                loadContent(file.name);
            } else {
                toggleView(false);
            }
        }

        function loadContent(filename) {
            const frame = document.getElementById('contentFrame');
            frame.innerHTML = '';

            const iframe = document.createElement('iframe');
            iframe.src = CONTENT_BASE_PATH + filename;
            iframe.style.cssText = 'width:100%; border:none; min-height:100vh;';

            iframe.onload = function() {
                try {
                    const body = iframe.contentDocument.body;
                    const html = iframe.contentDocument.documentElement;
                    const height = Math.max(
                        body.scrollHeight, body.offsetHeight,
                        html.clientHeight, html.scrollHeight, html.offsetHeight
                    );
                    iframe.style.height = height + 'px';
                } catch(e) {
                    iframe.style.height = '100vh';
                }
            };

            frame.appendChild(iframe);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.file-card').forEach(card => {
                const name = card.getAttribute('data-name');
                card.style.display = name.includes(term) ? 'flex' : 'none';
            });
        });

        window.addEventListener('hashchange', checkHash);
        window.addEventListener('DOMContentLoaded', (e) => {
            if (e.isSynthetic) return;
            loadFiles();
        });
    </script>
</body>

</html>
