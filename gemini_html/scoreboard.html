<!DOCTYPE html>
<html lang="ko">

<head>
  <link rel="icon" type="image/svg+xml" href="/gemini_html/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5인 인터랙티브 점수판 v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f5f5f4;
        }

        .chart-container-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            height: 300px;
            max-height: 400px;
        }

        .score-display {
            transition: all 0.2s ease-out;
        }

        .score-updated {
            transform: scale(1.15);
            color: #ef4444;
        }

        .player-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }

        /* Modal Backdrop */
        #resetModal {
            backdrop-filter: blur(4px);
            transition: opacity 0.2s ease-in-out;
        }

        .hidden-modal {
            opacity: 0;
            pointer-events: none;
        }
    </style>
    <!-- Chosen Palette: Stone (Neutrals) with accents of Indigo, Rose, and Emerald -->
    <!-- Application Structure Plan: 
         1. Visualization Area: Dynamic bar chart showing real-time rankings.
         2. Control Dashboard: Grid of 5 player cards with score management (+10, +30, +50 and -10 for correction).
         3. Custom Modal: Handles sensitive actions like "Reset All" to bypass browser alert restrictions.
         4. History Log: Tracks every transaction for accountability.
         Rationale: Using an internal modal ensures functionality in all environments where browser popups are blocked.
    -->
    <!-- Visualization & Content Choices:
         - Bar Chart: Best for comparing categorical data (players).
         - Custom Modal: Replaces native confirm() for better reliability.
         - Correction Button: -10 value added to satisfy user requirement for error correction.
         CONFIRMATION: NO SVG graphics used. NO Mermaid JS used.
    -->
</head>

<body class="text-stone-800">

    <!-- App Container -->
    <div class="min-h-screen flex flex-col items-center py-8 px-4 sm:px-6 lg:px-8">

        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-stone-900 mb-2">🏆 실시간 점수판 v2</h1>
            <p class="text-stone-500">실수 보정 기능(-10)이 추가된 5인용 점수판입니다.</p>
        </header>

        <!-- Ranking Chart Section -->
        <section class="w-full max-w-5xl bg-white rounded-2xl shadow-sm p-6 mb-8 border border-stone-200">
            <div class="flex items-center justify-between mb-4 border-b border-stone-100 pb-2">
                <div>
                    <h2 class="text-xl font-bold text-stone-700">📊 실시간 순위</h2>
                    <p class="text-xs text-stone-400">데이터가 실시간으로 동기화됩니다.</p>
                </div>
                <button onclick="showResetModal()"
                    class="bg-stone-800 hover:bg-black text-white px-4 py-2 rounded-lg text-sm font-medium transition-all shadow-md">
                    🔄 전체 초기화
                </button>
            </div>

            <div class="chart-container-wrapper">
                <canvas id="scoreChart"></canvas>
            </div>
        </section>

        <!-- Player Cards Grid -->
        <section class="w-full max-w-6xl mb-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4" id="playerGrid">
                <!-- JavaScript injected cards -->
            </div>
        </section>

        <!-- Log Section -->
        <section class="w-full max-w-4xl bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden">
            <div class="bg-stone-50 px-6 py-3 border-b border-stone-200">
                <h3 class="font-bold text-stone-700">📜 최근 로그</h3>
            </div>
            <ul id="activityLog" class="divide-y divide-stone-100 text-sm max-h-48 overflow-y-auto">
                <li class="px-6 py-3 text-stone-400 italic text-center">점수를 입력하면 기록이 이곳에 표시됩니다.</li>
            </ul>
        </section>

    </div>

    <!-- Custom Reset Modal -->
    <div id="resetModal" class="fixed inset-0 bg-stone-900/60 z-50 flex items-center justify-center p-4 hidden-modal">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 transform transition-all">
            <h3 class="text-xl font-bold text-stone-900 mb-2 text-center">점수판 초기화</h3>
            <p class="text-stone-500 text-center mb-6">정말로 모든 플레이어의 점수를 0으로 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.</p>
            <div class="flex space-x-3">
                <button onclick="hideResetModal()"
                    class="flex-1 px-4 py-3 bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold rounded-xl transition-colors">
                    취소
                </button>
                <button onclick="confirmReset()"
                    class="flex-1 px-4 py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl transition-colors shadow-lg">
                    네, 초기화합니다
                </button>
            </div>
        </div>
    </div>

    <script>
        const gameState = {
            players: [
                { id: 1, name: '플레이어 1', score: 0, color: 'rgba(79, 70, 229, 0.8)', border: 'rgb(79, 70, 229)' },
                { id: 2, name: '플레이어 2', score: 0, color: 'rgba(225, 29, 72, 0.8)', border: 'rgb(225, 29, 72)' },
                { id: 3, name: '플레이어 3', score: 0, color: 'rgba(5, 150, 105, 0.8)', border: 'rgb(5, 150, 105)' },
                { id: 4, name: '플레이어 4', score: 0, color: 'rgba(217, 119, 6, 0.8)', border: 'rgb(217, 119, 6)' },
                { id: 5, name: '플레이어 5', score: 0, color: 'rgba(124, 58, 237, 0.8)', border: 'rgb(124, 58, 237)' }
            ]
        };

        let chartInstance = null;

        // Initialization
        window.onload = () => {
            renderGrid();
            initChart();
        };

        function renderGrid() {
            const grid = document.getElementById('playerGrid');
            grid.innerHTML = '';

            gameState.players.forEach(player => {
                const card = document.createElement('div');
                card.className = "player-card bg-white rounded-2xl shadow-sm border-t-8 p-4 flex flex-col";
                card.style.borderTopColor = player.border;

                card.innerHTML = `
                    <div class="mb-4">
                        <input type="text" value="${player.name}" 
                               onchange="updateName(${player.id}, this.value)"
                               class="text-center w-full font-bold text-stone-800 bg-transparent border-b border-stone-50 focus:border-stone-400 focus:outline-none py-1">
                    </div>
                    
                    <div class="text-center py-4 bg-stone-50 rounded-xl mb-4">
                        <span class="block text-[10px] font-bold text-stone-400 tracking-tighter uppercase">Current Score</span>
                        <div id="score-val-${player.id}" class="score-display text-4xl font-black text-stone-900">
                            ${player.score}
                        </div>
                    </div>

                    <div class="space-y-2">
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="adjustScore(${player.id}, 10)" class="bg-stone-100 hover:bg-indigo-50 hover:text-indigo-600 font-bold py-2 rounded-lg transition-all text-sm border border-stone-200">+10</button>
                            <button onclick="adjustScore(${player.id}, 30)" class="bg-stone-100 hover:bg-indigo-50 hover:text-indigo-600 font-bold py-2 rounded-lg transition-all text-sm border border-stone-200">+30</button>
                        </div>
                        <button onclick="adjustScore(${player.id}, 50)" class="w-full bg-stone-800 hover:bg-black text-white font-bold py-3 rounded-xl transition-all shadow-md text-sm">+50 BIG WIN</button>
                        
                        <!-- Correction Button -->
                        <button onclick="adjustScore(${player.id}, -10)" class="w-full mt-2 bg-rose-50 hover:bg-rose-100 text-rose-600 font-medium py-1.5 rounded-lg transition-all text-xs border border-rose-100">
                            실수 보정 (-10)
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function initChart() {
            const ctx = document.getElementById('scoreChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: gameState.players.map(p => p.name),
                    datasets: [{
                        data: gameState.players.map(p => p.score),
                        backgroundColor: gameState.players.map(p => p.color),
                        borderRadius: 6,
                        barThickness: 40
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#f3f4f6' } },
                        x: { grid: { display: false } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function updateChart() {
            if (!chartInstance) return;
            chartInstance.data.labels = gameState.players.map(p => p.name);
            chartInstance.data.datasets[0].data = gameState.players.map(p => p.score);
            chartInstance.update();
        }

        function adjustScore(id, amount) {
            const player = gameState.players.find(p => p.id === id);
            if (!player) return;

            player.score += amount;

            // UI Update
            const scoreEl = document.getElementById(`score-val-${id}`);
            scoreEl.innerText = player.score;
            scoreEl.classList.add('score-updated');
            setTimeout(() => scoreEl.classList.remove('score-updated'), 200);

            updateChart();
            addLog(player.name, `${amount > 0 ? '+' : ''}${amount}점 변경 (합계: ${player.score}점)`);
        }

        function updateName(id, newName) {
            const player = gameState.players.find(p => p.id === id);
            if (player) {
                const oldName = player.name;
                player.name = newName;
                updateChart();
                addLog('시스템', `'${oldName}'님이 '${newName}'님으로 변경되었습니다.`);
            }
        }

        // Custom Modal Logic
        function showResetModal() {
            document.getElementById('resetModal').classList.remove('hidden-modal');
        }

        function hideResetModal() {
            document.getElementById('resetModal').classList.add('hidden-modal');
        }

        function confirmReset() {
            gameState.players.forEach(p => {
                p.score = 0;
                const el = document.getElementById(`score-val-${p.id}`);
                if (el) el.innerText = 0;
            });
            updateChart();
            addLog('시스템', '모든 점수가 초기화되었습니다.');
            hideResetModal();
        }

        function addLog(actor, msg) {
            const logList = document.getElementById('activityLog');
            const li = document.createElement('li');
            li.className = "px-6 py-2 flex justify-between items-center bg-white";
            const now = new Date();
            const time = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

            li.innerHTML = `
                <span class="font-medium text-stone-700"><span class="text-stone-400 mr-2 text-xs">${time}</span>${actor}</span>
                <span class="text-stone-500 text-xs">${msg}</span>
            `;
            logList.insertBefore(li, logList.firstChild);

            if (logList.children.length > 15) logList.removeChild(logList.lastChild);
        }
    </script>
</body>

</html>
