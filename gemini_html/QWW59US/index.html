<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 AIVE-CONTEST - Research & Analysis</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
            background: #FFF500;
            min-height: 100vh;
            color: #000;
        }

        /* ── 리스트 뷰 ── */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px 60px;
        }

        /* ── 헤더 ── */
        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header-inner {
            display: inline-block;
            background: #000;
            color: #FFF500;
            padding: 20px 48px 22px;
            border: 4px solid #000;
            box-shadow: 8px 8px 0 #000;
            position: relative;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1;
            text-transform: uppercase;
        }

        .header p {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-top: 8px;
            color: #FFE066;
        }

        /* ── 검색 ── */
        .search-box {
            margin-bottom: 32px;
        }

        .search-input {
            width: 100%;
            padding: 16px 22px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 700;
            background: #fff;
            border: 3px solid #000;
            box-shadow: 5px 5px 0 #000;
            outline: none;
            color: #000;
            border-radius: 0;
            transition: box-shadow 0.15s, transform 0.15s;
        }

        .search-input::placeholder {
            color: #888;
            font-weight: 500;
        }

        .search-input:focus {
            box-shadow: 7px 7px 0 #000;
            transform: translate(-2px, -2px);
        }

        /* ── 그리드 ── */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 20px;
        }

        /* ── 카드 ── */
        .file-card {
            background: #fff;
            border: 3px solid #000;
            box-shadow: 6px 6px 0 #000;
            padding: 28px 24px 24px;
            cursor: pointer;
            position: relative;
            transition: box-shadow 0.15s ease, transform 0.15s ease;
        }

        .file-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 9px 9px 0 #000;
        }

        .file-card:active {
            transform: translate(2px, 2px);
            box-shadow: 4px 4px 0 #000;
        }

        /* 카드 상단 컬러 스트라이프 */
        .file-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: #FFF500;
            border-bottom: 3px solid #000;
        }

        .file-icon {
            font-size: 2rem;
            color: #000;
            margin-bottom: 16px;
            margin-top: 4px;
        }

        .file-name {
            font-weight: 800;
            font-size: 1rem;
            color: #000;
            margin-bottom: 10px;
            line-height: 1.35;
        }

        .file-meta {
            font-size: 0.78rem;
            color: #555;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* ── NEW 배지 ── */
        .new-badge {
            position: absolute;
            top: -3px;
            right: 14px;
            background: #FF3B3B;
            color: #fff;
            font-size: 0.6rem;
            font-weight: 800;
            padding: 3px 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border: 2px solid #000;
            border-top: none;
            box-shadow: 3px 3px 0 #000;
            pointer-events: none;
            animation: pulseBadge 2s ease-in-out infinite;
        }

        /* ── 카테고리 배지 ── */
        .cat-badge {
            display: inline-block;
            margin-top: 10px;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 3px 10px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: #FFF500;
            color: #000;
            border: 2px solid #000;
            box-shadow: 2px 2px 0 #000;
        }

        /* ── 콘텐츠 뷰 ── */
        .content-view {
            animation: fadeIn 0.3s ease;
            background: white;
            min-height: 100vh;
        }

        iframe {
            width: 100%;
            border: none;
            height: 100vh;
            display: block;
        }

        /* ── 애니메이션 ── */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseBadge {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.7; }
        }

        /* ── 빈 상태 ── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            border: 3px dashed #000;
            color: #555;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.04em;
        }

        /* ── 반응형 ── */
        @media (max-width: 600px) {
            .header h1 { font-size: 2rem; }
            .header-inner { padding: 16px 28px 18px; }
        }
    </style>
</head>

<body>
    <div id="fileListView" class="container">
        <div class="header">
            <div class="header-inner">
                <h1>🏆 AIVE-CONTEST</h1>
                <p>AI Vision Engineering Contest</p>
            </div>
        </div>
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="SEARCH FILES...">
        </div>
        <div id="filesContainer" class="file-grid"></div>
    </div>

    <div id="fileContentView" class="content-view" style="display:none;">
        <iframe id="contentFrame" style="width:100%;height:100vh;border:none;display:block;"></iframe>
    </div>

    <script>
        const SECRET_LIST_HASH = 'aive-contest-2025';
        const CATEGORY_HASH = 'QWW59US';
        let filesData = [];

        async function init() {
            try {
                const resp = await fetch(`../site.json?v=${Date.now()}`);
                const site = await resp.json();
                filesData = Object.entries(site.files || {})
                    .filter(([, f]) => f.categoryHash === CATEGORY_HASH && f.visible !== false)
                    .sort((a, b) => (a[1].order || 999) - (b[1].order || 999))
                    .map(([hash, f]) => ({ hash, filename: f.filename, displayName: f.displayName, createdAt: f.createdAt, memo: f.memo }));
                renderGrid(); checkHash();
            } catch (e) { showStealth404(); }
        }

        function renderGrid(filter = '') {
            const container = document.getElementById('filesContainer');
            const list = filter
                ? filesData.filter(f => f.displayName.toLowerCase().includes(filter.toLowerCase()))
                : filesData;

            if (!list.length) {
                container.innerHTML = `<div class="empty-state" style="grid-column:1/-1">NO FILES FOUND</div>`;
                return;
            }

            container.innerHTML = list.map(file => `
                <div class="file-card" onclick="location.href='../${file.filename}'" style="position:relative">
                    ${(file.createdAt && (Date.now() - new Date(file.createdAt)) < 604800000) ? '<span class="new-badge">NEW</span>' : ''}
                    <div class="file-icon"><i class="fas fa-file-alt"></i></div>
                    <div class="file-name">${file.displayName}</div>
                    ${file.memo ? '<span class="cat-badge">' + file.memo + '</span>' : ''}
                </div>`).join('');
        }

        document.getElementById('searchInput').addEventListener('input', e => renderGrid(e.target.value));

        function checkHash() {
            const hash = decodeURIComponent(window.location.hash.substring(1));
            if (!hash) return showStealth404();
            if (hash === SECRET_LIST_HASH) toggleView('list');
            else {
                const file = filesData.find(f => f.hash === hash);
                if (file) { toggleView('content'); loadContent(file); } else showStealth404();
            }
        }

        function toggleView(view) {
            document.getElementById('fileListView').style.display = view === 'list' ? 'block' : 'none';
            document.getElementById('fileContentView').style.display = view === 'content' ? 'block' : 'none';
        }

        function loadContent(file) {
            document.getElementById('contentFrame').src = `../${file.filename}?v=${Date.now()}`;
        }

        function showStealth404() {
            document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#f8fafc;color:#94a3b8;"><h1>404 Not Found</h1></div>`;
        }

        window.addEventListener('hashchange', checkHash);
        window.addEventListener('DOMContentLoaded', init);
    </script>
    <!-- Version: 2026-04-09 neobrutalism v5.0 -->
</body>

</html>
