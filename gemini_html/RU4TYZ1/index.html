<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 Private Vault - Personal Archives</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #FDF2F8;
            min-height: 100vh;
            color: #831843;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 900;
            color: #BE185D;
            margin-bottom: 15px;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .file-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(244, 114, 182, 0.1);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #FCE7F3;
        }

        .file-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 30px -10px rgba(244, 114, 182, 0.3);
            border-color: #F9A8D4;
        }

        .file-icon {
            font-size: 2.5rem;
            color: #DB2777;
            margin-bottom: 20px;
        }

        .file-name {
            font-weight: 700;
            font-size: 1.2rem;
            color: #831843;
        }

        .content-view {
            animation: fadeIn 0.6s ease;
            background: white;
            min-height: 100vh;
        }

        .content-header {
            padding: 20px 30px;
            background: #FFF1F2;
            border-bottom: 1px solid #FFE4E6;
            display: flex;
            align-items: center;
        }

        .nav-back {
            background: #F43F5E;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        iframe {
            width: 100%;
            border: none;
            height: calc(100vh - 84px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div id="fileListView" class="container">
        <div class="header">
            <h1>🔒 Private Archives</h1>
            <p>Personal memories and encrypted thoughts</p>
        </div>
        <div id="filesContainer" class="file-grid"></div>
    </div>

    <div id="fileContentView" class="content-view" style="display:none;">
        <div class="content-header">
            <button onclick="window.location.hash=SECRET_LIST_HASH" class="nav-back">
                <i class="fas fa-user-shield"></i> Return
            </button>
        </div>
        <div id="contentFrame"></div>
    </div>

    <script>
        const SECRET_LIST_HASH = 'p-private-key-12';
        const CONFIG_PATH = './files.json';
        const CONTENT_BASE_PATH = './';
        let filesData = [];
        let folderConfig = {};

        async function init() {
            try {
                const resp = await fetch(`${CONFIG_PATH}?v=${new Date().getTime()}`);
                if (!resp.ok) throw e;
                folderConfig = await resp.json();
                const order = folderConfig._order || [];
                filesData = order.map(name => ({ name }));
                renderGrid();
                checkHash();
            } catch (e) { showStealth404(); }
        }

        function renderGrid() {
            const container = document.getElementById('filesContainer');
            const icons = ['lock', 'key', 'user-secret', 'heart', 'feather', 'cloud-moon'];
            container.innerHTML = filesData.map((file, idx) => {
                const displayName = folderConfig[file.name] || file.name.replace('.html', '');
                return `<div class="file-card" onclick="window.location.hash='${file.name.replace(/\.[^/.]+$/, "")}'">
                    <div class="file-icon"><i class="fas fa-${icons[idx % icons.length]}"></i></div>
                    <div class="file-name">${displayName}</div>
                </div>`;
            }).join('');
        }

        function checkHash() {
            const hash = decodeURIComponent(window.location.hash.substring(1));
            if (!hash) return showStealth404();
            if (hash === SECRET_LIST_HASH) toggleView('list');
            else {
                const file = filesData.find(f => f.name.replace(/\.[^/.]+$/, "") === hash);
                if (file) { toggleView('content'); loadContent(file.name); }
                else showStealth404();
            }
        }

        function toggleView(view) {
            document.getElementById('fileListView').style.display = view === 'list' ? 'block' : 'none';
            document.getElementById('fileContentView').style.display = view === 'content' ? 'block' : 'none';
        }

        function loadContent(filename) {
            const frame = document.getElementById('contentFrame');
            frame.innerHTML = '';
            const iframe = document.createElement('iframe');
            iframe.src = `${CONTENT_BASE_PATH}${filename}?v=${new Date().getTime()}`;
            frame.appendChild(iframe);
        }

        function showStealth404() {
            document.body.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#111827; color:#374151;">
                <h1 style="font-size:10vw;">0</h1>
                <p>Null Reference Exception</p>
            </div>`;
        }
        window.addEventListener('hashchange', checkHash);
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
