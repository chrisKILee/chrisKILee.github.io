<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- page.chrisnolja.dev favicon — P shape, two-tone orange -->
  <!-- Primary: #F97316 (Row1) / Secondary: #FED7AA (Row2+Row3) -->
  <!-- 3x3 grid: block 16x16, gap 2, offset 8 -->
  <!-- Row1: primary -->
  <rect x="8"  y="8"  width="16" height="16" rx="3" fill="#F97316"/>
  <rect x="26" y="8"  width="16" height="16" rx="3" fill="#F97316"/>
  <!-- Row2: secondary -->
  <rect x="8"  y="26" width="16" height="16" rx="3" fill="#FED7AA"/>
  <rect x="26" y="26" width="16" height="16" rx="3" fill="#FED7AA"/>
  <!-- Row3: secondary -->
  <rect x="8"  y="44" width="16" height="16" rx="3" fill="#FED7AA"/>
</svg>
