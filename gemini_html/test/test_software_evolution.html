<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Software Evolution Page Test</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }

        iframe {
            width: 100%;
            height: 800px;
            border: 1px solid #ccc;
            background: white;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h1>🧪 Software Evolution Page & Rules Test</h1>
    <div id="results">Running tests...</div>
    <iframe id="testFrame" src="../01_rnd/software_development_evolution.html"></iframe>

    <script>
        const frame = document.getElementById('testFrame');
        const results = document.getElementById('results');

        function log(msg, status) {
            const div = document.createElement('div');
            div.textContent = `[${status.toUpperCase()}] ${msg}`;
            div.className = status;
            results.appendChild(div);
            console.log(`[${status.toUpperCase()}] ${msg}`);
        }

        async function runTests() {
            const doc = frame.contentDocument || frame.contentWindow.document;

            try {
                // 1. Title/Header Check
                const header = doc.querySelector('h1');
                if (header && header.textContent.includes('소프트웨어 공학의 진화')) {
                    log("Header found.", "pass");
                } else {
                    log("Header NOT found or incorrect.", "fail");
                }

                // 2. Button Existence
                const genBtn = doc.getElementById('generateBtn');
                if (genBtn) {
                    log("'Generate Spec' Button found.", "pass");
                } else {
                    log("'Generate Spec' Button NOT found.", "fail");
                }

                // 3. Rule Check: No Iframe in content
                if (doc.querySelector('iframe')) {
                    log("FAIL: Page contains an Iframe (Rule Violation).", "fail");
                } else {
                    log("PASS: No Iframes found in page.", "pass");
                }

                // 4. Rule Check: No Back Button
                // Checking for common classes or text for back buttons
                const buttons = Array.from(doc.querySelectorAll('button, a'));
                const backBtn = buttons.find(b => b.textContent.toLowerCase().includes('back') || b.textContent.includes('뒤로'));

                if (backBtn) {
                    log(`FAIL: Potential Back Button found: "${backBtn.textContent}"`, "fail");
                } else {
                    log("PASS: No obvious Back Button found.", "pass");
                }

                // 5. Test Interaction (Mocking Fetch if needed)
                if (genBtn) {
                    // Mocking fetch in the iframe window to avoid actual API calls and just test UI logic
                    frame.contentWindow.fetch = async () => {
                        return {
                            ok: true,
                            json: async () => ({
                                candidates: [{ content: { parts: [{ text: "**Test Spec**\n### Plan\n- Step 1" }] } }]
                            })
                        };
                    };

                    const input = doc.getElementById('requirementInput');
                    input.value = "테스트 요구사항입니다.";
                    genBtn.click();

                    // Check for spinner or disabled state immediately
                    if (genBtn.disabled) {
                        log("PASS: Button disabled on click (SPA behavior).", "pass");
                    } else {
                        log("FAIL: Button not disabled on click.", "fail");
                    }

                    // Wait for result
                    await new Promise(r => setTimeout(r, 500));
                    const output = doc.getElementById('aiOutput');
                    if (output && output.innerHTML.includes('Test Spec')) {
                        log("PASS: Logic executed and updated DOM (SPA successful).", "pass");
                    } else {
                        log("FAIL: Logic did not update DOM.", "fail");
                    }
                }

            } catch (e) {
                log(`ERROR: ${e.message}`, "fail");
            }
        }

        frame.onload = () => {
            setTimeout(runTests, 1000);
        };
    </script>
</body>

</html>
