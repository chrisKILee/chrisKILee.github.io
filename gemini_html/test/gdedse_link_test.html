<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>GDEDSE Link Logic Test</title>
    <style>
        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>GDEDSE Link Logic Test</h1>
    <div id="test-results"></div>

    <!-- Mock Container -->
    <div id="contentArea" style="display:none;"></div>

    <!-- Mock Toast -->
    <div id="toast" style="display:none;"></div>
    <div id="totalFiles"></div>
    <div id="totalFolders"></div>
    <input type="text" id="searchInput" />

    <!-- Mock Config -->
    <script>
        window.FOLDER_CONFIG = {
            '01_rnd': {
                '_folderName': 'R&D',
                'test_file.html': 'Test File Title'
            }
        };
    </script>

    <!-- Load Object Under Test -->
    <script src="../GDEDSE/gdedse_main.js"></script>

    <script>
        function runTests() {
            const results = document.getElementById('test-results');

            try {
                // Initialize
                if (typeof init !== 'function') {
                    throw new Error("init function not found");
                }
                init();

                // Check generated links
                const links = document.querySelectorAll('#contentArea a');
                if (links.length === 0) {
                    throw new Error("No links generated");
                }

                const link = links[0];
                const href = link.getAttribute('href');

                // Expectation: logic should generate hash link
                // e.g., ../AED13WE/#test_file

                const expectedStart = '../AED13WE/#';
                const notExpectedEnd = '.html';

                let log = '';
                let pass = true;

                if (!href.includes(expectedStart)) {
                    log += `<div class="fail">FAIL: Link start mismatch. Got: ${href}, Expected to contain: ${expectedStart}</div>`;
                    pass = false;
                } else {
                    log += `<div class="pass">PASS: Link contains correct hash path.</div>`;
                }

                if (href.endsWith(notExpectedEnd)) {
                    log += `<div class="fail">FAIL: Link ends with .html. Got: ${href}</div>`;
                    pass = false;
                } else {
                    log += `<div class="pass">PASS: Link does not end with .html.</div>`;
                }

                // Check name extraction (test_file.html -> test_file)
                if (!href.includes('test_file') || href.includes('test_file.html')) {
                    // Wait, if it shouldn't end with .html, the second condition is redundant but explicit
                    if (href.endsWith('test_file')) {
                        log += `<div class="pass">PASS: Filename extension removed.</div>`;
                    } else {
                        log += `<div class="fail">FAIL: Filename extension issue. Got: ${href}</div>`;
                        pass = false;
                    }
                }

                results.innerHTML = log;

                if (pass) {
                    results.innerHTML += '<h2 class="pass">ALL TESTS PASSED</h2>';
                } else {
                    results.innerHTML += '<h2 class="fail">TESTS FAILED</h2>';
                }

            } catch (e) {
                results.innerHTML += `<div class="fail">ERROR: ${e.message}</div>`;
            }
        }

        window.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>

</html>
