<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Nano Banana Tab Logic Test</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }

        iframe {
            width: 100%;
            height: 600px;
            border: 1px solid #ccc;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h1>🍌 Nano Banana Tab UI Test</h1>
    <div id="results">Running tests...</div>
    <iframe id="testFrame" src="../04_AI_Study/nano-banana.html"></iframe>

    <script>
        const frame = document.getElementById('testFrame');
        const results = document.getElementById('results');

        function log(msg, status) {
            const div = document.createElement('div');
            div.textContent = msg;
            div.className = status;
            results.appendChild(div);
        }

        async function runTests() {
            const doc = frame.contentDocument || frame.contentWindow.document;

            // 1. Check if Tab Container exists
            const tabNav = doc.querySelector('.tab-navigation');
            if (!tabNav) {
                log("[FAIL] Tab Navigation (.tab-navigation) not found. (Expected failure before refactor)", "fail");
            } else {
                log("[PASS] Tab Navigation found.", "pass");
            }

            // 2. Check for 3 Tab Buttons
            const buttons = doc.querySelectorAll('.tab-btn');
            if (buttons.length !== 3) {
                log(`[FAIL] Expected 3 tab buttons, found ${buttons.length}.`, "fail");
            } else {
                log("[PASS] 3 Tab buttons found.", "pass");
            }

            // 3. Check for Content Containers
            const contents = doc.querySelectorAll('.tab-content');
            if (contents.length !== 3) {
                log(`[FAIL] Expected 3 tab content blocks, found ${contents.length}.`, "fail");
            } else {
                log("[PASS] 3 Content blocks found.", "pass");
            }

            // 4. Test Interaction (Simulation)
            // Only proceed if buttons exist
            if (buttons.length === 3 && contents.length === 3) {
                // Initial State: Tab 0 active, Content 0 visible
                if (buttons[0].classList.contains('active') && contents[0].style.display !== 'none') {
                    log("[PASS] Initial state correct (Tab 1 active).", "pass");
                } else {
                    log("[FAIL] Initial state incorrect.", "fail");
                }

                // Click Tab 2
                buttons[1].click();
                await new Promise(r => setTimeout(r, 100)); // wait for transition

                if (buttons[1].classList.contains('active') && !buttons[0].classList.contains('active') &&
                    contents[1].style.display !== 'none' && contents[0].style.display === 'none') {
                    log("[PASS] Switching to Tab 2 works.", "pass");
                } else {
                    log("[FAIL] Switching to Tab 2 failed.", "fail");
                }
            }
        }

        frame.onload = () => {
            // Give a slight delay for scripts to initialize
            setTimeout(runTests, 500);
        };
    </script>
</body>

</html>
