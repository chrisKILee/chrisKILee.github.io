<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Test Travel Folder (C8PQ4X1)</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }

        iframe {
            width: 100%;
            height: 600px;
            border: 1px solid #ccc;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h1>Test Suite: Travel Folder (C8PQ4X1)</h1>
    <div id="logs"></div>
    <!-- Load the target page -->
    <iframe id="targetFrame" src="../C8PQ4X1/index.html"></iframe>

    <script type="module">
        const logs = document.getElementById('logs');
        const iframe = document.getElementById('targetFrame');

        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.textContent = msg;
            if (type === 'pass') div.className = 'pass';
            if (type === 'fail') div.className = 'fail';
            logs.appendChild(div);
            // Also log to console for the browser tool to catch
            console.log(`[${type.toUpperCase()}] ${msg}`);
        }

        async function runTests() {
            log('Waiting for iframe to load...');
            await new Promise(resolve => iframe.onload = resolve);

            const win = iframe.contentWindow;
            const doc = iframe.contentDocument;

            log('Step 1: Verify Initial Load');
            if (doc.body.textContent.includes('Travel')) {
                log('PASS: Travel folder loaded', 'pass');
            } else {
                log('FAIL: Travel folder title not found', 'fail');
            }

            // Mock fetch if needed? 
            // The page uses fetch to get github api. 
            // In local environment, fetching from github api should work if no CORS issues?
            // "GITHUB_API = https://api.github.com..." -> This usually hits rate limits or CORS in plain HTML if not careful, 
            // but the original code was using it. 
            // Let's assume the user has a way to run this or the mock data is cached?
            // Actually, we can assume the user wants us to test the *rendering* logic, specifically the `loadContent` fix.

            // We can manually trigger loadContent with a known file if we can access the function.
            // But `loadContent` is internal/global.

            log('Step 2: Triggering Content Load (Simulating Hash Change)');
            // We need to wait for file list? 
            // Let's force load a known file "kyoto_family_trip.html" by mocking the fetch response for content?
            // Or just setting the hash if the file list loaded?

            // Wait a sec for the script to initialize
            await new Promise(r => setTimeout(r, 1000));

            win.location.hash = 'kyoto_family_trip';
            // Determining completion is hard without events. Wait.
            await new Promise(r => setTimeout(r, 3000)); // Give it time to fetch and render

            log('Step 3: Checking Content Injection');
            // Check if styles were injected
            const headLinks = doc.querySelectorAll('head link');
            const tailwind = Array.from(headLinks).find(l => l.href.includes('tailwindcss') || l.href.includes('../js/gemini_config.js'));
            // The original kyoto file has tailwind script, not link. And google fonts link.
            const googleFonts = Array.from(headLinks).find(l => l.href.includes('fonts.googleapis.com'));

            if (googleFonts) {
                log('PASS: Head elements (Google Fonts) injected from fetched content', 'pass');
            } else {
                log('FAIL: Google Fonts link not found in head (Content Injection broken?)', 'fail');
            }

            log('Step 4: Checking Back Button Removal');
            const backBtn = doc.querySelector('.nav-back');
            const keywords = ['back', 'list', '뒤로'];
            const buttons = Array.from(doc.querySelectorAll('div, button, a'));
            const foundBack = buttons.find(el => {
                const txt = el.textContent.toLowerCase();
                return keywords.some(k => txt.includes(k)) && el.offsetParent !== null; // visible
            });

            if (!backBtn && !foundBack) {
                log('PASS: No Back button found', 'pass');
            } else {
                log(`FAIL: Back button detected: ${foundBack ? foundBack.textContent : 'nav-back class'}`, 'fail');
            }
        }

        // Run
        setTimeout(runTests, 1000);
    </script>
</body>

</html>
