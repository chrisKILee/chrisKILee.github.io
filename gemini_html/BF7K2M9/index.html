<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💼 Work - Professional Projects</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Version: 3.0 - Dark Premium Corporate Theme */
        :root {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --bg-dark: #0f172a;
            --bg-lighter: #1e293b;
            --card-glass: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --accent-gradient-start: #60a5fa;
            --accent-gradient-end: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-lighter) 100%);
            min-height: 100vh;
            padding: 60px 20px 80px;
            color: var(--text-primary);
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(99, 102, 241, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .page-header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .page-title {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--accent-gradient-start) 0%, var(--accent-gradient-end) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.03em;
            line-height: 1.2;
            text-shadow: 0 0 40px var(--primary-glow);
        }

        .page-subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            font-weight: 500;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Search */
        .search-container {
            max-width: 700px;
            margin: 0 auto 60px;
            position: relative;
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
        }

        .search-wrapper {
            position: relative;
            background: var(--card-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-wrapper:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.2);
        }

        .search-wrapper:focus-within {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            box-shadow: 0 8px 32px var(--primary-glow);
        }

        .search-icon {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 20px;
            pointer-events: none;
            z-index: 1;
        }

        .search-input {
            width: 100%;
            padding: 20px 24px 20px 60px;
            border: none;
            border-radius: 16px;
            font-size: 1.0625rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            color: var(--text-primary);
            background: transparent;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Grid */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 28px;
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
        }

        .file-card {
            background: var(--card-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 32px;
            border: 1px solid var(--card-border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .file-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--accent-gradient-start) 0%, var(--accent-gradient-end) 100%);
            opacity: 0;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .file-card::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .file-card:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(59, 130, 246, 0.3), 0 0 0 1px var(--primary);
        }

        .file-card:hover::before {
            opacity: 1;
        }

        .file-card:hover::after {
            width: 400px;
            height: 400px;
            opacity: 0.15;
        }

        .file-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent-gradient-start) 0%, var(--accent-gradient-end) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 16px var(--primary-glow);
            position: relative;
            z-index: 1;
        }

        .file-card:hover .file-icon {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 8px 24px var(--primary-glow);
        }

        .file-icon i {
            font-size: 26px;
            color: white;
        }

        .file-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.4;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            position: relative;
            z-index: 1;
        }

        .file-meta {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9375rem;
            color: var(--text-secondary);
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        .file-size {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .file-badge {
            padding: 6px 14px;
            background: linear-gradient(135deg, var(--accent-gradient-start) 0%, var(--accent-gradient-end) 100%);
            color: white;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8125rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        /* Loading */
        .loading {
            text-align: center;
            grid-column: 1 / -1;
            padding: 60px;
            color: var(--text-muted);
            font-size: 1.125rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-title {
                font-size: 2.5rem;
            }

            .page-subtitle {
                font-size: 1.0625rem;
            }

            .file-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .file-card {
                padding: 24px;
            }
        }

        /* View Toggle */
        #fileListView.active {
            display: block;
        }

        #fileContentView {
            display: none;
        }

        #fileContentView.active {
            display: block;
        }

        #fileListView {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- List View -->
        <div id="fileListView" class="active">
            <header class="page-header">
                <h1 class="page-title">Professional Projects</h1>
                <p class="page-subtitle">Enterprise solutions and business initiatives</p>
            </header>

            <div class="search-container">
                <div class="search-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search work projects...">
                </div>
            </div>

            <div id="filesContainer" class="file-grid">
                <div class="loading">Loading files...</div>
            </div>
        </div>

        <!-- Content View -->
        <div id="fileContentView">
            <div id="contentFrame"></div>
        </div>
    </div>

    <script>
        const GITHUB_API = `https://api.github.com/repos/chrisKILee/chrisKILee.github.io/contents/gemini_html/02_work`;
        const CONFIG_PATH = '../02_work/files.json';
        const CONTENT_BASE_PATH = '../02_work/';

        let filesData = [];

        async function loadFiles() {
            try {
                const filesResp = await fetch(GITHUB_API);
                if (!filesResp.ok) throw new Error('GitHub API Error');
                const rawFiles = await filesResp.json();

                filesData = rawFiles.filter(item =>
                    item.type === 'file' &&
                    !['files.json', 'files_config.js', 'index.html'].includes(item.name) &&
                    !item.name.endsWith('.Identifier')
                );

                let config = {};
                try {
                    const cfgResp = await fetch(CONFIG_PATH);
                    if (cfgResp.ok) config = await cfgResp.json();
                } catch (e) { }

                const order = config._order || [];
                const sorted = [...filesData].sort((a, b) => {
                    const idxA = order.indexOf(a.name);
                    const idxB = order.indexOf(b.name);
                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return a.name.localeCompare(b.name);
                });

                const icons = ['briefcase', 'chart-line', 'file-contract', 'project-diagram', 'tasks', 'clipboard-list', 'diagram-project', 'building'];

                document.getElementById('filesContainer').innerHTML = sorted.map((file, idx) => {
                    const displayName = config[file.name] || file.name;
                    const fileNameNoExt = file.name.replace(/\.[^/.]+$/, "");
                    const ext = file.name.split('.').pop().toUpperCase();
                    const icon = icons[idx % icons.length];
                    return `
                        <div class="file-card" onclick="openFile('${fileNameNoExt}')" data-name="${file.name.toLowerCase()}">
                            <div class="file-icon">
                                <i class="fas fa-${icon}"></i>
                            </div>
                            <div class="file-name">${displayName}</div>
                            <div class="file-meta">
                                <span class="file-size">
                                    <i class="fas fa-file-alt"></i>
                                    ${(file.size / 1024).toFixed(1)} KB
                                </span>
                                <span class="file-badge">${ext}</span>
                            </div>
                        </div>
                     `;
                }).join('');

                checkHash();

            } catch (e) {
                console.error(e);
                document.getElementById('filesContainer').innerHTML = `<p class="loading" style="color:#ef4444">Failed to load content.</p>`;
            }
        }

        function openFile(noExtName) {
            window.location.hash = noExtName;
        }

        function toggleView(showContent) {
            const list = document.getElementById('fileListView');
            const content = document.getElementById('fileContentView');
            if (showContent) {
                list.classList.remove('active');
                content.classList.add('active');
            } else {
                content.classList.remove('active');
                list.classList.add('active');
                document.getElementById('contentFrame').innerHTML = '';
            }
        }

        function checkHash() {
            const hash = decodeURIComponent(window.location.hash.substring(1));
            if (!hash) {
                toggleView(false);
                return;
            }

            const file = filesData.find(f => f.name.replace(/\.[^/.]+$/, "") === hash);
            if (file) {
                toggleView(true);
                loadContent(file.name);
            } else {
                toggleView(false);
            }
        }

        async function loadContent(filename) {
            const frame = document.getElementById('contentFrame');
            const SCOPE_CLASS = 'imported-content';

            if (!filename) {
                frame.innerHTML = '';
                return;
            }

            frame.innerHTML = '<div style="text-align:center; padding:40px; color:#94a3b8;">Loading...</div>';

            document.querySelectorAll('.imported-style').forEach(el => el.remove());
            document.querySelectorAll('.imported-script').forEach(el => {
                if (el.src && el.src.startsWith('blob:')) URL.revokeObjectURL(el.src);
                el.remove();
            });

            try {
                const response = await fetch(CONTENT_BASE_PATH + filename);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                doc.querySelectorAll('style').forEach(style => {
                    const newStyle = document.createElement('style');
                    newStyle.textContent = style.textContent.replace(/(^|[\s,}])(body|html)([\s,{])/gi, `$1.${SCOPE_CLASS}$3`);
                    newStyle.classList.add('imported-style');
                    document.head.appendChild(newStyle);
                });

                doc.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
                    const newLink = document.createElement('link');
                    newLink.rel = 'stylesheet';
                    newLink.classList.add('imported-style');
                    const href = link.getAttribute('href');
                    if (href) {
                        newLink.href = (href.startsWith('http') || href.startsWith('//')) ? href : CONTENT_BASE_PATH + href;
                        document.head.appendChild(newLink);
                    }
                });

                const bodyClasses = doc.body.className;
                const bodyStyles = doc.body.getAttribute('style') || '';
                frame.style.padding = '0';
                frame.style.background = 'transparent';
                frame.style.boxShadow = 'none';
                frame.innerHTML = `<div id="importedRoot" class="${SCOPE_CLASS} ${bodyClasses}" style="${bodyStyles}; width:100%; min-height:100%; position:relative;">${doc.body.innerHTML}</div>`;

                frame.querysAll('img').forEach(img => {
                    const src = img.getAttribute('src');
                    if (src && !src.startsWith('http') && !src.startsWith('//') && !src.startsWith('data:')) {
                        img.setAttribute('src', CONTENT_BASE_PATH + src);
                    }
                });

                const scriptsArr = Array.from(doc.querySelectorAll('script'));
                await new Promise(r => setTimeout(r, 200));

                for (const s of scriptsArr) {
                    await new Promise(async (resolve) => {
                        const newS = document.createElement('script');
                        newS.classList.add('imported-script');

                        Array.from(s.attributes).forEach(attr => {
                            if (attr.name !== 'src' && attr.name !== 'type') newS.setAttribute(attr.name, attr.value);
                        });

                        const src = s.getAttribute('src');
                        const type = s.getAttribute('type');

                        if (src) {
                            if (src.includes('node_modules')) {
                                newS.src = `https://cdn.jsdelivr.net/npm/${src.split('node_modules/')[1]}`;
                            } else {
                                newS.src = (src.startsWith('http') || src.startsWith('//')) ? src : CONTENT_BASE_PATH + src;
                            }
                            newS.onload = () => resolve();
                            newS.onerror = () => resolve();
                            document.body.appendChild(newS);
                        } else {
                            newS.textContent = s.textContent;
                            if (type) newS.type = type;
                            document.body.appendChild(newS);
                            resolve();
                        }
                    });
                }

            } catch (e) {
                console.error(e);
                frame.innerHTML = `<div style="padding:40px; color:#ef4444;">Error: ${e.message}</div>`;
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.file-card').forEach(card => {
                const name = card.getAttribute('data-name');
                card.style.display = name.includes(term) ? 'flex' : 'none';
            });
        });

        window.addEventListener('hashchange', checkHash);
        window.addEventListener('DOMContentLoaded', (e) => {
            if (e.isSynthetic) return;
            loadFiles();
        });
    </script>
</body>

</html>
