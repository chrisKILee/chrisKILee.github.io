<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💼 Work - Professional Documents</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0F172A;
            min-height: 100vh;
            color: #E2E8F0;
            transition: background 0.5s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.8;
            font-weight: 300;
        }

        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .stat-card {
            background: #1E293B;
            border-radius: 15px;
            padding: 15px 30px;
            border: 1px solid #334155;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 1.8rem;
            color: white;
        }

        .search-box {
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 16px 25px;
            font-size: 1rem;
            border: 2px solid #334155;
            border-radius: 15px;
            background: #1E293B;
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .file-card {
            background: #1E293B;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            border: 1px solid #334155;
        }

        .file-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
            border-color: #60A5FA;
        }

        .file-icon {
            font-size: 2rem;
            color: #60A5FA;
            margin-bottom: 16px;
        }

        .file-name {
            font-weight: 600;
            color: #F1F5F9;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .file-meta {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #94A3B8;
        }

        .file-badge {
            background: #334155;
            color: #60A5FA;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .content-view {
            animation: fadeIn 0.5s ease;
            background: white;
            min-height: 100vh;
            color: #333;
        }

        .content-header {
            padding: 15px 25px;
            background: #F8FAFC;
            border-bottom: 1px solid #E2E8F0;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-back {
            background: #CBD5E1;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            color: #1E293B;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .nav-back:hover {
            background: #94A3B8;
        }

        iframe {
            width: 100%;
            border: none;
            height: calc(100vh - 70px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div id="fileListView" class="container">
        <div class="header">
            <h1>💼 Professional Work</h1>
            <p>Corporate Strategies & Project Assets</p>
        </div>
        <div class="stats">
            <div class="stat-card">
                <h3 id="totalFiles">0</h3>
                <p>Documents</p>
            </div>
        </div>
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="Search documents...">
        </div>
        <div id="filesContainer" class="file-grid"></div>
    </div>

    <div id="fileContentView" class="content-view" style="display:none;">
        <div id="contentFrame"></div>
    </div>

    <script>
        const SECRET_LIST_HASH = 'w-work-auth-88';
        const CONFIG_PATH = './files.json';
        const CONTENT_BASE_PATH = './';

        let filesData = [];
        let folderConfig = {};

        async function init() {
            try {
                const resp = await fetch(`${CONFIG_PATH}?v=${new Date().getTime()}`);
                if (!resp.ok) throw new Error('Config Not Found');
                folderConfig = await resp.json();

                const order = folderConfig._order || [];
                filesData = order.map(name => ({ name, type: 'file' }));

                document.getElementById('totalFiles').innerText = filesData.length;
                renderGrid();
                checkHash();
            } catch (e) {
                console.error(e);
                showStealth404();
            }
        }

        function renderGrid() {
            const container = document.getElementById('filesContainer');
            const icons = ['briefcase', 'folder-open', 'chart-line', 'file-invoice', 'laptop-code', 'shield-alt'];

            container.innerHTML = filesData.map((file, idx) => {
                const displayName = folderConfig[file.name] || file.name.replace('.html', '');
                const hashName = file.name.replace(/\.[^/.]+$/, "");
                const ext = file.name.split('.').pop().toUpperCase();
                return `
                    <div class="file-card" onclick="window.location.hash='${hashName}'">
                        <div class="file-icon"><i class="fas fa-${icons[idx % icons.length]}"></i></div>
                        <div class="file-name">${displayName}</div>
                        <div class="file-meta">
                            <span>Business Unit</span>
                            <span class="file-badge">${ext}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function checkHash() {
            const hash = decodeURIComponent(window.location.hash.substring(1));
            if (!hash) return showStealth404();

            if (hash === SECRET_LIST_HASH) {
                toggleView('list');
            } else {
                const file = filesData.find(f => f.name.replace(/\.[^/.]+$/, "") === hash);
                if (file) {
                    toggleView('content');
                    loadContent(file.name);
                } else {
                    showStealth404();
                }
            }
        }

        function toggleView(view) {
            document.getElementById('fileListView').style.display = view === 'list' ? 'block' : 'none';
            document.getElementById('fileContentView').style.display = view === 'content' ? 'block' : 'none';
            document.body.style.background = view === 'list' ? '#0F172A' : 'white';
        }

        async function loadContent(filename) {
            const frame = document.getElementById('contentFrame');
            frame.innerHTML = '<div style="padding: 20px; color: #666;">Loading content...</div>';

            try {
                const resp = await fetch(`${CONTENT_BASE_PATH}${filename}?v=${new Date().getTime()}`);
                if (!resp.ok) throw new Error('Content not found');
                const text = await resp.text();

                if (!frame.shadowRoot) {
                    frame.attachShadow({ mode: 'open' });
                }

                const shadow = frame.shadowRoot;
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const styles = Array.from(doc.querySelectorAll('style, link[rel="stylesheet"]')).map(s => s.outerHTML).join('');
                const body = doc.body.innerHTML;

                shadow.innerHTML = `
                    <style>
                        :host { display: block; background: white; min-height: 100vh; color: #1e293b; }
                        @import url('https://fonts.googleapis.com/css2?family=Inter&display=swap');
                        * { font-family: 'Inter', sans-serif !important; }
                    </style>
                    ${styles}
                    <div class="shadow-content-wrapper">
                        ${body}
                    </div>
                `;

                doc.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');
                    if (oldScript.src) newScript.src = oldScript.src;
                    else newScript.textContent = oldScript.textContent;
                    shadow.appendChild(newScript);
                });

            } catch (e) {
                frame.innerHTML = '<div style="padding: 20px; color: #ef4444;">Error: Failed to load content.</div>';
            }
        }

        function showStealth404() {
            document.body.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:sans-serif; color:#475569; background:#0F172A;">
                <h1 style="font-size:10vw; opacity:0.05; color:white;">404</h1>
                <p>The requested URL was not found on this server.</p>
            </div>`;
        }

        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                document.querySelectorAll('.file-card').forEach(card => {
                    const txt = card.innerText.toLowerCase();
                    card.style.display = txt.includes(term) ? 'flex' : 'none';
                });
            });
        }

        window.addEventListener('hashchange', checkHash);
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
