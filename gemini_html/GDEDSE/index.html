<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제미나이 아카이브</title>
    <!-- Google Fonts: Noto Serif KR for Medium-like feel -->
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Config Loading -->
    <script src="../01_rnd/files_config.js"></script>
    <script src="../02_work/files_config.js"></script>
    <script src="../03_travel/files_config.js"></script>
    <script src="../04_AI_Study/files_config.js"></script>
    <script src="../05_Private/files_config.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #292929;
            --text-secondary: #757575;
            --accent-color: #1a8917;
            --border-color: #e6e6e6;
            --font-serif: 'Noto Serif KR', serif;
            --font-sans: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-serif);
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1000px;
            /* Medium width */
            margin: 0 auto;
            padding: 60px 24px;
        }

        /* Header */
        .header {
            margin-bottom: 60px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 40px;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.03em;
            color: #000;
        }

        .header p {
            font-family: var(--font-sans);
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        /* Stats & Search Bar */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .stats {
            display: flex;
            gap: 24px;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .stats strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .search-box {
            position: relative;
            min-width: 300px;
        }

        .search-input {
            width: 100%;
            padding: 10px 10px 10px 35px;
            border: none;
            border-bottom: 1px solid var(--border-color);
            font-family: var(--font-sans);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            background: transparent;
        }

        .search-input:focus {
            border-bottom-color: var(--text-primary);
        }

        .search-icon {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Folder Sections */
        .folder-section {
            margin-bottom: 60px;
        }

        .folder-header {
            display: flex;
            align-items: baseline;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .folder-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-right: 16px;
        }

        .folder-count {
            font-family: var(--font-sans);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .copy-link-btn {
            margin-left: auto;
            background: none;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-family: var(--font-sans);
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-link-btn:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        /* File Grid */
        .file-grid {
            display: grid;
            grid-template-columns: 1fr;
            /* Single column like a blog list on mobile, 2 on desktop? Medium uses list. Let's use List. */
            gap: 24px;
        }

        @media(min-width: 768px) {
            .file-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .file-card {
            text-decoration: none;
            color: inherit;
            display: block;
            padding: 20px 0;
            border-top: 1px solid transparent;
            transition: all 0.2s;
        }

        .file-card:hover .file-title {
            color: var(--text-primary);
            text-decoration: underline;
            text-decoration-color: var(--text-primary);
            text-decoration-thickness: 1px;
        }

        .file-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-sans);
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .file-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.3;
            color: #1a1a1a;
        }

        .file-desc {
            font-family: var(--font-serif);
            font-size: 1rem;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #292929;
            color: white;
            padding: 12px 24px;
            border-radius: 4px;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-secondary);
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>Gemini Archive</h1>
            <p>프로젝트 문서 및 결과물 보관소</p>
        </header>

        <div class="controls">
            <div class="stats">
                <span>Total Posts: <strong id="totalFiles">0</strong></span>
                <span>Categories: <strong id="totalFolders">0</strong></span>
            </div>
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="검색어를 입력하세요...">
            </div>
        </div>

        <div id="contentArea">
            <!-- Folders and Files will be injected here -->
            <div class="loading">설정 파일을 불러오는 중입니다...</div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">링크가 복사되었습니다.</div>

    <script>
        // --- Configuration ---
        const KNOWN_FOLDERS = ['01_rnd', '02_work', '03_travel', '04_AI_Study', '05_Private'];

        // Hash Mappings for Security/Obfuscation
        const HASH_MAPPINGS = {
            '01_rnd': 'AED13WE',
            '02_work': 'BF7K2M9',
            '03_travel': 'C8PQ4X1',
            '04_AI_Study': 'QT38XYX',
            '05_Private': 'RU4TYZ1'
        };

        // --- Logic ---

        function init() {
            const container = document.getElementById('contentArea');
            const config = window.FOLDER_CONFIG || {};

            if (Object.keys(config).length === 0) {
                container.innerHTML = `<div class="loading">설정 파일을 찾을 수 없습니다. (files_config.js 로딩 실패)</div>`;
                return;
            }

            container.innerHTML = '';
            let totalFiles = 0;
            let totalFolders = 0;

            KNOWN_FOLDERS.forEach(folderKey => {
                const folderData = config[folderKey];
                if (!folderData) return;

                totalFolders++;
                const fileKeys = Object.keys(folderData).filter(k => k !== '_folderName' && k !== '_order');
                // Use _order if available for sorting
                let sortedKeys = fileKeys;
                if (folderData._order) {
                    sortedKeys = folderData._order.filter(k => fileKeys.includes(k));
                    // Add any unordered files at the end
                    const unordered = fileKeys.filter(k => !folderData._order.includes(k));
                    sortedKeys = [...sortedKeys, ...unordered];
                }

                totalFiles += sortedKeys.length;

                // Render Folder Section
                const section = document.createElement('div');
                section.className = 'folder-section';

                const hashPath = HASH_MAPPINGS[folderKey] || folderKey;
                const folderName = folderData._folderName || folderKey;

                section.innerHTML = `
                    <div class="folder-header">
                        <div class="folder-title">${folderName}</div>
                        <div class="folder-count">${sortedKeys.length} posts</div>
                        <button class="copy-link-btn" onclick="copyLink('${hashPath}')">
                            <i class="fas fa-link"></i> 링크 복사
                        </button>
                    </div>
                    <div class="file-grid">
                        ${sortedKeys.map(fileName => {
                    const desc = folderData[fileName]; // The value in JSON is the description/title
                    const displayName = desc;
                    const date = "Jan 2025"; // Static for now or random? Keep clean.
                    const fileType = fileName.split('.').pop().toUpperCase();

                    // Link to Hash Path if available for security
                    const linkUrl = `../${hashPath}/${fileName}`;

                    // Check if description is long enough to be a desc or just a title
                    // In valid Medium style, usually Title + Excerpt. 
                    // Here we only have one string. Let's treat it as Title.

                    return `
                                <a href="${linkUrl}" class="file-card" data-search="${displayName.toLowerCase()} ${fileName.toLowerCase()}">
                                    <div class="file-meta">
                                        <span>${fileType}</span>
                                        <span style="color: #ddd;">|</span>
                                        <span>Gemini</span>
                                    </div>
                                    <div class="file-title">${displayName}</div>
                                    <div class="file-desc">${fileName}</div> 
                                </a>
                            `;
                }).join('')}
                    </div>
                `;
                container.appendChild(section);
            });

            document.getElementById('totalFiles').innerText = totalFiles;
            document.getElementById('totalFolders').innerText = totalFolders;

            // Search Logic
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const cards = document.querySelectorAll('.file-card');

                cards.forEach(card => {
                    const searchData = card.getAttribute('data-search');
                    if (searchData.includes(term)) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });

                // Hide empty sections
                document.querySelectorAll('.folder-section').forEach(sec => {
                    const visibleCards = sec.querySelectorAll('.file-card[style="display: block;"]');
                    // Note: 'display: block' check might be tricky if it's default. 
                    // Better to check offsetParent or check logic.
                    // Simplified:
                    let hasVisible = false;
                    sec.querySelectorAll('.file-card').forEach(c => {
                        if (c.style.display !== 'none') hasVisible = true;
                    });
                    sec.style.display = hasVisible ? 'block' : 'none';
                });
            });
        }

        // --- Toast Logic ---
        function copyLink(hashPath) {
            const url = `${window.location.origin}/gemini_html/${hashPath}/`;
            navigator.clipboard.writeText(url).then(() => {
                showToast();
            }).catch(err => {
                // Fallback
                const input = document.createElement('textarea');
                input.value = url;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // --- Run ---
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>

</html>
