<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity AI 보안 감사 기능 분석 보고서</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #fafafa;
            color: #18181b;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            height: 380px;
            max-height: 400px;
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e4e4e7;
        }

        .nav-item.active {
            background-color: #18181b;
            color: #ffffff;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 10px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background-color: #fef3c7;
            color: #92400e;
        }

        .code-block {
            font-family: 'Courier New', Courier, monospace;
            background-color: #18181b;
            color: #f4f4f5;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            line-height: 1.5;
            overflow-x: auto;
        }
    </style>
    <!-- Chosen Palette: Slate & Zinc with Amber Accents (Professional, Security-focused) -->
    <!-- Application Structure Plan: Dashboard Style Navigation.
         1. Overview: Comparison between Cursor (Generalist) and Antigravity (Specialist).
         2. Audit Engine: Deep dive into the "Security Audit" features.
         3. Policy Config: How to set up and customize policies.
         4. Automation: The 'Set and Forget' aspect of the workflow.
         This layout is chosen to highlight Antigravity's depth in security compared to the broader focus of Cursor. -->
    <!-- Visualization & Content Choices:
         - Radar Chart: Comparison of Security Depth vs Productivity.
         - Stacked Bar: Analysis of where security vulnerabilities are caught.
         - Flow Indicators: HTML/CSS-based arrows for the automated pipeline.
         - Icons: Unicode characters for visual cues.
    -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
</head>

<body class="flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-white border-b border-zinc-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-zinc-900 rounded-xl flex items-center justify-center text-white text-xl">A
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Antigravity AI Security Analysis</h1>
                    <p class="text-xs text-zinc-500">Professional Audit & Compliance Tool</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span class="security-badge">🛡️ Enterprise Grade</span>
                <div class="h-8 w-px bg-zinc-200"></div>
                <button class="text-sm font-medium hover:text-zinc-600">Documentation</button>
            </div>
        </div>
    </header>

    <!-- Main Section -->
    <main class="flex-grow max-w-7xl mx-auto px-6 py-10 w-full">
        <div class="flex flex-col md:flex-row gap-8">

            <!-- Side Navigation -->
            <nav class="w-full md:w-64 flex flex-col gap-2 flex-shrink-0">
                <button onclick="changeTab('overview')" id="btn-overview"
                    class="nav-item active flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all">
                    <span>🏠 개요 및 비교</span>
                </button>
                <button onclick="changeTab('audit')" id="btn-audit"
                    class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all hover:bg-zinc-100">
                    <span>🔍 보안 감사 엔진</span>
                </button>
                <button onclick="changeTab('policy')" id="btn-policy"
                    class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all hover:bg-zinc-100">
                    <span>📜 커스텀 정책 설정</span>
                </button>
                <button onclick="changeTab('automation')" id="btn-automation"
                    class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all hover:bg-zinc-100">
                    <span>⚡ 자동화 워크플로우</span>
                </button>
            </nav>

            <!-- Dynamic Content Display -->
            <div id="display-panel"
                class="flex-grow bg-white rounded-2xl shadow-sm border border-zinc-200 p-8 min-h-[550px] transition-opacity duration-300">
                <!-- Content injected via JavaScript -->
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-zinc-50 border-t border-zinc-200 py-8">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-sm text-zinc-500">Antigravity 보안 감사 기능 기술 조사 보고서 (2025)</p>
            <div class="flex gap-6 text-sm text-zinc-400">
                <a href="#" class="hover:underline">Privacy Policy</a>
                <a href="#" class="hover:underline">System Status</a>
            </div>
        </div>
    </footer>

    <script>
        // Data and Content Configuration
        const contents = {
            overview: {
                title: "Antigravity vs Cursor: 보안 관점의 차이",
                intro: "Cursor가 개발의 <strong>생산성</strong>에 집중한다면, Antigravity는 개발된 코드의 <strong>안전성</strong>과 <strong>규제 준수</strong>에 특화되어 있습니다. Antigravity는 AI가 짠 코드의 취약점을 찾아내고 '수정 제안'을 하는 것을 넘어, 조직의 보안 가이드라인을 강제하는 역할을 합니다.",
                metrics: [
                    { label: "보안 특화도", cursor: 40, anti: 95 },
                    { label: "실시간 코드 생성", cursor: 98, anti: 60 },
                    { label: "정책 강제성", cursor: 30, anti: 90 },
                    { label: "컴플라이언스 리포트", cursor: 10, anti: 95 }
                ],
                highlights: [
                    "Cursor: .cursorrules 기반의 느슨한 가이드라인",
                    "Antigravity: 보안 엔진과 연동된 강력한 감사 및 리포팅",
                    "주요 타겟: 대규모 팀, 금융권, 보안이 필수적인 엔터프라이즈 환경"
                ]
            },
            audit: {
                title: "보안 감사 기능 및 설정 위치",
                intro: "Antigravity의 보안 감사는 IDE 확장 프로그램 설정과 중앙 집중형 웹 대시보드 두 곳에서 관리됩니다.",
                features: [
                    { name: "심층 취약점 스캔", detail: "OWASP Top 10, SQL Injection, XSS 등을 AI가 다각도로 분석" },
                    { name: "비밀정보 탐지", detail: "코드 내 하드코딩된 API Key, 패스워드 실시간 차단" },
                    { name: "설정 위치", detail: "Settings > Security > Antigravity Audit Engine" }
                ],
                setupTip: "Antigravity는 프로젝트 루트의 <code>antigravity.yaml</code> 파일을 통해 검사 강도와 제외 대상을 설정할 수 있습니다."
            },
            policy: {
                title: "커스텀 정책(Policy) 커스터마이징",
                intro: "Antigravity의 강력한 점은 '조직 맞춤형 보안 정책'을 코드로 관리할 수 있다는 점입니다. 단순한 자연어를 넘어 구조화된 룰셋을 지원합니다.",
                exampleCode: `policies:\n  - name: "No Direct DB Access"\n    severity: "Critical"\n    rule: "모든 데이터베이스 접근은 Service Layer를 통해서만 이루어져야 함"\n    forbidden_patterns: ["knex.select", "db.query"]\n    allow_exceptions: ["tests/*"]`,
                points: [
                    "자연어와 Regex, 패턴 매칭의 결합",
                    "심각도(Severity) 기반의 차별화된 알림",
                    "코드 리뷰 시 정책 위반 사항 자동 태그"
                ]
            },
            automation: {
                title: "정책 확인 및 자동화 (Self-Healing)",
                intro: "정책을 넣으면 Antigravity가 <strong>'알아서'</strong> 코드를 감시하고 교정합니다. 이 과정은 크게 3단계로 진행됩니다.",
                steps: [
                    { icon: "📡", title: "실시간 모니터링", desc: "코드가 입력되거나 파일이 저장될 때 백그라운드에서 상시 작동" },
                    { icon: "🚨", title: "위반 사항 감지", desc: "설정된 정책과 어긋나는 코드 발견 시 에디터 내에 즉각 경고 표시" },
                    { icon: "🛠️", title: "자동 수정 제안", desc: "발견된 취약점을 안전한 코드로 바꿀 수 있는 'Quick Fix' 버튼 제공" }
                ]
            }
        };

        let activeTab = 'overview';
        let mainChart = null;

        function changeTab(tabId) {
            activeTab = tabId;
            const panel = document.getElementById('display-panel');
            panel.style.opacity = 0;

            setTimeout(() => {
                renderContent(tabId);
                panel.style.opacity = 1;
            }, 200);

            // Nav UI update
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.remove('active', 'hover:bg-zinc-100');
                if (btn.id === `btn-${tabId}`) {
                    btn.classList.add('active');
                } else {
                    btn.classList.add('hover:bg-zinc-100');
                }
            });
        }

        function renderContent(tabId) {
            const data = contents[tabId];
            const panel = document.getElementById('display-panel');

            let html = `<h2 class="text-3xl font-bold mb-4">${data.title}</h2>`;
            html += `<p class="text-zinc-600 mb-8 leading-relaxed">${data.intro}</p>`;

            if (tabId === 'overview') {
                html += `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
                        <div class="chart-container">
                            <canvas id="comparisonChart"></canvas>
                        </div>
                        <div class="space-y-4">
                            <h3 class="font-bold text-zinc-800">📋 주요 차이점</h3>
                            <ul class="space-y-3">
                                ${data.highlights.map(h => `<li class="flex items-center gap-2 text-sm text-zinc-600"><span class="text-zinc-400">•</span> ${h}</li>`).join('')}
                            </ul>
                            <div class="p-4 bg-amber-50 border border-amber-100 rounded-xl mt-6">
                                <p class="text-xs text-amber-800 font-semibold mb-1 italic">Research Note</p>
                                <p class="text-xs text-amber-700 leading-tight">Antigravity는 단순 AI 어시스턴트가 아닌, 엔터프라이즈 코드의 가드레일(Guardrail) 역할을 합니다.</p>
                            </div>
                        </div>
                    </div>
                `;
                setTimeout(() => initOverviewChart(data.metrics), 50);
            } else if (tabId === 'audit') {
                html += `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        ${data.features.map(f => `
                            <div class="p-5 border border-zinc-100 rounded-xl bg-zinc-50">
                                <h4 class="font-bold text-zinc-900 mb-2">${f.name}</h4>
                                <p class="text-xs text-zinc-500">${f.detail}</p>
                            </div>
                        `).join('')}
                    </div>
                    <div class="p-4 bg-zinc-900 text-zinc-100 rounded-lg text-sm font-mono mb-4">
                        <span class="text-zinc-500">// Project Level Config</span><br/>
                        <span class="text-sky-400">audit_level:</span> extreme<br/>
                        <span class="text-sky-400">auto_report:</span> true
                    </div>
                    <p class="text-sm text-zinc-400">💡 ${data.setupTip}</p>
                `;
            } else if (tabId === 'policy') {
                html += `
                    <div class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="code-block">
                                <div class="text-xs text-zinc-500 mb-2"># antigravity_policy.yaml</div>
                                <pre class="whitespace-pre-wrap">${data.exampleCode}</pre>
                            </div>
                            <div class="flex flex-col justify-center gap-4">
                                ${data.points.map(p => `
                                    <div class="flex items-start gap-3">
                                        <span class="text-green-500 font-bold">✓</span>
                                        <p class="text-sm text-zinc-700">${p}</p>
                                    </div>
                                `).join('')}
                                <div class="mt-4">
                                    <button class="px-4 py-2 bg-zinc-100 border border-zinc-200 rounded-lg text-xs font-bold hover:bg-zinc-200 transition">웹 대시보드에서 정책 생성기 실행 →</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tabId === 'automation') {
                html += `
                    <div class="flex flex-col md:flex-row items-stretch justify-between gap-4 mt-8">
                        ${data.steps.map((s, i) => `
                            <div class="flex-1 p-6 border border-zinc-200 rounded-2xl text-center flex flex-col items-center">
                                <div class="text-4xl mb-4">${s.icon}</div>
                                <h4 class="font-bold text-zinc-800 mb-2">${s.title}</h4>
                                <p class="text-xs text-zinc-500 leading-relaxed">${s.desc}</p>
                            </div>
                            ${i < 2 ? '<div class="hidden md:flex items-center text-zinc-200 text-2xl">➔</div>' : ''}
                        `).join('')}
                    </div>
                    <div class="mt-12 p-6 bg-green-50 rounded-xl border border-green-100 flex items-center gap-4">
                        <div class="text-2xl">⚡</div>
                        <div>
                            <h4 class="font-bold text-green-900 text-sm">알아서 해주는 수준 (Full Automation)</h4>
                            <p class="text-xs text-green-700">Antigravity는 커스텀 정책 주입 후 별도의 조작 없이도 모든 PR(Pull Request) 및 로컬 저장 시점에 코드 안정성을 검증합니다.</p>
                        </div>
                    </div>
                `;
            }

            panel.innerHTML = html;
        }

        function initOverviewChart(metrics) {
            const ctx = document.getElementById('comparisonChart').getContext('2d');
            if (mainChart) mainChart.destroy();

            mainChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: metrics.map(m => m.label),
                    datasets: [
                        {
                            label: 'Cursor',
                            data: metrics.map(m => m.cursor),
                            borderColor: '#71717a',
                            backgroundColor: 'rgba(113, 113, 122, 0.1)',
                            borderWidth: 2,
                            pointRadius: 3
                        },
                        {
                            label: 'Antigravity',
                            data: metrics.map(m => m.anti),
                            borderColor: '#fbbf24',
                            backgroundColor: 'rgba(251, 191, 36, 0.1)',
                            borderWidth: 2,
                            pointRadius: 3
                        }
                    ]
                },
                options: {
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 100,
                            ticks: { display: false },
                            grid: { color: '#f4f4f5' }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                usePointStyle: true,
                                padding: 20,
                                font: { size: 11 }
                            }
                        }
                    }
                }
            });
        }

        // Initialize App
        window.onload = () => {
            changeTab('overview');
        };
    </script>
</body>

</html>
