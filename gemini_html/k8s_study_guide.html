                ],
                cheatSheet: [
                    { cmd: "kubectl events --all-namespaces", desc: "클러스터 전체의 비정상 이벤트 실시간 감시" },
                    { cmd: "kubectl logs [POD] --previous", desc: "재시작된 파드의 직전 에러 로그 확인" }
                ],
                chartData: {
                    labels: ['성공', '주의', '치명적'],
                    datasets: [{ label: '이벤트 분포', data: [85, 12, 3], backgroundColor: ['#10b981', '#f59e0b', '#ef4444'] }]
                }
            }
        ];

        let currentStep = 0;
        let chartInstance = null;

        function init() {
            renderNav();
            renderContent(0);
        }

        function renderNav() {
            const list = document.getElementById('nav-list');
            list.innerHTML = '';
            curriculumData.forEach((item, idx) => {
                const div = document.createElement('div');
                div.onclick = () => selectStep(idx);
                div.className = `nav-item p-4 rounded-lg flex items-start gap-3 border border-transparent ${idx === currentStep ? 'nav-active shadow-sm' : 'hover:bg-slate-50'}`;
                div.innerHTML = `
                    <div class="text-[10px] font-bold mt-0.5 opacity-50">${String(item.id).padStart(2, '0')}</div>
                    <div>
                        <div class="text-xs font-bold leading-tight">${item.title}</div>
                        <div class="text-[9px] mt-1 opacity-60 line-clamp-1">${item.tagline}</div>
                    </div>
                `;
                list.appendChild(div);
            });
            const progress = ((currentStep + 1) / curriculumData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('progress-percent').innerText = `${Math.round(progress)}%`;
        }

        function selectStep(idx) {
            currentStep = idx;
            renderNav();
            renderContent(idx);
        }

        function renderContent(idx) {
            const data = curriculumData[idx];
            const area = document.getElementById('content-area');

            const opsHtml = data.platformOps.map(op => `
                <div class="p-4 bg-slate-50 rounded-xl border border-slate-100 hover:border-blue-200 transition-colors">
                    <div class="text-xs font-bold text-blue-700 mb-1">${op.title}</div>
                    <div class="text-[11px] text-slate-500 leading-relaxed">${op.desc}</div>
                </div>
            `).join('');

            const cheatHtml = data.cheatSheet.map(c => `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-700/50 pb-3 last:border-0 last:pb-0">
                    <code class="command-line px-2 py-1 rounded text-[11px] font-bold">$ ${c.cmd}</code>
                    <span class="text-[10px] text-slate-400 font-medium">${c.desc}</span>
                </div>
            `).join('');

            const linkHtml = (data.koreanResources || []).map(link => `
                <a href="${link.url}" target="_blank" class="p-3 bg-emerald-50 border border-emerald-100 rounded-xl text-[11px] text-emerald-800 hover:bg-emerald-100 transition-all flex items-center justify-between group">
                    <span class="font-bold truncate pr-2">${link.name}</span>
                    <span class="text-xs group-hover:translate-x-1 transition-transform">→</span>
                </a>
            `).join('');

            const engLinkHtml = data.learningResources.map(link => `
                <a href="${link.url}" target="_blank" class="px-3 py-1.5 bg-white border border-slate-200 rounded-full text-[10px] font-bold text-slate-400 hover:text-blue-600 hover:border-blue-400 transition-all">
                    🔗 ${link.name}
                </a>
            `).join('');

            area.innerHTML = `
                <div class="animate-fade max-w-5xl mx-auto">
                    <div class="mb-10">
                        <div class="text-[11px] font-bold text-blue-600 uppercase tracking-widest mb-2 flex items-center gap-2">
                            <span class="w-8 h-[1px] bg-blue-600"></span> Module ${data.id}
                        </div>
                        <h2 class="text-4xl font-bold text-slate-900 mb-3 tracking-tight">${data.title}</h2>
                        <p class="text-xl text-slate-500 font-medium">${data.tagline}</p>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                        <!-- Left: Info -->
                        <div class="lg:col-span-8 space-y-8">
                            <section class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm op-card">
                                <h3 class="text-sm font-bold text-slate-900 mb-4 flex items-center gap-2">
                                    <span class="text-blue-600">⚙️</span> 플랫폼 운영 핵심 개념
                                </h3>
                                <p class="text-slate-600 leading-relaxed mb-8 text-sm">${data.description}</p>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    ${opsHtml}
                                </div>
                            </section>

                            <section class="bg-slate-900 p-8 rounded-3xl shadow-xl">
                                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-6 font-mono">Operations Toolkit</h3>
                                <div class="space-y-4">
                                    ${cheatHtml}
                                </div>
                            </section>
                        </div>

                        <!-- Right: Resources -->
                        <div class="lg:col-span-4 space-y-8">
                            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                                <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Operational Insight</h4>
                                ${data.chartData ? '<div class="chart-container"><canvas id="stepChart"></canvas></div>' : renderCustomVisual(data.customVisual)}
                            </div>
                            
                            <div class="bg-emerald-50/50 p-6 rounded-3xl border border-emerald-100">
                                <h4 class="text-[10px] font-bold text-emerald-600 uppercase mb-4 tracking-widest">추천 학습 자료 (국문)</h4>
                                <div class="flex flex-col gap-2">
                                    ${linkHtml}
                                </div>
                                <div class="mt-6 pt-6 border-t border-emerald-100">
                                    <h4 class="text-[9px] font-bold text-slate-400 uppercase mb-3 tracking-widest">영문 공식 리소스</h4>
                                    <div class="flex flex-wrap gap-2">
                                        ${engLinkHtml}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            if (data.chartData) {
                setTimeout(() => renderChart(data.chartData), 0);
            }
        }

        function renderChart(config) {
            const ctx = document.getElementById('stepChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: config.labels.length === 3 ? (currentStep === 2 ? 'doughnut' : 'bar') : 'bar',
                data: config,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: config.labels.length === 3 && currentStep === 2 ? {} : {
                        y: { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { font: { size: 9 } } },
                        x: { grid: { display: false }, ticks: { font: { size: 9 } } }
                    }
                }
            });
        }

        function renderCustomVisual(key) {
            const boxClass = "flex flex-col items-center justify-center h-48 bg-slate-50 rounded-2xl border border-dashed border-slate-300";
            if (key === 'lifecycle_ops') {
                return `<div class="${boxClass}">
                            <div class="flex gap-2 mb-3">
                                <div class="w-8 h-8 rounded bg-blue-600 text-[10px] flex items-center justify-center text-white font-bold">V1</div>
                                <div class="w-2 text-slate-300 flex items-center">➔</div>
                                <div class="w-8 h-8 rounded bg-blue-400 text-[10px] flex items-center justify-center text-white font-bold">V2</div>
                            </div>
                            <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Rolling Upgrade Flow</div>
                        </div>`;
            }
            if (key === 'network_ops') {
                return `<div class="${boxClass} px-10">
                            <div class="w-full h-2 bg-slate-200 rounded-full mb-1 relative">
                                <div class="absolute inset-y-0 left-0 w-1/2 bg-blue-500 rounded-full"></div>
                                <div class="absolute -top-3 left-1/2 text-[8px] font-bold">CNI Tunnel</div>
                            </div>
                            <div class="flex justify-between w-full mt-4">
                                <div class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-[8px] text-white">Pod A</div>
                                <div class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-[8px] text-white">Pod B</div>
                            </div>
                        </div>`;
            }
            if (key === 'storage_ops') {
                return `<div class="${boxClass}">
                            <div class="w-16 h-12 bg-slate-700 text-white text-[10px] flex items-center justify-center rounded mb-2">NAS/SAN</div>
                            <div class="text-[10px] text-slate-400">|| CSI Driver ||</div>
                            <div class="px-3 py-1 bg-blue-100 text-blue-700 text-[8px] font-bold rounded mt-2">PVC Bound</div>
                        </div>`;
            }
            return '';
        }

        init();
    </script>
</body>

</html>
