<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 AI Study - Deep Learning & Research</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Version: 3.0 - Clean Pastel Blue Academic Theme */
        :root {
            --primary: #3b82f6;
            --primary-light: #60a5fa;
            --primary-lighter: #93c5fd;
            --bg-gradient-start: #eff6ff;
            --bg-gradient-end: #dbeafe;
            --card-bg: #ffffff;
            --text-primary: #1e3a8a;
            --text-secondary: #1e40af;
            --text-muted: #3b82f6;
            --border: #dbeafe;
            --shadow: rgba(59, 130, 246, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            padding: 60px 20px 80px;
            color: var(--text-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .page-header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        .page-title {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.03em;
            line-height: 1.2;
        }

        .page-subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            font-weight: 500;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Search */
        .search-container {
            max-width: 700px;
            margin: 0 auto 60px;
            position: relative;
            animation: fadeIn 1s ease-out 0.2s both;
        }

        .search-wrapper {
            position: relative;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 2px 12px var(--shadow), 0 0 0 1px var(--border);
            transition: all 0.3s ease;
        }

        .search-wrapper:hover,
        .search-wrapper:focus-within {
            box-shadow: 0 4px 20px var(--shadow), 0 0 0 2px var(--primary);
        }

        .search-icon {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 18px;
            pointer-events: none;
            z-index: 1;
        }

        .search-input {
            width: 100%;
            padding: 18px 24px 18px 56px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            color: var(--text-primary);
            background: transparent;
            outline: none;
        }

        .search-input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Grid */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
            animation: fadeIn 1s ease-out 0.4s both;
        }

        .file-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 28px;
            border: 1px solid var(--border);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .file-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-light) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .file-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 28px var(--shadow);
            border-color: var(--primary);
        }

        .file-card:hover::before {
            opacity: 1;
        }

        .file-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .file-card:hover .file-icon {
            transform: scale(1.08);
        }

        .file-icon i {
            font-size: 24px;
            color: white;
        }

        .file-name {
            font-size: 1.1875rem;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.4;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .file-meta {
            margin-top: auto;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9375rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .file-badge {
            padding: 6px 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        /* Loading */
        .loading {
            text-align: center;
            grid-column: 1 / -1;
            padding: 60px;
            color: var(--text-muted);
            font-size: 1.125rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-title {
                font-size: 2.5rem;
            }

            .file-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .file-card {
                padding: 24px;
            }
        }

        #fileListView.active {
            display: block;
        }

        #fileContentView {
            display: none;
        }

        #fileContentView.active {
            display: block;
        }

        #fileListView {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="fileListView" class="active">
            <header class="page-header">
                <h1 class="page-title">AI Study</h1>
                <p class="page-subtitle">Deep dive into artificial intelligence & machine learning</p>
            </header>

            <div class="search-container">
                <div class="search-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search AI topics...">
                </div>
            </div>

            <div id="filesContainer" class="file-grid">
                <div class="loading">Loading files...</div>
            </div>
        </div>

        <div id="fileContentView">
            <div id="contentFrame"></div>
        </div>
    </div>

    <script>
        const GITHUB_API = `https://api.github.com/repos/chrisKILee/chrisKILee.github.io/contents/gemini_html/04_AI_Study`;
        const CONFIG_PATH = '../04_AI_Study/files.json';
        const CONTENT_BASE_PATH = '../04_AI_Study/';
        let filesData = [];

        async function loadFiles() {
            try {
                const filesResp = await fetch(GITHUB_API);
                if (!filesResp.ok) throw new Error('GitHub API Error');
                const rawFiles = await filesResp.json();

                filesData = rawFiles.filter(item =>
                    item.type === 'file' &&
                    !['files.json', 'files_config.js', 'index.html'].includes(item.name) &&
                    !item.name.endsWith('.Identifier')
                );

                let config = {};
                try {
                    const cfgResp = await fetch(CONFIG_PATH);
                    if (cfgResp.ok) config = await cfgResp.json();
                } catch (e) { }

                const order = config._order || [];
                const sorted = [...filesData].sort((a, b) => {
                    const idxA = order.indexOf(a.name);
                    const idxB = order.indexOf(b.name);
                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return a.name.localeCompare(b.name);
                });

                const icons = ['brain', 'robot', 'microchip', 'network-wired', 'project-diagram', 'database', 'code-branch', 'cube'];

                document.getElementById('filesContainer').innerHTML = sorted.map((file, idx) => {
                    const displayName = config[file.name] || file.name;
                    const fileNameNoExt = file.name.replace(/\.[^/.]+$/, "");
                    const ext = file.name.split('.').pop().toUpperCase();
                    const icon = icons[idx % icons.length];
                    return `
                        <div class="file-card" onclick="openFile('${fileNameNoExt}')" data-name="${file.name.toLowerCase()}">
                            <div class="file-icon">
                                <i class="fas fa-${icon}"></i>
                            </div>
                            <div class="file-name">${displayName}</div>
                            <div class="file-meta">
                                <span>${(file.size / 1024).toFixed(1)} KB</span>
                                <span class="file-badge">${ext}</span>
                            </div>
                        </div>
                     `;
                }).join('');

                checkHash();

            } catch (e) {
                console.error(e);
                document.getElementById('filesContainer').innerHTML = `<p class="loading" style="color:#dc2626">Failed to load content.</p>`;
            }
        }

        function openFile(noExtName) {
            window.location.hash = noExtName;
        }

        function toggleView(showContent) {
            const list = document.getElementById('fileListView');
            const content = document.getElementById('fileContentView');
            if (showContent) {
                list.classList.remove('active');
                content.classList.add('active');
            } else {
                content.classList.remove('active');
                list.classList.add('active');
                document.getElementById('contentFrame').innerHTML = '';
            }
        }

        function checkHash() {
            const hash = decodeURIComponent(window.location.hash.substring(1));
            if (!hash) {
                toggleView(false);
                return;
            }

            const file = filesData.find(f => f.name.replace(/\.[^/.]+$/, "") === hash);
            if (file) {
                toggleView(true);
                loadContent(file.name);
            } else {
                toggleView(false);
            }
        }

        function loadContent(filename) {
            const frame = document.getElementById('contentFrame');
            frame.innerHTML = '';

            const iframe = document.createElement('iframe');
            iframe.src = CONTENT_BASE_PATH + filename;
            iframe.style.cssText = 'width:100%; border:none; min-height:100vh;';

            iframe.onload = function() {
                try {
                    const body = iframe.contentDocument.body;
                    const html = iframe.contentDocument.documentElement;
                    const height = Math.max(
                        body.scrollHeight, body.offsetHeight,
                        html.clientHeight, html.scrollHeight, html.offsetHeight
                    );
                    iframe.style.height = height + 'px';
                } catch(e) {
                    iframe.style.height = '100vh';
                }
            };

            frame.appendChild(iframe);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.file-card').forEach(card => {
                const name = card.getAttribute('data-name');
                card.style.display = name.includes(term) ? 'flex' : 'none';
            });
        });

        window.addEventListener('hashchange', checkHash);
        window.addEventListener('DOMContentLoaded', (e) => {
            if (e.isSynthetic) return;
            loadFiles();
        });
    </script>
</body>

</html>
