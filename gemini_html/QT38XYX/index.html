<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 AI_Study</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* File List View */
        #fileListView {
            display: none;
        }

        #fileListView.active {
            display: block;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
        }

        .search-box {
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 18px 25px;
            font-size: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .search-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .file-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
        }

        .file-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .file-card:hover::before {
            transform: scaleX(1);
        }

        .file-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 210, 255, 0.3);
            border-color: #00d2ff;
        }

        .file-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .file-name {
            font-size: 1rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 10px;
            word-break: break-word;
            line-height: 1.4;
        }

        .file-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
        }

        .file-size {
            font-size: 0.85rem;
            color: #718096;
            font-weight: 500;
        }

        .file-type {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* File Content View */
        #fileContentView {
            display: none;
        }

        #fileContentView.active {
            display: block;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 30px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-5px);
        }

        .content-frame {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            min-height: 600px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 40px;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .file-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- File List View -->
        <div id="fileListView">
            <div class="header">
                <h1>🤖 AI_Study</h1>
                <p>AI_Study Content</p>
            </div>

            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 파일 검색...">
            </div>

            <div id="filesContainer" class="file-grid">
                <div class="loading">Loading files from GitHub</div>
            </div>
        </div>

        <!-- File Content View -->
        <div id="fileContentView">
            <button class="back-button" onclick="showFileList()">← Back to Files</button>
            <div class="content-frame" id="contentFrame">
                <div class="loading">Loading content...</div>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_OWNER = 'chrisKILee';
        const GITHUB_REPO = 'chrisKILee.github.io';
        const GITHUB_PATH = 'gemini_html/04_AI_Study';
        const GITHUB_API = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`;

        const FILE_ICONS = {
            'html': '📄', 'css': '🎨', 'js': '⚡',
            'json': '📋', 'md': '📝', 'txt': '📃', 'default': '📄'
        };

        let filesData = [];

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function getFileExtension(filename) {
            const parts = filename.split('.');
            return parts.length > 1 ? parts[parts.length - 1].toLowerCase() : '';
        }

        function getFileIcon(filename) {
            const ext = getFileExtension(filename);
            return FILE_ICONS[ext] || FILE_ICONS.default;
        }

        function getFileType(filename) {
            const ext = getFileExtension(filename);
            return ext.toUpperCase() || 'FILE';
        }

        async function loadConfig() {
            try {
                const response = await fetch('../04_AI_Study/files.json');
                if (!response.ok) return {};
                return await response.json();
            } catch (error) {
                return {};
            }
        }

        function sortFiles(files, config) {
            const order = config._order || [];
            const orderedFiles = [];
            const unorderedFiles = [];

            files.forEach(file => {
                if (order.includes(file.name)) {
                    orderedFiles.push(file);
                } else {
                    unorderedFiles.push(file);
                }
            });

            orderedFiles.sort((a, b) => order.indexOf(a.name) - order.indexOf(b.name));
            unorderedFiles.sort((a, b) => a.name.localeCompare(b.name));

            return [...orderedFiles, ...unorderedFiles];
        }

        function createFileCard(file, config = {}) {
            const icon = getFileIcon(file.name);
            const type = getFileType(file.name);
            const size = formatFileSize(file.size);
            const displayName = config[file.name] || file.name;
            const fileNameWithoutExt = file.name.replace(/\.[^/.]+$/, '');

            return `
                <div class="file-card" onclick="showFile('${fileNameWithoutExt}')" data-filename="${file.name}">
                    <div class="file-icon">${icon}</div>
                    <div class="file-name">${displayName}</div>
                    <div class="file-meta">
                        <span class="file-size">${size}</span>
                        <span class="file-type">${type}</span>
                    </div>
                </div>
            `;
        }

        async function loadFiles() {
            try {
                const response = await fetch(GITHUB_API);
                if (!response.ok) throw new Error(`Failed to fetch: ${response.statusText}`);

                const contents = await response.json();
                const files = contents.filter(item =>
                    item.type === 'file' &&
                    item.name !== 'files.json' &&
                    !item.name.endsWith('.Identifier') &&
                    item.name !== 'index.html'
                );

                filesData = files;
                const config = await loadConfig();
                const sortedFiles = sortFiles(files, config);

                const fileCards = sortedFiles.map(file => createFileCard(file, config)).join('');
                document.getElementById('filesContainer').innerHTML = fileCards;

                initializeSearch();

            } catch (error) {
                console.error('Error loading files:', error);
                document.getElementById('filesContainer').innerHTML = `
                    <div style="text-align: center; color: white; padding: 40px; grid-column: 1/-1;">
                        <h2>⚠️ Error Loading Files</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function initializeSearch() {
            const searchInput = document.getElementById('searchInput');
            const cards = document.querySelectorAll('.file-card');

            searchInput.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                cards.forEach(card => {
                    const filename = card.getAttribute('data-filename').toLowerCase();
                    card.style.display = filename.includes(searchTerm) ? '' : 'none';
                });
            });
        }

        function showFile(fileNameWithoutExt) {
            // Find the file with matching name
            const file = filesData.find(f => f.name.startsWith(fileNameWithoutExt));
            if (!file) return;

            // Update URL hash
            window.location.hash = fileNameWithoutExt;

            // Hide file list, show content view
            document.getElementById('fileListView').classList.remove('active');
            document.getElementById('fileContentView').classList.add('active');

            // Load file content
            loadFileContent(file.name);
        }

        async function loadFileContent(filename) {
            const contentFrame = document.getElementById('contentFrame');
            contentFrame.innerHTML = '<div class="loading">Loading content...</div>';

            try {
                const response = await fetch(`../04_AI_Study/${filename}`);
                if (!response.ok) throw new Error('Failed to load file');

                const content = await response.text();

                // Create iframe to display HTML content
                const iframe = document.createElement('iframe');
                iframe.style.width = '100%';
                iframe.style.height = '800px';
                iframe.style.border = 'none';
                iframe.srcdoc = content;

                contentFrame.innerHTML = '';
                contentFrame.appendChild(iframe);
            } catch (error) {
                contentFrame.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <h2>⚠️ Error Loading File</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function showFileList() {
            window.location.hash = '';
            document.getElementById('fileContentView').classList.remove('active');
            document.getElementById('fileListView').classList.add('active');
        }

        // Handle hash changes (back/forward navigation)
        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.substring(1);
            if (hash) {
                const file = filesData.find(f => f.name.startsWith(hash));
                if (file) {
                    document.getElementById('fileListView').classList.remove('active');
                    document.getElementById('fileContentView').classList.add('active');
                    loadFileContent(file.name);
                }
            } else {
                showFileList();
            }
        });

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadFiles();

            // Check if there's a hash in URL
            const hash = window.location.hash.substring(1);
            if (hash) {
                // Wait for files to load, then show the file
                setTimeout(() => {
                    const file = filesData.find(f => f.name.startsWith(hash));
                    if (file) {
                        document.getElementById('fileListView').classList.remove('active');
                        document.getElementById('fileContentView').classList.add('active');
                        loadFileContent(file.name);
                    } else {
                        document.getElementById('fileListView').classList.add('active');
                    }
                }, 1000);
            } else {
                document.getElementById('fileListView').classList.add('active');
            }
        });
    </script>
</body>

</html>
