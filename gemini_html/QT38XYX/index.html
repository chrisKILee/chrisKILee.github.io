<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 AI Study - Research & Analysis</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #93C5FD 0%, #3B82F6 100%);
            min-height: 100vh;
            color: #1E3A8A;
            transition: background 0.5s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header p {
            font-size: 1.1rem;
            color: #DBEAFE;
            margin-top: 10px;
        }

        .search-box {
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 16px 25px;
            font-size: 1rem;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid white;
            color: white;
            outline: none;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .file-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .file-card:hover {
            transform: scale(1.03);
        }

        .file-icon {
            font-size: 2.5rem;
            color: #3B82F6;
            margin-bottom: 20px;
        }

        .file-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #1E3A8A;
            margin-bottom: 10px;
        }

        .file-meta {
            font-size: 0.8rem;
            color: #64748B;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .content-view {
            animation: fadeIn 0.5s ease;
            background: white;
            min-height: 100vh;
        }

        .content-header {
            padding: 15px 25px;
            background: #F8FAFC;
            border-bottom: 1px solid #E2E8F0;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-back {
            background: #3B82F6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        iframe {
            width: 100%;
            border: none;
            height: calc(100vh - 70px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div id="fileListView" class="container">
        <div class="header">
            <h1>🤖 AI Study Hub</h1>
            <p>Mastering Machine Learning & Neural Networks</p>
        </div>
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="Search study notes...">
        </div>
        <div id="filesContainer" class="file-grid"></div>
    </div>

    <div id="fileContentView" class="content-view" style="display:none;">
        <div class="content-header">
            <button onclick="window.location.hash=SECRET_LIST_HASH" class="nav-back">
                <i class="fas fa-brain"></i> Back to Hub
            </button>
        </div>
        <div id="contentFrame"></div>
    </div>

    <script>
        const SECRET_LIST_HASH = 'a-ai-study-lock-99';
        const CONFIG_PATH = './files.json';
        const CONTENT_BASE_PATH = './';

        let filesData = [];
        let folderConfig = {};

        async function init() {
            try {
                const resp = await fetch(`${CONFIG_PATH}?v=${new Date().getTime()}`);
                if (!resp.ok) throw new Error('404');
                folderConfig = await resp.json();
                const order = folderConfig._order || [];
                filesData = order.map(name => ({ name }));
                renderGrid();
                checkHash();
            } catch (e) { showStealth404(); }
        }

        function renderGrid() {
            const container = document.getElementById('filesContainer');
            const icons = ['robot', 'cpu', 'microchip', 'network-wired', 'code', 'database'];
            container.innerHTML = filesData.map((file, idx) => {
                const displayName = folderConfig[file.name] || file.name.replace('.html', '');
                return `
                    <div class="file-card" onclick="window.location.hash='${file.name.replace(/\.[^/.]+$/, "")}'">
                        <div class="file-icon"><i class="fas fa-${icons[idx % icons.length]}"></i></div>
                        <div class="file-name">${displayName}</div>
                        <div class="file-meta">AI Research / HTML</div>
                    </div>
                `;
            }).join('');
        }

        function checkHash() {
            const hash = decodeURIComponent(window.location.hash.substring(1));
            if (!hash) return showStealth404();
            if (hash === SECRET_LIST_HASH) toggleView('list');
            else {
                const file = filesData.find(f => f.name.replace(/\.[^/.]+$/, "") === hash);
                if (file) { toggleView('content'); loadContent(file.name); }
                else showStealth404();
            }
        }

        function toggleView(view) {
            document.getElementById('fileListView').style.display = view === 'list' ? 'block' : 'none';
            document.getElementById('fileContentView').style.display = view === 'content' ? 'block' : 'none';
            document.body.style.background = view === 'list' ? 'linear-gradient(135deg, #93C5FD 0%, #3B82F6 100%)' : 'white';
        }

        function loadContent(filename) {
            const frame = document.getElementById('contentFrame');
            frame.innerHTML = '';
            const iframe = document.createElement('iframe');
            iframe.src = `${CONTENT_BASE_PATH}${filename}?v=${new Date().getTime()}`;
            frame.appendChild(iframe);
        }

        function showStealth404() {
            document.body.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#1E3A8A; color:white;">
                <h1 style="font-size:10vw; opacity:0.1;">EOF</h1>
                <p>Knowledge isolation active. Key required.</p>
            </div>`;
        }

        window.addEventListener('hashchange', checkHash);
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
