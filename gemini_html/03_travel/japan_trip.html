<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026년 1월 일본 추천 여행지 분석 보고서</title>
    <!-- React & ReactDOM (Development Version for standalone) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Data ---
        const destinations = [
            {
                id: 'miyako',
                name: '오키나와 미야코지마',
                region: '남부 (오키나와현)',
                theme: ['휴양', '수질최고', '자연'],
                tags: ['#미야코블루', '#거북이스노클링', '#가족여행', '#렌터카필수'],
                vibe: '에메랄드빛 바다와 여유로운 섬 시간',
                koreanDensity: 20, // 0-100
                weather: '18°C ~ 22°C (온화함)',
                highlights: ['요나하 마에하마 비치', '이라부 대교 드라이브', '시기라 황금 온천'],
                shopping: '보통 (돈키호테, 이온몰 있음)',
                flightCost: 650000, // 1인 왕복 (성수기/직항부족 감안)
                hotelCost: 450000, // 1박 (4인 가족룸/리조트)
                description: '일본 최고의 수질을 자랑하는 "미야코 블루"를 만날 수 있는 곳. 1월에도 춥지 않아 부모님과 아이들이 산책하고 풍경을 즐기기에 최적입니다. 물놀이는 웻수트를 입고 가능합니다.'
            },
            {
                id: 'kanazawa',
                name: '가나자와 & 시라카와고',
                region: '중부 (이시카와현)',
                theme: ['역사', '설경', '미식'],
                tags: ['#막부시대', '#게이샤거리', '#금박공예', '#동화속마을'],
                vibe: '에도 시대의 고즈넉함과 압도적인 겨울 설경',
                koreanDensity: 40,
                weather: '0°C ~ 6°C (눈 내림)',
                highlights: ['히가시 차야 거리 (전통)', '겐로쿠엔 (일본 3대 정원)', '오미초 시장 (해산물)', '시라카와고 (합장촌) 당일치기'],
                shopping: '좋음 (전통 공예품, 백화점)',
                flightCost: 450000, // 고마쓰 공항 or 나고야 인아웃
                hotelCost: 350000, // 1박 (료칸/호텔 혼합)
                description: '교토보다 더 교토 같은 "리틀 교토". 막부 시대의 건축물이 잘 보존되어 있으며, 1월에는 시라카와고의 눈 덮인 합장촌 풍경이 절경을 이룹니다. 해산물이 매우 신선합니다.'
            },
            {
                id: 'takamatsu',
                name: '다카마쓰 & 나오시마',
                region: '시코쿠 (가가와현)',
                theme: ['예술', '가성비', '소도시'],
                tags: ['#사누키우동', '#예술의섬', '#리츠린정원', '#직항있음'],
                vibe: '예술과 바다가 어우러진 한적한 소도시 감성',
                koreanDensity: 30,
                weather: '2°C ~ 10°C (쌀쌀함)',
                highlights: ['리츠린 공원 (에도시대 정원)', '나오시마 (쿠사마 야요이 호박)', '우동 택시 투어'],
                shopping: '좋음 (유메타운, 다카마쓰 상점가)',
                flightCost: 350000, // 에어서울 등 직항 이용 시
                hotelCost: 250000, // 1박 (비즈니스/가족호텔)
                description: '한국인이 적당히 적고 물가가 저렴하여 "가성비"와 "만족도"가 모두 높은 곳. 우동 투어와 배를 타고 들어가는 예술의 섬 투어는 아이들에게 특별한 경험이 됩니다.'
            },
            {
                id: 'ginzan',
                name: '긴잔 온천 & 자오',
                region: '동북 (야마가타현)',
                theme: ['온천', '판타지', '겨울왕국'],
                tags: ['#센과치히로', '#수빙(스노우몬스터)', '#노천탕', '#인생샷'],
                vibe: '다이쇼 시대의 로망스와 비현실적인 설경',
                koreanDensity: 15, // 접근성 때문에 낮음
                weather: '-5°C ~ 2°C (폭설)',
                highlights: ['긴잔 온천 거리 야경', '자오 스키장 & 수빙', '야마가타규(소고기)'],
                shopping: '보통 (특산품 위주)',
                flightCost: 550000, // 센다이 공항 이용
                hotelCost: 600000, // 1박 (온천 료칸, 매우 비쌈)
                description: '최근 인스타그램에서 가장 핫한 여행지. 가스등이 켜진 온천 거리의 야경은 타임슬립을 한 듯한 느낌을 줍니다. 예약이 매우 치열하여 미리 준비해야 합니다.'
            }
        ];

        // --- Icons ---
        const IconPlane = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12h20" /><path d="M13 2l9 10-9 10" /><path d="M2 12l5-5m0 10l-5-5" /></svg>;
        const IconHotel = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 21h18" /><path d="M5 21V7l8-4 8 4v14" /><path d="M9 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4" /></svg>;
        const IconUsers = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg>;
        const IconMapPin = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" /><circle cx="12" cy="10" r="3" /></svg>;

        // --- Components ---

        const CostCalculator = ({ flight, hotel, nights = 10, people = 4 }) => {
            const flightTotal = flight * people;
            const hotelTotal = hotel * nights;
            const total = flightTotal + hotelTotal;

            return (
                <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mt-4">
                    <h4 className="font-bold text-gray-700 mb-3 flex items-center gap-2">
                        💰 10박 4인 예상 견적 (2026.01 기준)
                    </h4>
                    <div className="space-y-2 text-sm">
                        <div className="flex justify-between text-gray-600">
                            <span>✈️ 항공료 (4인)</span>
                            <span className="font-medium">{flightTotal.toLocaleString()}원</span>
                        </div>
                        <div className="flex justify-between text-gray-600">
                            <span>🏨 숙박비 (10박, 가족룸)</span>
                            <span className="font-medium">{hotelTotal.toLocaleString()}원</span>
                        </div>
                        <div className="h-px bg-gray-200 my-2"></div>
                        <div className="flex justify-between text-blue-600 font-bold text-lg">
                            <span>총 예상 비용</span>
                            <span>{total.toLocaleString()}원</span>
                        </div>
                        <p className="text-xs text-gray-400 text-right mt-1">*식비/경비 제외, 성수기 요금 반영</p>
                    </div>
                </div>
            );
        };

        const DensityMeter = ({ level }) => {
            let color = 'bg-green-500';
            let text = '여유로움';
            if (level > 30) { color = 'bg-yellow-500'; text = '보통'; }
            if (level > 60) { color = 'bg-red-500'; text = '많음'; }

            return (
                <div className="flex flex-col gap-1">
                    <div className="flex justify-between text-xs text-gray-500">
                        <span>한국인 밀도</span>
                        <span>{text}</span>
                    </div>
                    <div className="w-full bg-gray-200 rounded-full h-2">
                        <div className={`${color} h-2 rounded-full`} style={{ width: `${level}%` }}></div>
                    </div>
                </div>
            );
        };

        const DestinationCard = ({ data, isSelected, onClick }) => {
            return (
                <div
                    onClick={onClick}
                    className={`cursor-pointer transition-all duration-300 p-5 rounded-2xl border-2 hover:shadow-lg relative overflow-hidden group
                        ${isSelected ? 'border-blue-500 bg-blue-50/50' : 'border-white bg-white hover:border-blue-200'}
                    `}
                >
                    <div className="flex justify-between items-start mb-3">
                        <div>
                            <span className="text-xs font-bold text-blue-600 uppercase tracking-wider bg-blue-100 px-2 py-0.5 rounded-full">
                                {data.region}
                            </span>
                            <h3 className="text-xl font-bold text-gray-800 mt-1 group-hover:text-blue-600 transition-colors">
                                {data.name}
                            </h3>
                        </div>
                        {isSelected && <div className="bg-blue-500 text-white p-1 rounded-full"><IconMapPin /></div>}
                    </div>

                    <p className="text-gray-600 text-sm mb-4 line-clamp-2 min-h-[40px]">{data.vibe}</p>

                    <div className="flex flex-wrap gap-1 mb-4">
                        {data.theme.map(t => (
                            <span key={t} className="px-2 py-1 bg-gray-100 text-gray-600 text-xs rounded-md">#{t}</span>
                        ))}
                    </div>

                    <DensityMeter level={data.koreanDensity} />
                </div>
            );
        };

        const DetailView = ({ data }) => {
            if (!data) return <div className="h-full flex items-center justify-center text-gray-400">여행지를 선택해주세요</div>;

            return (
                <div className="glass-panel p-6 rounded-3xl h-full animate-fade-in shadow-xl overflow-y-auto max-h-[80vh]">
                    <div className="flex items-center gap-3 mb-6">
                        <div className="p-3 bg-blue-600 rounded-2xl text-white shadow-lg shadow-blue-200">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></svg>
                        </div>
                        <div>
                            <h2 className="text-3xl font-bold text-gray-800">{data.name}</h2>
                            <p className="text-gray-500">{data.description}</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {/* Left Column: Info */}
                        <div className="space-y-6">
                            <div className="bg-white p-5 rounded-2xl shadow-sm">
                                <h3 className="font-bold text-gray-800 mb-3 flex items-center gap-2">✨ 주요 매력 포인트</h3>
                                <ul className="space-y-2">
                                    {data.highlights.map((point, idx) => (
                                        <li key={idx} className="flex items-start gap-2 text-gray-600 text-sm">
                                            <span className="text-blue-500 mt-1">✔</span> {point}
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            <div className="bg-blue-50 p-5 rounded-2xl border border-blue-100">
                                <h3 className="font-bold text-gray-800 mb-2">🗓 1월 여행 체크포인트</h3>
                                <div className="grid grid-cols-2 gap-4 text-sm">
                                    <div>
                                        <span className="block text-gray-400 text-xs">날씨</span>
                                        <span className="font-medium text-gray-700">{data.weather}</span>
                                    </div>
                                    <div>
                                        <span className="block text-gray-400 text-xs">쇼핑 환경</span>
                                        <span className="font-medium text-gray-700">{data.shopping}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Right Column: Cost */}
                        <div>
                            <CostCalculator
                                flight={data.flightCost}
                                hotel={data.hotelCost}
                                nights={10}
                                people={4}
                            />

                            <div className="mt-4 flex flex-wrap gap-2">
                                {data.tags.map(tag => (
                                    <span key={tag} className="px-3 py-1 bg-gray-800 text-white text-xs rounded-full shadow-sm">
                                        {tag}
                                    </span>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [selectedId, setSelectedId] = useState(destinations[0].id);
            const selectedData = destinations.find(d => d.id === selectedId);

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-7xl mx-auto">
                    {/* Header */}
                    <header className="mb-8 text-center md:text-left">
                        <div className="inline-block px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-bold mb-2 tracking-wider">
                            JAPAN TRAVEL INSIGHT 2026
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black text-gray-900 mb-2">
                            2026년 1월 일본 핫 트래블 리포트
                        </h1>
                        <p className="text-gray-500 max-w-2xl">
                            10박 11일, 4인 가족(성인2, 15세, 12세)을 위한 맞춤형 여행지 분석. <br className="hidden md:block" />
                            막부 시대의 정취부터 에메랄드빛 휴양까지.
                        </p>
                    </header>

                    {/* Main Content Layout */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 h-full">

                        {/* Sidebar: List */}
                        <div className="lg:col-span-4 flex flex-col gap-4 h-full overflow-y-auto scrollbar-hide pb-20">
                            {destinations.map(dest => (
                                <DestinationCard
                                    key={dest.id}
                                    data={dest}
                                    isSelected={selectedId === dest.id}
                                    onClick={() => setSelectedId(dest.id)}
                                />
                            ))}

                            {/* Summary Card */}
                            <div className="bg-gray-800 text-gray-300 p-5 rounded-2xl text-sm mt-4">
                                <h4 className="text-white font-bold mb-2">💡 여행 연구원의 팁</h4>
                                <p className="mb-2">
                                    • <b>오키나와:</b> 1월은 비수기라 숙박비가 합리적이나 수영은 제한적입니다. <br />
                                    • <b>가나자와:</b> 신칸센 연장으로 접근성이 좋아졌으나 눈길 운전 주의가 필요합니다.<br />
                                    • <b>다카마쓰:</b> 우동 투어는 택시 대절을 추천합니다 (4인 가족 유리).
                                </p>
                            </div>
                        </div>

                        {/* Main View: Detail */}
                        <div className="lg:col-span-8 sticky top-4 h-fit">
                            <DetailView data={selectedData} />
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
