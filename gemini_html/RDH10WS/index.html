<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📰 News - RD HOT NEWS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #7f1d1d 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #fca5a5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 24px;
        }

        .header {
            margin-bottom: 60px;
            position: relative;
        }

        .header h1 {
            font-size: 4rem;
            font-weight: 900;
            color: white;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(239, 68, 68, 0.3);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header h1::after {
            content: '';
            display: block;
            width: 100px;
            height: 8px;
            background: #ef4444;
            border-radius: 4px;
        }

        .header p {
            font-size: 1.25rem;
            color: #f87171;
            margin-top: 10px;
            font-weight: 600;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .file-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            cursor: pointer;
            border: 1px solid rgba(239, 68, 68, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }

        .file-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top right, rgba(239, 68, 68, 0.1), transparent);
            pointer-events: none;
        }

        .file-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(239, 68, 68, 0.6);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(239, 68, 68, 0.2);
            background: rgba(30, 41, 59, 0.6);
        }

        .file-icon {
            font-size: 2.5rem;
            color: #ef4444;
            filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.5));
        }

        .file-name {
            font-weight: 700;
            font-size: 1.4rem;
            color: white;
            line-height: 1.2;
        }

        .card-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #b91c1c;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .btn {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .btn:hover {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        .content-view {
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: #020617;
            min-height: 100vh;
        }

        iframe {
            width: 100%;
            border: none;
            height: 100vh;
            display: block;
        }

        .floating-actions {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1000;
        }

        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #ef4444;
            color: white;
            padding: 14px 28px;
            border-radius: 100px;
            font-weight: 800;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 2000;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div id="fileListView" class="container">
        <div class="header">
            <h1>HOT NEWS</h1>
            <p>Real-time updates and architectural insights</p>
        </div>
        <div id="filesContainer" class="file-grid"></div>
    </div>

    <div id="fileContentView" class="content-view" style="display:none;">
        <div class="floating-actions">
            <button onclick="copyCurrentLink()" class="btn"><i class="fas fa-link"></i></button>
        </div>
        <div id="contentFrame"></div>
    </div>

    <div id="toast" class="toast">링크가 복사되었습니다!</div>

        <script>
        const SECRET_LIST_HASH = 'n-news-auth-2024';
        const CATEGORY_HASH = 'RDH10WS';
        let filesData = []; // [{hash, filename, displayName}]

        async function init() {
            try {
                const resp = await fetch(`../site.json?v=${Date.now()}`);
                const site = await resp.json();
                filesData = Object.entries(site.files || {})
                    .filter(([, f]) => f.categoryHash === CATEGORY_HASH && f.visible !== false)
                    .sort((a, b) => (a[1].order || 999) - (b[1].order || 999))
                    .map(([hash, f]) => ({ hash, filename: f.filename, displayName: f.displayName }));
                renderGrid(); checkHash();
            } catch (e) { showStealth404(); }
        }

        function renderGrid() {
            const container = document.getElementById('filesContainer');
            container.innerHTML = filesData.map(file => `
                <div class="file-card" onclick="window.location.hash='${file.hash}'">
                    <div class="file-icon"><i class="fas fa-leaf"></i></div>
                    <div class="file-name">${file.displayName}</div>
                </div>`).join('');
        }

        function checkHash() {
            const hash = decodeURIComponent(window.location.hash.substring(1));
            if (!hash) return showStealth404();
            if (hash === SECRET_LIST_HASH) toggleView('list');
            else {
                const file = filesData.find(f => f.hash === hash);
                if (file) { toggleView('content'); loadContent(file); } else showStealth404();
            }
        }

        function toggleView(view) {
            document.getElementById('fileListView').style.display = view === 'list' ? 'block' : 'none';
            document.getElementById('fileContentView').style.display = view === 'content' ? 'block' : 'none';
        }

        async function loadContent(file) {
            const container = document.getElementById('contentFrame');
            container.innerHTML = '<div style="text-align:center; padding:100px; color:#059669; opacity:0.5;"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';

            try {
                const resp = await fetch(`../contents/${file.hash}/${file.filename}?v=${Date.now()}`);
                if (!resp.ok) throw new Error('Failed to load content');
                const html = await resp.text();

                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                container.innerHTML = '';

                // Inject <link> tags (fonts, external CSS)
                doc.querySelectorAll('head link[rel="stylesheet"], head link[rel="preconnect"]').forEach(l => {
                    if (!document.querySelector(`link[href="${l.href}"]`)) {
                        const newLink = l.cloneNode();
                        document.head.appendChild(newLink);
                    }
                });

                // Inject <style> blocks
                doc.querySelectorAll('style').forEach(s => {
                    const newStyle = document.createElement('style');
                    newStyle.textContent = s.textContent;
                    container.appendChild(newStyle);
                });

                // Inject body content
                const bodyDiv = document.createElement('div');
                bodyDiv.innerHTML = doc.body.innerHTML;
                container.appendChild(bodyDiv);

                // Collect scripts: external first, then inline
                const extSrcs = [];
                const inlineCodes = [];
                doc.querySelectorAll('script').forEach(s => {
                    if (s.src) extSrcs.push(s.src);
                    else if (s.textContent.trim()) inlineCodes.push(s.textContent);
                });

                // Load external scripts sequentially
                for (const src of extSrcs) {
                    if (!document.querySelector(`script[src="${src}"]`)) {
                        await new Promise(resolve => {
                            const ns = document.createElement('script');
                            ns.src = src;
                            ns.onload = resolve;
                            ns.onerror = resolve;
                            document.body.appendChild(ns);
                        });
                    }
                }

                // Execute inline scripts
                inlineCodes.forEach(code => {
                    const ns = document.createElement('script');
                    ns.textContent = code;
                    document.body.appendChild(ns);
                });

            } catch (e) {
                container.innerHTML = `<div style="padding:100px; text-align:center; color:#ef4444;"><h1>Error Loading Content</h1><p>${e.message}</p></div>`;
            }
        }

        function showStealth404() { document.body.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100vh; color:#94a3b8; background:#f8fafc;"><h1>404 Not Found</h1></div>`; }
        window.addEventListener('hashchange', checkHash); window.addEventListener('DOMContentLoaded', init);
    </script>
    <!-- Version: 2026-03-03 contents/ architecture -->
</body>

</html>
