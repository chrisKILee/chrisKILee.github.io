<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 R&D HOT News</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        // Suppress Tailwind production warning in console (Enhanced)
        (function () {
            const originalWarn = console.warn;
            console.warn = function (...args) {
                if (args[0] && typeof args[0] === 'string' &&
                    (args[0].includes('cdn.tailwindcss.com') || args[0].includes('production'))) {
                    return;
                }
                originalWarn.apply(console, args);
            };
            console.log("🔥 R&D HOT NEWS SPA v5.3 - [Cache Busted] Loaded");
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Version: 5.3 - Cache Busted & Final Clean */
        :root {
            --primary: #dc2626;
            --primary-dark: #991b1b;
            --primary-light: #ef4444;
            --bg-start: #020617;
            --bg-end: #450a0a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --text-main: #ffffff;
            --border-glass: rgba(239, 68, 68, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .poppins {
            font-family: 'Poppins', sans-serif;
        }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
        }

        /* View Toggle */
        #fileListView.active {
            display: block;
        }

        #fileListView {
            display: none;
        }

        #fileContentView.active {
            display: block;
        }

        #fileContentView {
            display: none;
        }

        /* Card Effects */
        .news-card {
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .news-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(220, 38, 38, 0.3);
        }

        .icon-box {
            width: 64px;
            height: 64px;
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.2);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
        }

        .news-card:hover .icon-box {
            background: var(--primary);
            transform: scale(1.1) rotate(5deg);
        }

        .icon-box i {
            font-size: 28px;
            color: var(--primary-light);
        }

        .news-card:hover .icon-box i {
            color: white;
        }

        /* Iframe Styles */
        #contentFrame {
            width: 100%;
            height: 100vh;
            border: none;
            background: white;
        }

        .back-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .back-btn:hover {
            background: var(--primary);
            transform: translateX(-5px);
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
    </style>
</head>

<body class="pt-24 pb-20">
    <div id="fileListView" class="active">
        <!-- Navbar -->
        <nav
            class="fixed top-0 w-full z-50 py-4 px-8 flex justify-between items-center bg-slate-950/60 backdrop-blur-md border-b border-white/5">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center">
                    <i class="fas fa-fire text-white"></i>
                </div>
                <span class="text-xl font-extrabold poppins tracking-tight">R&D <span class="text-red-500">HOT</span>
                    NEWS</span>
                <span
                    class="ml-2 px-2 py-0.5 bg-red-600/20 border border-red-600/30 rounded text-[10px] text-red-500 font-bold poppins">v5.3</span>
            </div>
            <a href="../" class="text-sm font-medium text-white/70 hover:text-white transition-colors">Portal</a>
        </nav>

        <div class="max-w-7xl mx-auto px-6 lg:px-8">
            <header class="text-center mb-16 mt-12 animate-fade-in">
                <h1 class="text-5xl lg:text-7xl font-black mb-6 poppins tracking-tighter leading-tight">
                    EXPLORE THE <span class="text-red-600 underline decoration-red-600/30">LATEST</span><br>
                    IN TECHNOLOGY
                </h1>
                <p class="text-xl text-red-100/60 max-w-2xl mx-auto font-medium">
                    Staying at the forefront of R&D with fresh news, trends, and breakthroughs.
                </p>
            </header>

            <div id="filesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 animate-fade-in">
                <!-- Loading State -->
                <div class="col-span-full py-20 text-center">
                    <div
                        class="inline-block w-12 h-12 border-4 border-red-600/30 border-t-red-600 rounded-full animate-spin mb-4">
                    </div>
                    <p class="text-red-100/50 font-bold poppins uppercase tracking-widest text-sm">Searching
                        Resources...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Content View (Iframe Layer) -->
    <div id="fileContentView">
        <div class="back-btn" onclick="closeDoc()">
            <i class="fas fa-arrow-left"></i>
            <span>Back to News Room</span>
        </div>
        <div id="contentFrameContainer"></div>
    </div>

    <script>
        const CONFIG_PATH = '../07_RD_HOT_NEWS/files.json';
        const CONTENT_BASE_PATH = '../07_RD_HOT_NEWS/';

        let filesData = [];
        let folderConfig = {};

        async function init() {
            // Load local config (files.json) with cache busting
            try {
                const cfgRes = await fetch(CONFIG_PATH + '?v=' + new Date().getTime());
                if (cfgRes.ok) {
                    folderConfig = await cfgRes.json();
                } else {
                    throw new Error("Unable to load News Room configuration (files.json).");
                }
            } catch (e) {
                console.error("Initialization error:", e);
                showError("News Room configuration could not be loaded.");
                return;
            }

            // In SPA mode, we rely solely on folderConfig for file list
            if (folderConfig && folderConfig._order) {
                filesData = folderConfig._order.map(name => ({
                    name: name,
                    size: 0, // Metadata not available in local files.json
                    type: 'file'
                }));
            }

            if (filesData.length > 0) {
                renderGrid();
                checkHash();
            } else {
                showError("No articles available in this news room.");
            }
        }

        function renderGrid() {
            const container = document.getElementById('filesContainer');
            const icons = ['fire', 'bolt', 'newspaper', 'globe', 'rocket', 'microchip', 'brain', 'microscope'];
            const order = folderConfig._order || [];

            // Sort
            filesData.sort((a, b) => {
                const idxA = order.indexOf(a.name);
                const idxB = order.indexOf(b.name);
                if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                if (idxA !== -1) return -1;
                if (idxB !== -1) return 1;
                return a.name.localeCompare(b.name);
            });

            container.innerHTML = filesData.map((file, idx) => {
                const displayName = folderConfig[file.name] || file.name.replace('.html', '');
                const icon = icons[idx % icons.length];
                const cleanName = file.name.replace('.html', '');

                return `
                    <div class="news-card glass p-8 cursor-pointer flex flex-col h-full" onclick="openDoc('${cleanName}')">
                        <div class="icon-box mb-6">
                            <i class="fas fa-${icon}"></i>
                        </div>
                        <h3 class="text-xl font-bold mb-4 poppins line-clamp-2">${displayName}</h3>
                        <div class="mt-auto flex justify-between items-center pt-6 border-t border-white/5">
                            <span class="text-xs font-bold uppercase tracking-widest text-red-500/70">Article</span>
                            <span class="text-xs text-white/30 font-medium">${file.size > 0 ? (file.size / 1024).toFixed(1) + ' KB' : 'Static'}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openDoc(name) {
            window.location.hash = name;
        }

        function closeDoc() {
            window.location.hash = '';
            toggleView(false);
        }

        function toggleView(showContent) {
            const list = document.getElementById('fileListView');
            const content = document.getElementById('fileContentView');
            if (showContent) {
                list.classList.remove('active');
                content.classList.add('active');
            } else {
                content.classList.remove('active');
                list.classList.add('active');
                document.getElementById('contentFrameContainer').innerHTML = '';
            }
        }

        function checkHash() {
            const hash = decodeURIComponent(window.location.hash.substring(1));
            if (!hash) {
                toggleView(false);
                return;
            }

            // Support both with and without .html in hash
            const filename = hash.endsWith('.html') ? hash : hash + '.html';
            const file = filesData.find(f => f.name === filename || f.name.replace('.html', '') === hash);

            if (file) {
                toggleView(true);
                loadContent(file.name);
            } else if (window.location.hash) {
                // If hash exists but no file found, check if it's an internal anchor within a loaded page
                // But in iframe mode, hash handling is different. We'll just back out if not found.
                toggleView(false);
            }
        }

        function loadContent(filename) {
            const container = document.getElementById('contentFrameContainer');
            container.innerHTML = '';

            const iframe = document.createElement('iframe');
            iframe.id = 'contentFrame';
            // Add cache busting for iframe content
            const bust = 'v=' + new Date().getTime();
            iframe.src = CONTENT_BASE_PATH + filename + '?' + bust;

            iframe.onload = function () {
                window.scrollTo(0, 0);
            };

            container.appendChild(iframe);
        }

        function showError(msg) {
            document.getElementById('filesContainer').innerHTML = `
                <div class="col-span-full py-20 text-center">
                    <i class="fas fa-exclamation-circle text-red-600 text-4xl mb-4"></i>
                    <p class="text-white font-bold">${msg}</p>
                </div>
            `;
        }

        window.addEventListener('hashchange', checkHash);
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
