# Terroir CI - Docker Delivery Pipeline
#
# 사용법: 이 파일을 프로젝트의 .github/workflows/ci.yml 에 복사
#
# 사전 조건:
#   - VntgCorp org 소속 레포지토리
#   - 프로젝트 루트에 terroir.json 존재
#   - 앱 디렉토리에 Dockerfile 존재 ({root}/docker/Dockerfile 또는 {root}/Dockerfile)

name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read
  id-token: write # GCP Workload Identity Federation 인증에 필요

jobs:
  delivery:
    uses: VntgCorp/RND-INFRA/.github/workflows/300-reusable-docker-delivery.yml@develop
    secrets: inherit
