<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💡 Claude Tip</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0e0e11;
            min-height: 100vh;
            color: #f0f0f4;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #8b8b99;
            margin-top: 12px;
            font-size: 15px;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .file-card {
            background: #18181c;
            border-radius: 16px;
            padding: 28px;
            border: 1px solid rgba(255,255,255,0.07);
            cursor: pointer;
            transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .file-card:hover {
            transform: translateY(-3px);
            border-color: rgba(167,139,250,0.3);
            box-shadow: 0 12px 24px rgba(0,0,0,0.4);
        }

        .file-icon {
            font-size: 2rem;
            color: #a78bfa;
            margin-bottom: 16px;
        }

        .file-name {
            font-weight: 700;
            color: #f0f0f4;
            font-size: 15px;
        }

        .content-view {
            background: #0e0e11;
            min-height: 100vh;
        }

        iframe {
            width: 100%;
            border: none;
            height: 100vh;
            display: block;
        }

        .new-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #7C3AED;
            color: white;
            font-size: 0.62rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 10px;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            animation: pulseBadge 2s ease-in-out infinite;
            pointer-events: none;
        }

        .cat-badge {
            display: inline-block;
            margin-top: 8px;
            font-size: 0.62rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 8px;
            letter-spacing: 0.03em;
            background: rgba(167,139,250,0.12);
            color: #a78bfa;
            border: 1px solid rgba(167,139,250,0.25);
        }

        @keyframes pulseBadge {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.75; transform: scale(0.95); }
        }
    </style>
</head>

<body>
    <div id="fileListView" class="container">
        <div class="header">
            <h1>💡 Claude Tip</h1>
            <p>Claude Code 실전 팁 모음</p>
        </div>
        <div id="filesContainer" class="file-grid"></div>
    </div>
    <div id="fileContentView" class="content-view" style="display:none;">
        <iframe id="contentFrame" style="width:100%;height:100vh;border:none;display:block;"></iframe>
    </div>
    <script>
        const SECRET_LIST_HASH = 'NSUUM8H';
        const CATEGORY_HASH = 'CGTHK6L';
        let filesData = [];

        async function init() {
            try {
                const resp = await fetch(`/site.json?v=${Date.now()}`);
                const site = await resp.json();
                filesData = Object.entries(site.files || {})
                    .filter(([, f]) => f.categoryHash === CATEGORY_HASH && f.visible !== false)
                    .sort((a, b) => (a[1].order || 999) - (b[1].order || 999))
                    .map(([hash, f]) => ({ hash, filename: f.filename, displayName: f.displayName, createdAt: f.createdAt, memo: f.memo }));
                renderGrid(); toggleView('list');
            } catch (e) { showStealth404(); }
        }

        function renderGrid() {
            const container = document.getElementById('filesContainer');
            container.innerHTML = filesData.map(file => `
                <div class="file-card" onclick="location.href='./${file.filename}'" style="position:relative">
                    ${(file.createdAt && (Date.now()-new Date(file.createdAt))<604800000)?'<span class="new-badge">NEW</span>':''}
                    <div class="file-icon"><i class="fas fa-lightbulb"></i></div>
                    <div class="file-name">${file.displayName}</div>
                    ${file.memo ? '<span class="cat-badge">' + file.memo + '</span>' : ''}
                </div>`).join('');
        }

        function checkHash() {
            const hash = decodeURIComponent(window.location.hash.substring(1));
            if (!hash) return showStealth404();
            if (hash === SECRET_LIST_HASH) toggleView('list');
            else {
                const file = filesData.find(f => f.hash === hash);
                if (file) { toggleView('content'); loadContent(file); } else showStealth404();
            }
        }

        function toggleView(view) {
            document.getElementById('fileListView').style.display = view === 'list' ? 'block' : 'none';
            document.getElementById('fileContentView').style.display = view === 'content' ? 'block' : 'none';
        }

        function loadContent(file) {
            const iframe = document.getElementById('contentFrame');
            iframe.src = `./${file.filename}?v=${Date.now()}`;
        }

        function showStealth404() { document.body.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100vh; color:#94a3b8; background:#0e0e11;"><h1>404 Not Found</h1></div>`; }
        window.addEventListener('hashchange', checkHash);
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
