<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNTG Private</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #050505;
      color: #f5f2ea;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body.locked { cursor: default; }

    /* Gate */
    #gate {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      background: radial-gradient(ellipse at center, #1a1420 0%, #050505 65%);
    }
    .gate-card {
      width: 100%; max-width: 380px;
      padding: 56px 40px;
      display: flex; flex-direction: column; align-items: center;
    }
    .gate-mark {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10px; letter-spacing: 0.35em;
      color: rgba(201, 168, 76, 0.6);
      text-transform: uppercase;
      margin-bottom: 36px;
      display: flex; align-items: center; gap: 12px;
    }
    .gate-mark::before, .gate-mark::after {
      content: ''; width: 24px; height: 1px;
      background: rgba(201, 168, 76, 0.4);
    }
    .gate-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem; font-weight: 500;
      color: #f5f2ea; margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    .gate-sub {
      font-size: 13px; color: rgba(245, 242, 234, 0.48);
      margin-bottom: 40px; text-align: center;
      line-height: 1.6;
    }
    .gate-input-wrap {
      position: relative; width: 100%;
    }
    #pw {
      width: 100%;
      padding: 16px 18px;
      font-size: 16px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      letter-spacing: 0.4em;
      text-align: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(201, 168, 76, 0.2);
      color: #f5f2ea;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    #pw::placeholder {
      color: rgba(245, 242, 234, 0.25);
      letter-spacing: 0.1em;
    }
    #pw:focus {
      border-color: #c9a84c;
      background: rgba(201, 168, 76, 0.04);
    }
    #go {
      width: 100%;
      margin-top: 14px;
      padding: 14px 20px;
      background: #c9a84c;
      color: #0a0a0a;
      border: none;
      border-radius: 10px;
      font-family: 'Pretendard', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    #go:hover { background: #e4c878; }
    #go:active { transform: translateY(1px); }
    #go:disabled { opacity: 0.5; cursor: wait; }
    #err {
      margin-top: 18px;
      min-height: 18px;
      font-size: 12px;
      color: #ff8b8b;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      letter-spacing: 0.1em;
      text-align: center;
    }
    .gate-foot {
      position: fixed; bottom: 24px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10px; letter-spacing: 0.3em;
      color: rgba(245, 242, 234, 0.25);
      text-transform: uppercase;
    }

    /* Decrypted content mount */
    #content { display: none; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .shake { animation: shake 0.38s ease; }

    @media (prefers-reduced-motion: reduce) {
      .shake { animation: none; }
    }
  </style>
</head>

    function __b64d(s) {
      var bin = atob(s);
      var u = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      return u;
    }

    async function __decrypt(pwd) {
      var enc = new TextEncoder();
      var salt = __b64d(__ENC.salt);
      var iv   = __b64d(__ENC.iv);
      var ct   = __b64d(__ENC.ct);
      var keyMat = await crypto.subtle.importKey(
        'raw', enc.encode(pwd),
        { name: 'PBKDF2' }, false, ['deriveKey']
      );
      var key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: __ENC.iter, hash: 'SHA-256' },
        keyMat,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      var plain = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv }, key, ct
      );
      return new TextDecoder().decode(plain);
    }

    function __mountContent(html) {
      var mount = document.getElementById('content');
      mount.innerHTML = html;
      // Re-execute embedded scripts (innerHTML doesn't run them)
      var scripts = mount.querySelectorAll('script');
      scripts.forEach(function(old) {
        var s = document.createElement('script');
        for (var i = 0; i < old.attributes.length; i++) {
          s.setAttribute(old.attributes[i].name, old.attributes[i].value);
        }
        s.textContent = old.textContent;
        old.parentNode.replaceChild(s, old);
      });
      mount.style.display = 'block';
      document.getElementById('gate').style.display = 'none';
      document.body.classList.remove('locked');
      if (document.activeElement) document.activeElement.blur();
      document.addEventListener('keydown', function(e) {
        var next = document.getElementById('nextBtn');
        var prev = document.getElementById('prevBtn');
        if (!next) return;
        if (e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); next.click(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prev.click(); }
      });
    }

    async function __tryUnlock() {
      var pwInput = document.getElementById('pw');
      var goBtn = document.getElementById('go');
      var err = document.getElementById('err');
      var pwd = pwInput.value.trim();
      if (!pwd) return;
      err.textContent = '';
      goBtn.disabled = true;
      goBtn.textContent = 'Unlocking...';
      try {
        var html = await __decrypt(pwd);
        __mountContent(html);
      } catch (e) {
        err.textContent = 'INVALID CODE';
        var card = document.querySelector('.gate-card');
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
        pwInput.value = '';
        pwInput.focus();
      } finally {
        goBtn.disabled = false;
        goBtn.textContent = 'Unlock';
      }
    }

    document.getElementById('go').addEventListener('click', __tryUnlock);
    document.getElementById('pw').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); __tryUnlock(); }
    });

    // Focus input
    window.addEventListener('load', function() {
      setTimeout(function() { document.getElementById('pw').focus(); }, 50);
    });
  </script>
