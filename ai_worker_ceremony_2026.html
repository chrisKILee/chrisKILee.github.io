<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNTG Private</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #050505;
      color: #f5f2ea;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body.locked { cursor: default; }

    /* Gate */
    #gate {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      background: radial-gradient(ellipse at center, #1a1420 0%, #050505 65%);
    }
    .gate-card {
      width: 100%; max-width: 380px;
      padding: 56px 40px;
      display: flex; flex-direction: column; align-items: center;
    }
    .gate-mark {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10px; letter-spacing: 0.35em;
      color: rgba(201, 168, 76, 0.6);
      text-transform: uppercase;
      margin-bottom: 36px;
      display: flex; align-items: center; gap: 12px;
    }
    .gate-mark::before, .gate-mark::after {
      content: ''; width: 24px; height: 1px;
      background: rgba(201, 168, 76, 0.4);
    }
    .gate-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem; font-weight: 500;
      color: #f5f2ea; margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    .gate-sub {
      font-size: 13px; color: rgba(245, 242, 234, 0.48);
      margin-bottom: 40px; text-align: center;
      line-height: 1.6;
    }
    .gate-input-wrap {
      position: relative; width: 100%;
    }
    #pw {
      width: 100%;
      padding: 16px 18px;
      font-size: 16px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      letter-spacing: 0.4em;
      text-align: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(201, 168, 76, 0.2);
      color: #f5f2ea;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    #pw::placeholder {
      color: rgba(245, 242, 234, 0.25);
      letter-spacing: 0.1em;
    }
    #pw:focus {
      border-color: #c9a84c;
      background: rgba(201, 168, 76, 0.04);
    }
    #go {
      width: 100%;
      margin-top: 14px;
      padding: 14px 20px;
      background: #c9a84c;
      color: #0a0a0a;
      border: none;
      border-radius: 10px;
      font-family: 'Pretendard', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    #go:hover { background: #e4c878; }
    #go:active { transform: translateY(1px); }
    #go:disabled { opacity: 0.5; cursor: wait; }
    #err {
      margin-top: 18px;
      min-height: 18px;
      font-size: 12px;
      color: #ff8b8b;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      letter-spacing: 0.1em;
      text-align: center;
    }
    .gate-foot {
      position: fixed; bottom: 24px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10px; letter-spacing: 0.3em;
      color: rgba(245, 242, 234, 0.25);
      text-transform: uppercase;
    }

    /* Decrypted content mount */
    #content { display: none; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .shake { animation: shake 0.38s ease; }

    @media (prefers-reduced-motion: reduce) {
      .shake { animation: none; }
    }
  </style>
</head>
<body class="locked">

  <div id="gate">
    <div class="gate-card">
      <div class="gate-mark">VNTG · Private</div>
      <div class="gate-title">Protected</div>
      <div class="gate-sub">이 페이지는 비공개입니다.<br/>접근 코드를 입력해주세요.</div>
      <div class="gate-input-wrap">
        <input id="pw" type="password" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="CODE" maxlength="32" autofocus />
        <button id="go">Unlock</button>
        <div id="err"></div>
      </div>
    </div>
    <div class="gate-foot">AI-WORKER CONTEST · 2026</div>
  </div>

  <div id="content"></div>

    // --- 슬라이드 전역 상태 ---
    var _S = { slides: null, current: 0, onNavigate: null, triggerConfetti: null };

    function _goTo(idx) {
      if (!_S.slides) return;
      if (idx < 0 || idx >= _S.slides.length || idx === _S.current) return;
      _S.slides[_S.current].classList.remove('active');
      _S.slides[_S.current].classList.add('prev');
      _S.slides[idx].classList.remove('prev');
      _S.slides[idx].classList.add('active');
      document.querySelectorAll('.dot').forEach(function(d, i) {
        d.classList.toggle('active', i === idx);
      });
      _S.current = idx;
      var pb = document.getElementById('progress');
      if (pb) pb.style.width = ((idx + 1) / _S.slides.length * 100) + '%';
      var pc = document.getElementById('page-counter');
      if (pc) pc.textContent = String(idx + 1).padStart(2, '0') + ' / ' + String(_S.slides.length).padStart(2, '0');
      if (_S.onNavigate) _S.onNavigate(idx);
    }

    // 키보드 내비게이션 — 페이지 로드 시 전역 등록
    document.addEventListener('keydown', function(e) {
      if (!_S.slides) return;
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault(); _goTo(_S.current + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault(); _goTo(_S.current - 1);
      } else if (e.key === 'Home') {
        _goTo(0);
      } else if (e.key === 'End') {
        _goTo(_S.slides.length - 1);
      }
    });

    // --- Source protection (best-effort; true prevention impossible in browser) ---
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, false);
    document.addEventListener('keydown', function(e) {
      var k = (e.key || '').toUpperCase();
      var blockKey = (
        k === 'F12' ||
        (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'J' || k === 'C' || k === 'K')) ||
        (e.ctrlKey && (k === 'U' || k === 'S')) ||
        (e.metaKey && e.altKey && (k === 'I' || k === 'J' || k === 'C')) ||
        (e.metaKey && (k === 'U' || k === 'S'))
      );
      if (blockKey) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
    }, true);

    function __b64d(s) {
      var bin = atob(s);
      var u = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      return u;
    }

    async function __decrypt(pwd) {
      var enc = new TextEncoder();
      var salt = __b64d(__ENC.salt);
      var iv   = __b64d(__ENC.iv);
      var ct   = __b64d(__ENC.ct);
      var keyMat = await crypto.subtle.importKey(
        'raw', enc.encode(pwd),
        { name: 'PBKDF2' }, false, ['deriveKey']
      );
      var key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: __ENC.iter, hash: 'SHA-256' },
        keyMat,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      var plain = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv }, key, ct
      );
      return new TextDecoder().decode(plain);
    }

    function __mountContent(htmlStr) {
      var mount = document.getElementById('content');
      mount.innerHTML = htmlStr;
      mount.style.display = 'block';
      document.getElementById('gate').style.display = 'none';
      document.body.classList.remove('locked');
      document.body.tabIndex = -1;
      document.body.focus();

      // ── 슬라이드쇼 초기화 ──────────────────────────────────────
      _S.slides = document.querySelectorAll('.slide');
      _S.current = 0;

      var dotsContainer = document.getElementById('dots');
      var scriptOverlay = document.getElementById('scriptOverlay');
      var scriptText = document.getElementById('scriptText');
      var scriptVisible = false;

      function updateScript() {
        if (scriptText) scriptText.textContent = _S.slides[_S.current].getAttribute('data-script') || '';
      }

      function toggleScript() {
        scriptVisible = !scriptVisible;
        if (scriptOverlay) scriptOverlay.classList.toggle('show', scriptVisible);
        updateScript();
      }

      // 도트 생성
      _S.slides.forEach(function(_, i) {
        var d = document.createElement('div');
        d.className = 'dot' + (i === 0 ? ' active' : '');
        d.addEventListener('click', function() { _goTo(i); });
        dotsContainer.appendChild(d);
      });

      document.getElementById('prevBtn').addEventListener('click', function() { _goTo(_S.current - 1); });
      document.getElementById('nextBtn').addEventListener('click', function() { _goTo(_S.current + 1); });
      document.getElementById('scriptBtn').addEventListener('click', toggleScript);

      // 내비게이션 콜백 등록 (confetti + script update)
      _S.onNavigate = function(idx) {
        updateScript();
        if (_S.slides[idx].classList.contains('celebrate') && _S.triggerConfetti) {
          _S.triggerConfetti(_S.slides[idx].classList.contains('grand'));
        }
      };

      // 터치 스와이프
      var touchStartX = 0;
      document.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].clientX; }, {passive: true});
      document.addEventListener('touchend', function(e) {
        var dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 60) _goTo(_S.current + (dx < 0 ? 1 : -1));
      }, {passive: true});

      // 초기화
      var pb = document.getElementById('progress');
      if (pb) pb.style.width = (1 / _S.slides.length * 100) + '%';
      var pc = document.getElementById('page-counter');
      if (pc) pc.textContent = '01 / ' + String(_S.slides.length).padStart(2, '0');
      updateScript();

      // 컨페티
      var canvas = document.getElementById('confetti');
      var ctx = canvas.getContext('2d');
      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      resize();
      window.addEventListener('resize', resize);
      var particles = [];
      _S.triggerConfetti = function triggerConfetti(grand) {
        var colors = grand
          ? ['#ffd36b','#c9a84c','#e4c878','#ffffff','#f5f2ea']
          : ['#c9a84c','#e4c878','#f5f2ea','#c8a2c8'];
        var count = grand ? 180 : 100;
        for (var i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * canvas.width, y: -20,
            vx: (Math.random() - 0.5) * 6, vy: Math.random() * 5 + 3,
            size: Math.random() * 6 + 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, life: 160
          });
        }
      }
      function animateConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles = particles.filter(function(p) { return p.life > 0 && p.y < canvas.height + 20; });
        particles.forEach(function(p) {
          p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.rot += p.vr; p.life--;
          ctx.save();
          ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.fillStyle = p.color; ctx.globalAlpha = Math.min(1, p.life / 60);
          ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.4);
          ctx.restore();
        });
        requestAnimationFrame(animateConfetti);
      }
      animateConfetti();
    }

    async function __tryUnlock() {
      var pwInput = document.getElementById('pw');
      var goBtn = document.getElementById('go');
      var err = document.getElementById('err');
      var pwd = pwInput.value.trim();
      if (!pwd) return;
      err.textContent = '';
      goBtn.disabled = true;
      goBtn.textContent = 'Unlocking...';
      try {
        var html = await __decrypt(pwd);
        __mountContent(html);
      } catch (e) {
        err.textContent = 'INVALID CODE';
        var card = document.querySelector('.gate-card');
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
        pwInput.value = '';
        pwInput.focus();
      } finally {
        goBtn.disabled = false;
        goBtn.textContent = 'Unlock';
      }
    }

    document.getElementById('go').addEventListener('click', __tryUnlock);
    document.getElementById('pw').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); __tryUnlock(); }
    });

    // Focus input
    window.addEventListener('load', function() {
      setTimeout(function() { document.getElementById('pw').focus(); }, 50);
    });
  </script>
</body>
</html>
