<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛴️ 대마도 여행</title>
<meta name="description" content="쓰시마 · 対馬 — 부산에서 배로 닿는 가장 가까운 일본. 일정표와 좌표 기반 지도 문서 모음.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script>(function(){try{var t=localStorage.getItem('tsu_theme');if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
/* ============================================================
   대마도 여행 — Vercel-inspired design system
   ink + gray + 4-pair mesh gradient. 장식은 히어로의 메시 그라디언트 하나뿐.
   ============================================================ */

:root{
  color-scheme:light;

  /* surface ladder */
  --canvas:#ffffff;
  --canvas-soft:#fafafa;
  --canvas-soft-2:#f5f5f5;

  /* ink & text */
  --primary:#171717;
  --on-primary:#ffffff;
  --ink:#171717;
  --body:#4d4d4d;
  --mute:#888888;

  /* lines */
  --hairline:#ebebeb;
  --hairline-strong:#a1a1a1;
  --ring:rgba(0,0,0,.08);

  /* semantic */
  --link:#0070f3;
  --error:#ee0000;

  /* brand gradient stops — 하나의 객체로만 사용, 축소·재배열 금지 */
  --g-develop-start:#007cf0;
  --g-develop-end:#00dfd8;
  --g-preview-start:#7928ca;
  --g-preview-end:#ff0080;
  --g-ship-start:#ff4d4d;
  --g-ship-end:#f9cb28;
  --mesh-alpha:.30;
  --mesh-blur:0px;

  /* elevation — 작은 오프셋을 겹쳐 쌓는다. 단일 무거운 그림자 금지 */
  --shadow-1:inset 0 0 0 1px var(--ring);
  --shadow-2:0 1px 1px rgba(0,0,0,.02), 0 2px 2px rgba(0,0,0,.04), inset 0 0 0 1px var(--ring);
  --shadow-3:0 2px 2px rgba(0,0,0,.04), 0 8px 8px -8px rgba(0,0,0,.04), inset 0 0 0 1px var(--ring);
  --shadow-4:0 2px 2px rgba(0,0,0,.04), 0 8px 16px -4px rgba(0,0,0,.04), inset 0 0 0 1px var(--ring);

  /* type */
  --sans:'Geist','Inter',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'Geist Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;

  /* spacing — base 4px */
  --s-xxs:4px; --s-xs:8px; --s-sm:12px; --s-md:16px; --s-lg:24px;
  --s-xl:32px; --s-2xl:40px; --s-3xl:48px; --s-4xl:64px; --s-5xl:96px;

  /* radius */
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-pill-sm:64px; --r-pill:100px; --r-full:9999px;

  /* 문서 인덱스는 읽기 폭 우선 — 브랜드의 legacy page-width(1200) 보다 좁게 */
  --page:1024px;
  --docbar-h:52px;
}

[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0a0a0a;
  --canvas-soft:#000000;
  --canvas-soft-2:#141414;
  --primary:#ededed;
  --on-primary:#0a0a0a;
  --ink:#ededed;
  --body:#a1a1a1;
  --mute:#7d7d7d;
  --hairline:#2e2e2e;
  --hairline-strong:#666666;
  --ring:rgba(255,255,255,.10);
  --link:#3291ff;
  --error:#ff6166;
  --mesh-alpha:.42;
  --shadow-1:inset 0 0 0 1px var(--ring);
  --shadow-2:0 1px 1px rgba(0,0,0,.30), 0 2px 2px rgba(0,0,0,.24), inset 0 0 0 1px var(--ring);
  --shadow-3:0 2px 2px rgba(0,0,0,.30), 0 8px 8px -8px rgba(0,0,0,.40), inset 0 0 0 1px var(--ring);
  --shadow-4:0 2px 2px rgba(0,0,0,.30), 0 8px 16px -4px rgba(0,0,0,.40), inset 0 0 0 1px var(--ring);
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

body{
  background:var(--canvas-soft);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  font-weight:400;
  line-height:24px;
  -webkit-font-smoothing:antialiased;
  /* 한국어 타이포 — 어절 단위 줄바꿈 */
  word-break:keep-all;
  overflow-wrap:break-word;
  min-height:100vh;
  display:flex;flex-direction:column;
}
main{flex:1}
p,li{text-wrap:pretty}
h1,h2,h3{text-wrap:balance;font-weight:600}
a{color:inherit;text-decoration:none}
.nb{white-space:nowrap}
::selection{background:var(--primary);color:var(--on-primary)}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:var(--r-sm)}

/* width:100% 필수 — body 가 flex column 이라 margin:0 auto 만 두면 shrink-to-fit 된다 */
.wrap{width:100%;max-width:var(--page);margin:0 auto;padding:0 var(--s-lg)}
@media (max-width:600px){.wrap{padding:0 var(--s-md)}}

/* ---------- 공통 네비(48px) 다크 대응 ---------- */
[data-theme="dark"] #page-header{background:var(--canvas)!important;border-bottom-color:var(--hairline)!important}
[data-theme="dark"] #page-header .ph-brand{color:var(--ink)!important}
[data-theme="dark"] #page-header .ph-nav a{color:var(--body)!important}
[data-theme="dark"] #page-header .ph-nav a:hover{color:var(--ink)!important;background:var(--canvas-soft-2)!important}
[data-theme="dark"] #page-header .ph-sep{color:var(--hairline)!important}

/* ---------- 문서 바 (sticky, 네비 아래 48px) ---------- */
.docbar{
  position:sticky;top:48px;z-index:40;
  height:var(--docbar-h);
  background:color-mix(in srgb, var(--canvas) 92%, transparent);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--hairline);
}
.docbar .wrap{height:100%;display:flex;align-items:center;gap:var(--s-md)}
.crumb{
  font-family:var(--mono);font-size:12px;line-height:16px;color:var(--mute);
  display:flex;align-items:center;gap:var(--s-xxs);min-width:0;
}
.crumb a{color:var(--mute);transition:color .15s}
.crumb a:hover{color:var(--ink)}
.crumb .cur{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb .sep{color:var(--hairline-strong)}
.docbar .sp{flex:1}

/* nav 스케일 버튼 — 6px radius (마케팅 pill과 섞지 않는다) */
.btn-nav{
  font-family:var(--sans);font-size:14px;font-weight:500;line-height:20px;
  height:28px;padding:0 var(--s-xs);
  display:inline-flex;align-items:center;gap:6px;
  background:var(--canvas);color:var(--ink);
  border:1px solid var(--hairline);border-radius:var(--r-sm);
  cursor:pointer;white-space:nowrap;
  transition:border-color .15s,background .15s;
}
.btn-nav:hover{border-color:var(--hairline-strong)}
.btn-nav .ico{width:14px;height:14px;display:block}

/* ---------- 히어로 — 메시 그라디언트는 여기서만, 히어로 스케일로 ---------- */
.hero{position:relative;overflow:hidden;background:var(--canvas-soft);border-bottom:1px solid var(--hairline)}
.hero .wrap{position:relative;z-index:1;padding-top:var(--s-4xl);padding-bottom:var(--s-4xl)}
@media (max-width:600px){.hero .wrap{padding-top:var(--s-2xl);padding-bottom:var(--s-2xl)}}

.mesh{
  position:absolute;inset:-20% -10% auto -10%;height:150%;
  pointer-events:none;opacity:var(--mesh-alpha);
  background:
    radial-gradient(38% 55% at 12% 18%, var(--g-develop-start) 0%, transparent 62%),
    radial-gradient(34% 48% at 30% 4%,  var(--g-develop-end)   0%, transparent 60%),
    radial-gradient(40% 60% at 58% 12%, var(--g-preview-start) 0%, transparent 62%),
    radial-gradient(36% 52% at 78% 0%,  var(--g-preview-end)   0%, transparent 58%),
    radial-gradient(34% 50% at 92% 22%, var(--g-ship-start)    0%, transparent 60%),
    radial-gradient(30% 44% at 70% 30%, var(--g-ship-end)      0%, transparent 58%);
  filter:blur(40px) saturate(1.05);
}

.eyebrow{
  font-family:var(--mono);font-size:12px;line-height:16px;color:var(--body);
  display:inline-flex;align-items:center;gap:var(--s-xs);
  background:color-mix(in srgb, var(--canvas) 80%, transparent);
  border:1px solid var(--hairline);
  border-radius:var(--r-full);
  padding:var(--s-xxs) var(--s-sm);
  margin-bottom:var(--s-lg);
}
.eyebrow .dot{width:6px;height:6px;border-radius:var(--r-full);background:var(--g-develop-end);flex:none}

h1{
  font-size:clamp(32px,5.2vw,48px);
  font-weight:600;
  line-height:1.08;
  letter-spacing:-.045em;
  color:var(--ink);
  max-width:16ch;      /* 줄바꿈은 balance 에 맡긴다 — <br> 로 손대지 않음 */
}
.lede{
  margin-top:var(--s-md);
  max-width:60ch;
  font-size:18px;line-height:28px;color:var(--body);
}
@media (max-width:600px){.lede{font-size:16px;line-height:26px}}

.hero-meta{
  margin-top:var(--s-lg);
  display:flex;flex-wrap:wrap;gap:var(--s-xs) var(--s-md);
  font-family:var(--mono);font-size:12px;line-height:16px;color:var(--mute);
}
.hero-meta b{color:var(--body);font-weight:500}

/* ---------- 도구 줄 ---------- */
.tools{padding:var(--s-xl) 0 var(--s-md)}
.tools .row{display:flex;gap:var(--s-sm);align-items:center;flex-wrap:wrap}
.field{position:relative;flex:1;min-width:240px}
.field .ico{
  position:absolute;left:var(--s-sm);top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--mute);pointer-events:none;
}
.search{
  width:100%;height:48px;
  padding:0 var(--s-sm) 0 40px;
  background:var(--canvas);color:var(--ink);
  border:1px solid var(--hairline);border-radius:var(--r-sm);
  font-family:var(--sans);font-size:16px;line-height:24px;
  outline:none;transition:border-color .15s;
}
.search::placeholder{color:var(--mute)}
.search:focus{border-color:var(--hairline-strong)}
.count{
  font-family:var(--mono);font-size:12px;line-height:16px;color:var(--mute);
  white-space:nowrap;
}

/* ---------- 카드 그리드 ---------- */
.grid{
  display:grid;gap:var(--s-md);
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  padding-bottom:var(--s-5xl);
}
@media (max-width:600px){.grid{grid-template-columns:1fr}}

.card{
  position:relative;display:flex;flex-direction:column;gap:var(--s-sm);
  background:var(--canvas);
  border-radius:var(--r-md);
  padding:var(--s-lg);
  box-shadow:var(--shadow-2);
  transition:box-shadow .15s cubic-bezier(.16,1,.3,1), transform .15s cubic-bezier(.16,1,.3,1);
}
.card:hover{box-shadow:var(--shadow-4);transform:translateY(-2px)}
.card:focus-within{box-shadow:var(--shadow-4)}

.card .idx{font-family:var(--mono);font-size:12px;line-height:16px;color:var(--mute)}
.card h2{
  font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.03em;color:var(--ink);
}
.card h2 a::after{content:"";position:absolute;inset:0}
.card .tag{
  align-self:flex-start;
  font-family:var(--mono);font-size:12px;line-height:16px;color:var(--body);
  background:var(--canvas-soft-2);border-radius:var(--r-sm);
  padding:2px var(--s-xs);
}
.card .foot{
  margin-top:auto;padding-top:var(--s-sm);
  display:flex;align-items:center;gap:var(--s-xs);flex-wrap:nowrap;
  border-top:1px solid var(--hairline);
}
.badge{
  flex:none;
  font-family:var(--sans);font-size:12px;line-height:16px;
  background:var(--canvas-soft-2);color:var(--body);
  border-radius:var(--r-full);padding:2px var(--s-xs);
}
.badge.new{background:var(--primary);color:var(--on-primary);font-weight:500}
.card .file{
  flex:1 1 auto;min-width:0;margin-left:auto;text-align:right;
  font-family:var(--mono);font-size:12px;line-height:16px;color:var(--mute);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.card .arrow{flex:none;width:16px;height:16px;color:var(--mute);transition:transform .15s,color .15s}
.card:hover .arrow{transform:translateX(3px);color:var(--ink)}

.empty{
  grid-column:1/-1;
  background:var(--canvas-soft-2);border-radius:var(--r-lg);
  padding:var(--s-3xl);text-align:center;color:var(--mute);font-size:16px;
}

/* ---------- 푸터 ---------- */
footer{border-top:1px solid var(--hairline);background:var(--canvas)}
footer .wrap{padding:var(--s-4xl) var(--s-lg)}
footer .lbl{
  font-family:var(--mono);font-size:12px;line-height:16px;color:var(--mute);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:var(--s-xs);
}
footer p{font-size:14px;line-height:20px;letter-spacing:-.01em;color:var(--body);max-width:70ch}
footer a.inline{color:var(--link)}
footer a.inline:hover{text-decoration:underline}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
<script src="/assets/js/page-header.js"></script>
</head>

<body>

<div class="docbar">
  <div class="wrap">
    <nav class="crumb" aria-label="현재 위치">
      <a href="/">Home</a>
      <span class="sep">/</span>
      <span class="cur">대마도 여행</span>
    </nav>
    <span class="sp"></span>
    <button type="button" class="btn-nav" id="themeBtn" aria-label="테마 전환">
      <span class="ico" id="themeIco" aria-hidden="true"></span>
      <span id="themeLbl">다크</span>
    </button>
  </div>
</div>

<header class="hero">
  <div class="mesh" aria-hidden="true"></div>
  <div class="wrap">
    <span class="eyebrow"><span class="dot"></span>쓰시마 · 対馬</span>
    <h1>부산에서 배로 닿는 가장 가까운 일본.</h1>
    <p class="lede">히타카츠까지 1시간 10분, 이즈하라까지 2시간 10분. 좌표로 찍은 지도와 실제로 굴려본 일정표를 모아 둡니다.</p>
    <div class="hero-meta">
      <span><b>34.10N–34.71N</b> / 129.16E–129.50E</span>
      <span><b id="metaCount">—</b> documents</span>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="tools">
    <div class="row">
      <div class="field">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14" stroke-linecap="round"/>
        </svg>
        <input type="search" class="search" id="searchInput" placeholder="문서 검색" autocomplete="off" aria-label="문서 검색">
      </div>
      <span class="count" id="countLabel">—</span>
    </div>
  </div>

  <div class="grid" id="filesContainer"></div>
</main>

<footer>
  <div class="wrap">
    <p class="lbl">note</p>
    <p>배편 시간표·요금·영업시간은 자주 바뀝니다. 각 문서에 적힌 수치는 작성 시점 기준이며, 예약 전 각 선사·업소 공식 정보로 재확인하세요. 문의는 <a class="inline" href="/">아카이브</a>로.</p>
  </div>
</footer>

<script>
(function(){
  "use strict";

  /* ---------------- theme ---------------- */
  var KEY='tsu_theme';
  var btn=document.getElementById('themeBtn');
  var ico=document.getElementById('themeIco');
  var lbl=document.getElementById('themeLbl');
  var SUN='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3.1"/><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.95 3.05l-1.13 1.13M4.18 11.82l-1.13 1.13M12.95 12.95l-1.13-1.13M4.18 4.18 3.05 3.05"/></svg>';
  var MOON='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M13.5 9.4A5.6 5.6 0 0 1 6.6 2.5a5.8 5.8 0 1 0 6.9 6.9Z"/></svg>';

  function applyTheme(t){
    document.documentElement.setAttribute('data-theme',t);
    var dark=(t==='dark');
    ico.innerHTML=dark?SUN:MOON;
    lbl.textContent=dark?'라이트':'다크';
    btn.setAttribute('aria-label',dark?'라이트 모드로 전환':'다크 모드로 전환');
    try{localStorage.setItem(KEY,t);}catch(e){}
  }
  var saved=null;
  try{saved=localStorage.getItem(KEY);}catch(e){}
  applyTheme(saved||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
  btn.addEventListener('click',function(){
    applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
  });

  /* ---------------- data ---------------- */
  var CATEGORY_HASH='PVXJPHQ';
  var WEEK=604800000;
  var files=[];

  var container=document.getElementById('filesContainer');
  var countLabel=document.getElementById('countLabel');
  var metaCount=document.getElementById('metaCount');
  var search=document.getElementById('searchInput');

  var ARROW='<svg class="arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function isNew(createdAt){
    if(!createdAt) return false;
    var t=new Date(createdAt).getTime();
    return !isNaN(t) && (Date.now()-t) < WEEK;
  }

  function render(list){
    if(!list.length){
      container.innerHTML='<div class="empty">조건에 맞는 문서가 없습니다.</div>';
    } else {
      container.innerHTML=list.map(function(f,i){
        var num=String(i+1).padStart(2,'0');
        return '<article class="card">'
          +'<span class="idx">'+num+'</span>'
          +'<h2><a href="./'+encodeURIComponent(f.filename)+'">'+esc(f.displayName)+'</a></h2>'
          +(f.memo?'<span class="tag">'+esc(f.memo)+'</span>':'')
          +'<div class="foot">'
            +(isNew(f.createdAt)?'<span class="badge new">NEW</span>':'')
            +(f.createdAt?'<span class="badge">'+esc(f.createdAt)+'</span>':'')
            +'<span class="file">'+esc(f.filename.replace(/\.html$/,''))+'</span>'
            +ARROW
          +'</div>'
        +'</article>';
      }).join('');
    }
    var n=list.length, total=files.length;
    countLabel.textContent=(n===total)?(total+' documents'):(n+' / '+total);
  }

  function applyFilter(){
    var q=search.value.trim().toLowerCase();
    if(!q) return render(files);
    render(files.filter(function(f){
      return (f.displayName+' '+f.filename+' '+(f.memo||'')).toLowerCase().indexOf(q)>-1;
    }));
  }

  function fail(msg){
    container.innerHTML='<div class="empty">'+esc(msg)+'</div>';
    countLabel.textContent='—';
  }

  fetch('/site.json?v='+Date.now())
    .then(function(r){ if(!r.ok) throw new Error('site.json '+r.status); return r.json(); })
    .then(function(site){
      files=Object.entries(site.files||{})
        .filter(function(e){ return e[1].categoryHash===CATEGORY_HASH && e[1].visible!==false; })
        .sort(function(a,b){ return (a[1].order||999)-(b[1].order||999); })
        .map(function(e){
          return {hash:e[0], filename:e[1].filename, displayName:e[1].displayName,
                  createdAt:e[1].createdAt, memo:e[1].memo};
        });
      metaCount.textContent=files.length;
      render(files);
    })
    .catch(function(err){
      console.error('문서 목록을 불러오지 못했습니다:', err);
      fail('문서 목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.');
    });

  search.addEventListener('input', applyFilter);
})();
</script>

</body>
</html>
