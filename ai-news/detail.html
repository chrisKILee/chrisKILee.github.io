<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Tech Feed — 상세</title>
<link rel="icon" href="/assets/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --border: #E5E7EB;
    --text-primary: #111827;
    --text-secondary: #6B7280;
    --text-muted: #9CA3AF;
    --accent: #2563EB;

    --cat-claude: #7C3AED;   --cat-claude-bg: #F5F3FF;   --cat-claude-border: #DDD6FE;
    --cat-gemini: #2563EB;   --cat-gemini-bg: #EFF6FF;   --cat-gemini-border: #BFDBFE;
    --cat-codex: #059669;    --cat-codex-bg: #ECFDF5;    --cat-codex-border: #A7F3D0;
    --cat-usecase: #D97706;  --cat-usecase-bg: #FFFBEB;  --cat-usecase-border: #FDE68A;
  }

  body {
    font-family: 'Inter', -apple-system, 'Apple SD Gothic Neo', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Nav ── */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    max-width: 860px; margin: 0 auto;
    padding: 0 24px; height: 60px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .back-btn {
    display: flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 500;
    color: var(--text-secondary); text-decoration: none;
    padding: 6px 12px; border-radius: 8px;
    transition: background 0.15s, color 0.15s;
  }
  .back-btn:hover { background: var(--bg); color: var(--text-primary); }
  .nav-logo {
    font-size: 14px; font-weight: 600;
    color: var(--text-muted); text-decoration: none;
  }

  /* ── Content ── */
  .content {
    max-width: 860px; margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ── Article Header ── */
  .article-meta {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .cat-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 100px;
    letter-spacing: 0.04em;
  }
  .cat-badge::before {
    content: ''; display: block;
    width: 5px; height: 5px; border-radius: 50%;
    background: currentColor;
  }
  .cat-claude  { color: var(--cat-claude);  background: var(--cat-claude-bg);  border: 1px solid var(--cat-claude-border); }
  .cat-gemini  { color: var(--cat-gemini);  background: var(--cat-gemini-bg);  border: 1px solid var(--cat-gemini-border); }
  .cat-codex   { color: var(--cat-codex);   background: var(--cat-codex-bg);   border: 1px solid var(--cat-codex-border); }
  .cat-usecase { color: var(--cat-usecase); background: var(--cat-usecase-bg); border: 1px solid var(--cat-usecase-border); }

  .article-date { font-size: 13px; color: var(--text-muted); }

  .article-title {
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 700; line-height: 1.3;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }
  .article-summary {
    font-size: 17px; color: var(--text-secondary);
    line-height: 1.7;
    padding: 20px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    margin-bottom: 32px;
  }
  .original-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500;
    color: var(--accent); text-decoration: none;
    padding: 8px 16px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    margin-bottom: 40px;
    transition: background 0.15s;
  }
  .original-link:hover { background: #EFF6FF; }

  /* ── Sections ── */
  .section { margin-bottom: 40px; }
  .section-title {
    font-size: 13px; font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::after {
    content: ''; flex: 1;
    height: 1px; background: var(--border);
  }

  /* ── Overview ── */
  .overview-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    font-size: 15px;
    line-height: 1.8;
    color: var(--text-secondary);
  }

  /* ── Key Points ── */
  .keypoints-table {
    width: 100%; border-collapse: collapse;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    font-size: 14px;
  }
  .keypoints-table tr:first-child th { padding-top: 16px; }
  .keypoints-table tr:last-child td { border-bottom: none; }
  .keypoints-table th {
    width: 30%; padding: 12px 20px;
    text-align: left; font-weight: 600;
    font-size: 13px; color: var(--text-primary);
    background: #FAFAFA;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .keypoints-table td {
    padding: 12px 20px;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    line-height: 1.6;
  }

  /* ── Comparison Table ── */
  .comparison-table {
    width: 100%; border-collapse: collapse;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    font-size: 13px;
  }
  .comparison-table thead th {
    padding: 12px 16px;
    text-align: left; font-weight: 600;
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    background: #FAFAFA;
    border-bottom: 1px solid var(--border);
  }
  .comparison-table tbody tr:last-child td { border-bottom: none; }
  .comparison-table tbody td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text-secondary);
    vertical-align: middle;
  }
  .comparison-table tbody tr:first-child td { font-weight: 600; color: var(--text-primary); }

  /* ── Timeline ── */
  .timeline { display: flex; flex-direction: column; gap: 0; }
  .timeline-item {
    display: flex; gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-left {
    width: 100px; flex-shrink: 0;
    font-size: 12px; font-weight: 600;
    color: var(--text-muted);
    padding-top: 2px;
  }
  .timeline-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: var(--surface);
    flex-shrink: 0;
    margin-top: 5px;
  }
  .timeline-text {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
    flex: 1;
  }

  /* ── Error / Not Found ── */
  .not-found {
    text-align: center; padding: 100px 24px;
    color: var(--text-muted);
  }
  .not-found h2 { font-size: 24px; margin-bottom: 12px; color: var(--text-secondary); }
  .not-found a { color: var(--accent); text-decoration: none; }

  /* ── Footer ── */
  footer {
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  .footer-inner {
    max-width: 860px; margin: 0 auto;
    padding: 20px 24px;
  }
  footer p { font-size: 13px; color: var(--text-muted); }

  @media (max-width: 640px) {
    .content { padding: 24px 16px 60px; }
    .nav-inner { padding: 0 16px; }
    .keypoints-table th { width: 38%; }
    .timeline-left { width: 80px; font-size: 11px; }
  }
</style>
  <script src="/assets/js/page-header.js"></script>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="back-btn" href="/">← 목록으로</a>
    <a class="nav-logo" href="/">AI Tech Feed</a>
  </div>
</nav>

<main class="content" id="content">
  <div class="not-found">
    <p>로딩 중...</p>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <p>© 2026 Chris Lee — AI Tech Feed</p>
  </div>
</footer>

<script src="/assets/js/ai-articles.js"></script>
<script>
  const CAT_LABEL = { claude: 'Claude', gemini: 'Gemini', codex: 'Codex', usecase: '활용 사례' };

  function fmtDate(d) {
    const [y, m, dd] = d.split('-');
    return `${y}년 ${parseInt(m)}월 ${parseInt(dd)}일`;
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderKeyPoints(keyPoints) {
    if (!keyPoints || !keyPoints.length) return '';
    return `
      <div class="section">
        <div class="section-title">핵심 포인트</div>
        <table class="keypoints-table">
          <tbody>
            ${keyPoints.map(k => `
              <tr>
                <th>${escHtml(k.label)}</th>
                <td>${escHtml(k.value)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  function renderComparison(rows) {
    if (!rows || !rows.length) return '';
    const keys = Object.keys(rows[0]);
    return `
      <div class="section">
        <div class="section-title">비교표</div>
        <div style="overflow-x:auto">
          <table class="comparison-table">
            <thead>
              <tr>${keys.map(k => `<th>${escHtml(k)}</th>`).join('')}</tr>
            </thead>
            <tbody>
              ${rows.map(row => `
                <tr>${keys.map(k => `<td>${escHtml(row[k] ?? '—')}</td>`).join('')}</tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  function renderTimeline(timeline) {
    if (!timeline || !timeline.length) return '';
    return `
      <div class="section">
        <div class="section-title">타임라인</div>
        <div class="timeline">
          ${timeline.map(t => `
            <div class="timeline-item">
              <div class="timeline-left">${escHtml(t.date)}</div>
              <div class="timeline-dot"></div>
              <div class="timeline-text">${escHtml(t.event)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  function render() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const content = document.getElementById('content');

    if (!id) {
      content.innerHTML = `
        <div class="not-found">
          <h2>아이템을 찾을 수 없습니다</h2>
          <p><a href="/">목록으로 돌아가기</a></p>
        </div>`;
      return;
    }

    const article = AI_ARTICLES.find(a => a.id === id);
    if (!article) {
      content.innerHTML = `
        <div class="not-found">
          <h2>"${escHtml(id)}"를 찾을 수 없습니다</h2>
          <p>삭제됐거나 잘못된 링크입니다.</p>
          <p style="margin-top:12px"><a href="/">← 목록으로</a></p>
        </div>`;
      return;
    }

    document.title = `${article.title} — AI Tech Feed`;

    const d = article.detail;
    content.innerHTML = `
      <div class="article-meta">
        <span class="cat-badge cat-${article.category}">${CAT_LABEL[article.category]}</span>
        <span class="article-date">${fmtDate(article.date)}</span>
      </div>

      <h1 class="article-title">${escHtml(article.title)}</h1>
      <div class="article-summary">${escHtml(article.summary)}</div>

      <a class="original-link" href="${escHtml(article.originalUrl)}" target="_blank" rel="noopener">
        원문 보기 ↗
      </a>

      <div class="section">
        <div class="section-title">개요</div>
        <div class="overview-box">${escHtml(d.overview)}</div>
      </div>

      ${renderKeyPoints(d.keyPoints)}
      ${renderComparison(d.comparison)}
      ${renderTimeline(d.timeline)}
    `;
  }

  render();
</script>
</body>
</html>
