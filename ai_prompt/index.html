<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Image Prompt Generator</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="styles.css?v=20260620b" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-topbar">
        <div>
          <h1>Prompt Generator</h1>
          <p>템플릿, 분위기, 규칙, 문구를 조합해서 이미지 생성 프롬프트를 만든다.</p>
        </div>
        <div class="topbar-actions">
          <button class="secondary-button" id="resetButton" type="button">초기화</button>
          <button class="primary-button" id="copyTopButton" type="button">복사</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="panel template-panel" aria-label="템플릿과 프리셋">
          <section>
            <div class="section-heading">
              <h2>템플릿</h2>
              <span id="templateCount"></span>
            </div>
            <div class="template-list" id="templateList"></div>
          </section>

          <section>
            <div class="section-heading">
              <h2>분위기</h2>
            </div>
            <div class="chip-list" id="moodList"></div>
          </section>

          <section>
            <div class="section-heading">
              <h2>공통 규칙</h2>
            </div>
            <div class="rule-list" id="ruleList"></div>
          </section>
        </aside>

        <section class="panel input-panel" aria-label="입력">
          <div class="section-heading sticky-heading">
            <div>
              <h2 id="activeTemplateName">입력</h2>
              <p id="activeTemplateDescription"></p>
            </div>
          </div>

          <div class="input-stack">
            <div id="photoGuide" class="photo-guide hidden"></div>

            <section>
              <h3>변수</h3>
              <div class="form-grid" id="variableForm"></div>
            </section>

            <section id="photoConditionSection" class="hidden">
              <div class="section-heading">
                <h3>📸 내 사진 조건</h3>
              </div>
              <p class="helper-text">업로드할 사진에 맞춰 고르면 프롬프트가 자동으로 바뀝니다.</p>
              <div class="form-grid" id="photoConditionForm"></div>
            </section>

            <section id="messageEditorSection">
              <div class="section-heading">
                <h3>사진 위 문구</h3>
                <button class="secondary-button compact" id="addMessageButton" type="button">문구 추가</button>
              </div>
              <div class="preset-row" id="messagePresetRow"></div>
              <div class="message-list" id="messageList"></div>
            </section>

            <section>
              <h3>텍스트 처리</h3>
              <div class="segmented" role="group" aria-label="텍스트 처리 방식">
                <button type="button" data-output-mode="direct_text" id="modeDirect">모델이 직접 쓰기</button>
                <button type="button" data-output-mode="postprocess_text" id="modePost">후처리 권장</button>
              </div>
              <p class="helper-text" id="outputModeHelp"></p>
            </section>

            <section>
              <h3>네거티브 프롬프트</h3>
              <label class="toggle-row">
                <input type="checkbox" id="includeNegative" />
                <span>공통 네거티브 프롬프트 포함</span>
              </label>
            </section>
          </div>
        </section>

        <section class="panel preview-panel" aria-label="결과">
          <div class="preview-toolbar">
            <div>
              <h2>최종 프롬프트</h2>
              <p><span id="charCount">0</span>자</p>
            </div>
            <button class="primary-button" id="copyButton" type="button">복사</button>
          </div>
          <textarea id="promptPreview" readonly spellcheck="false"></textarea>
          <div class="status-line" id="statusLine" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="/assets/js/page-header.js"></script>
    <script src="app.js?v=20260620b"></script>
  </body>
</html>
