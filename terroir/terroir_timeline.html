<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R&D실 개발 현황 타임라인</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e12;--bg2:#14141e;--bg3:#1b1b28;
  --border:#252535;
  --text:#ddddf0;--text2:#9898be;
  --lw:88px;   /* left label width */
  --rh:52px;   /* row height */
  --sh:24px;   /* sprint header height */
  --ph:30px;   /* phase header height */
}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:14px;min-height:100vh}

/* ── PAGE HEADER ── */
.pg{padding:22px 22px 0}
.pg h1{font-size:clamp(15px,2.5vw,20px);font-weight:700;letter-spacing:-.4px}
.pg h1 em{color:#7c6aff;font-style:normal}
.pg .sub{font-size:12px;color:var(--text2);margin-top:3px}
.bdgs{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.b{font-size:10px;font-weight:600;padding:2px 8px;border-radius:9px}
.b.c1{background:rgba(129,140,248,.12);color:#a5b4fc;border:1px solid rgba(129,140,248,.2)}
.b.c2{background:rgba(52,211,153,.12);color:#6ee7b7;border:1px solid rgba(52,211,153,.2)}
.b.c3{background:rgba(251,146,60,.12);color:#fdba74;border:1px solid rgba(251,146,60,.2)}
.b.st{background:rgba(148,163,184,.1);color:#b0b8cc;border:1px solid rgba(148,163,184,.2)}
.b.cu{background:rgba(245,158,11,.12);color:#fcd34d;border:1px solid rgba(245,158,11,.25);animation:bp 2s ease-in-out infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.6}}

/* ── FILTERS ── */
.flt{padding:12px 22px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fl{font-size:10px;font-weight:700;letter-spacing:.8px;color:#555580;text-transform:uppercase;margin-right:2px}
.chip{display:flex;align-items:center;gap:4px;padding:4px 10px 4px 7px;border-radius:14px;border:1.5px solid var(--border);background:var(--bg2);color:var(--text2);font-size:11.5px;font-weight:500;cursor:pointer;transition:all .15s;user-select:none;white-space:nowrap;font-family:inherit}
.chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.chip:hover{border-color:#484860;color:var(--text)}
.chip.on{color:var(--text);border-color:var(--cc,#888)}
.chip.all.on{border-color:#5a5a80}

/* ── NAV BAR (month navigation) ── */
.nav-bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 22px;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:40}
.nav-btn{height:28px;padding:0 10px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg3);color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;user-select:none;flex-shrink:0;white-space:nowrap;font-family:inherit}
.nav-btn:hover{border-color:#5a5a80;color:var(--text);background:#22223a}
.nav-btn:active{transform:scale(.92)}
.nav-btn.now-btn{font-size:10px;font-weight:700;letter-spacing:.5px;color:#dc4040;border-color:rgba(220,64,64,.35);background:rgba(220,64,64,.08)}
.nav-btn.now-btn:hover{background:rgba(220,64,64,.18);border-color:#dc4040;color:#ff6060}

/* ── TIMELINE ── */
.tl-wrap{padding-bottom:36px}
.tl-scroll{overflow-x:auto;overflow-y:visible;scroll-behavior:smooth}
.tl-scroll::-webkit-scrollbar{height:5px}
.tl-scroll::-webkit-scrollbar-track{background:var(--bg2)}
.tl-scroll::-webkit-scrollbar-thumb{background:#2a2a45;border-radius:3px}
.tl-inner{position:relative;min-width:max-content}

/* ── MONTH AXIS (sticky) ── */
.tl-axis{position:sticky;top:47px;z-index:30;background:var(--bg);border-bottom:1px solid var(--border)}
.ax-row{display:flex;height:22px;background:var(--bg2);position:relative}
.ax-stub{flex-shrink:0;width:var(--lw);background:var(--bg2);border-right:1px solid var(--border)}
.mo-cell{position:absolute;height:100%;display:flex;align-items:center;padding-left:6px;font-size:10px;font-weight:600;color:#8888b0;border-left:1px solid var(--border);white-space:nowrap;pointer-events:none}
.mo-cell.ny{color:#c0c0e0}

/* ── BODY ── */
.tl-body{position:relative}
.ch-band{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0}
.ch-band.c1{background:rgba(129,140,248,.018)}
.ch-band.c2{background:rgba(52,211,153,.018)}
.ch-band.c3{background:rgba(251,146,60,.018)}
.today-ln{position:absolute;top:0;bottom:0;width:2px;background:#dc2626;z-index:20;pointer-events:none}
.today-ln::after{content:'▼ Today';position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:9px;color:#dc2626;font-weight:700;white-space:nowrap}

/* ── PHASE HEADER ── */
.ph-row{display:flex;height:var(--ph);border-bottom:1px solid var(--border);z-index:5;position:relative;background:var(--bg3)}
.ph-lbl{flex-shrink:0;width:var(--lw);border-right:1px solid var(--border);display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:700;position:sticky;left:0;z-index:12;background:var(--bg3);white-space:nowrap;overflow:hidden}
.ph-track{position:relative;flex:1}
.ph-band{position:absolute;top:0;height:100%;display:flex;align-items:center;padding:0 9px;font-size:10px;font-weight:700;letter-spacing:.4px;border-left:2px solid;overflow:hidden;white-space:nowrap;opacity:.85}
.ph-band.c1{color:#a5b4fc;border-color:#818cf8;background:rgba(129,140,248,.07)}
.ph-band.c2{color:#6ee7b7;border-color:#34d399;background:rgba(52,211,153,.07)}
.ph-band.c3{color:#fdba74;border-color:#fb923c;background:rgba(251,146,60,.07)}
.ph-band.st{color:#b0b8cc;border-color:#94a3b8;background:rgba(148,163,184,.05)}

/* ── SPRINT HEADER ── */
.sp-row{display:flex;height:var(--sh);border-bottom:1px solid #1c1c2e;z-index:4;position:relative;background:var(--bg2)}
.sp-row.cur{background:rgba(245,158,11,.04)}
.sp-lbl{flex-shrink:0;width:var(--lw);border-right:1px solid var(--border);display:flex;align-items:center;padding:0 8px;font-size:10.5px;font-weight:600;color:#8888bc;position:sticky;left:0;z-index:12;background:var(--bg2);white-space:nowrap;overflow:hidden}
.sp-row.cur .sp-lbl{color:#c08028}
.sp-track{position:relative;flex:1}
.sp-range{position:absolute;top:0;height:100%;display:flex;align-items:center;padding-left:7px;font-size:9.5px;color:#c8c8e0;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden}
.sp-row.cur .sp-range{color:#f0c060}

/* ── TASK ROW ── */
.t-row{display:flex;height:var(--rh);border-bottom:1px solid #18182a;z-index:1;position:relative;transition:opacity .2s}
.t-row.dim{opacity:.07;pointer-events:none}

/* left: just person name */
.t-lbl{flex-shrink:0;width:var(--lw);border-right:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;padding:0 8px;gap:5px;background:var(--bg2);position:sticky;left:0;z-index:12}
.t-av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0}
.t-pname{font-size:11px;font-weight:600;white-space:nowrap;text-align:right}

/* track */
.t-track{position:relative;flex:1;overflow:visible}

/* ── BAR with text ── */
.t-bar{
  position:absolute;
  top:6px;
  height:calc(var(--rh) - 12px);
  border-radius:5px;
  display:flex;
  align-items:center;
  padding:0 10px;
  overflow:visible;          /* let text overflow */
  cursor:default;
  transition:filter .12s;
}
.t-bar:hover{filter:brightness(1.35);z-index:40}
.t-bar.active{animation:tglow 2.2s ease-in-out infinite}
@keyframes tglow{0%,100%{box-shadow:0 0 5px var(--gc)}50%{box-shadow:0 0 14px var(--gc)}}

.btext{
  font-size:12.5px;
  font-weight:600;
  color:rgba(255,255,255,.95);
  text-shadow:0 1px 4px rgba(0,0,0,.8);
  white-space:nowrap;
  pointer-events:none;
  /* no max-width, no overflow:hidden → always fully visible */
}

/* ── TOOLTIP ── */
.tt{position:fixed;background:#16162a;border:1px solid #2e2e52;border-radius:8px;padding:10px 14px;font-size:12.5px;z-index:9999;pointer-events:none;opacity:0;transition:opacity .1s;box-shadow:0 8px 28px rgba(0,0,0,.65);max-width:380px;line-height:1.65}
.tt.show{opacity:1}
.tt .h{font-weight:600;color:var(--text)}
.tt .m{color:var(--text2);font-size:11.5px;margin-top:4px}
.tt .s{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:9px;font-size:11px;font-weight:600}
.tt .s.active{background:rgba(74,222,128,.14);color:#4ade80}
.tt .s.done{background:rgba(165,180,252,.14);color:#a5b4fc}
.tt .s.plan{background:rgba(148,163,184,.1);color:#94a3b8}

/* ── STATS ── */
.stats{display:flex;flex-wrap:wrap;gap:16px;padding:12px 22px;border-top:1px solid var(--border);background:var(--bg2);font-size:12.5px;color:#8888b0}
.stats strong{color:var(--text);font-weight:600}
.note{font-size:11px;color:#4c4c68;margin-left:auto}

@media(prefers-reduced-motion:reduce){.t-bar.active{animation:none}@keyframes bp{0%,100%{opacity:1}}}
</style>
</head>

// BUILD TIMELINE DOM
// ─────────────────────────────────────────────────────────────────────────────
function build(){
  const root = document.getElementById('tlInner');
  const W = LW + d2x(TL_END_STR) + 32;
  root.style.width = W + 'px';

  // ── Month axis (sticky) ──────────────────────────────────────────────────
  const axis = el('div','tl-axis');
  axis.style.width = W + 'px';
  const mRow = el('div','ax-row');
  mRow.style.width = W + 'px';
  const mStub = el('div','ax-stub'); mStub.style.height='22px'; mRow.appendChild(mStub);
  let cur = new Date('2025-08-01');
  while(cur <= new Date('2026-10-01')){
    const px = LW + d2x(iso(cur));
    if(px >= LW){
      const mc = el('div','mo-cell'+(cur.getMonth()===0?' ny':''));
      mc.style.left = px+'px';
      mc.textContent = cur.getMonth()===0
        ? cur.getFullYear()+'년 '+(cur.getMonth()+1)+'월'
        : (cur.getMonth()+1)+'월';
      mRow.appendChild(mc);
    }
    cur.setMonth(cur.getMonth()+1);
  }
  // today in axis area
  const axT = el('div');
  axT.style.cssText=`position:absolute;top:0;bottom:0;width:2px;background:#dc2626;z-index:31;pointer-events:none;left:${LW+d2x(iso(new Date()))}px`;
  axis.appendChild(mRow);
  axis.appendChild(axT);
  root.appendChild(axis);

  // ── Body ────────────────────────────────────────────────────────────────
  const body = el('div','tl-body');
  body.style.cssText = `width:${W}px;position:relative`;

  // chapter bands
  [{start:'2025-08-04',end:'2025-12-19',cls:'c1'},
   {start:'2026-01-06',end:'2026-04-29',cls:'c2'},
   {start:'2026-06-01',end:'2026-09-30',cls:'c3'}].forEach(b=>{
    const band = el('div','ch-band '+b.cls);
    band.style.left = (LW+d2x(b.start))+'px';
    band.style.width = (d2x(b.end)-d2x(b.start))+'px';
    body.appendChild(band);
  });

  // today line
  const tl = el('div','today-ln');
  tl.style.left = (LW+d2x(iso(new Date())))+'px';
  body.appendChild(tl);

  let totTotal=0, totActive=0, totDone=0;

  TIMELINE.forEach(phase => {
    // Phase header
    const phRow = el('div','ph-row');
    const phLbl = el('div','ph-lbl');
    phLbl.style.color = {c1:'#a5b4fc',c2:'#6ee7b7',c3:'#fdba74',st:'#b0b8cc'}[phase.cls]||'#b0b8cc';
    phLbl.textContent = phase.label;
    phRow.appendChild(phLbl);
    const phTr = el('div','ph-track'); phTr.style.flex='1'; phTr.style.position='relative';
    const phB = el('div','ph-band '+phase.cls);
    phB.style.left = d2x(phase.start)+'px';
    phB.style.width = (d2x(phase.end)-d2x(phase.start))+'px';
    phB.textContent = phase.label;
    phTr.appendChild(phB); phRow.appendChild(phTr);
    body.appendChild(phRow);

    phase.sprints.forEach(sprint => {
      // Sprint header
      const spRow = el('div','sp-row'+(sprint.isCurrent?' cur':''));
      const spLbl = el('div','sp-lbl');
      spLbl.textContent = sprint.label;
      if(sprint.isCurrent){
        const sb = el('span');
        sb.textContent=' ★'; sb.style.color='#f59e0b';
        spLbl.appendChild(sb);
      }
      spRow.appendChild(spLbl);
      const spTr = el('div','sp-track'); spTr.style.flex='1'; spTr.style.position='relative';
      const spR = el('div','sp-range');
      spR.style.left = d2x(sprint.start)+'px';
      spR.style.width = Math.max(d2x(sprint.end)-d2x(sprint.start),10)+'px';
      spR.textContent = sprint.start+' ~ '+sprint.end;
      spTr.appendChild(spR); spRow.appendChild(spTr);
      body.appendChild(spRow);

      // Task rows
      sprint.tasks.forEach(task => {
        const person = PEOPLE[task.pid];
        if(!person) return;

        const row = el('div','t-row');
        row.dataset.pid = task.pid;

        // Left: avatar + name
        const lbl = el('div','t-lbl');
        const av = el('div','t-av');
        av.textContent = person.init;
        av.style.background = person.color+'70';
        av.style.border = '1.5px solid '+person.color;
        const pn = el('div','t-pname');
        pn.textContent = person.name.split('(')[0]; // show just first part if long
        pn.style.color = person.color;
        lbl.appendChild(av); lbl.appendChild(pn);
        row.appendChild(lbl);

        // Track
        const track = el('div','t-track');
        const bX = d2x(sprint.start);
        const bW = Math.max(d2x(sprint.end) - bX, 18);
        const isActive  = task.status.includes('진행');
        const isDone    = task.status.includes('완료') || task.status === 'Close';
        const isPlanned = task.status === '예정';

        const bar = el('div','t-bar'+(isActive?' active':''));
        if(isActive) bar.style.setProperty('--gc', person.color);
        bar.style.left  = bX+'px';
        bar.style.width = bW+'px';
        bar.style.background = isActive
          ? `linear-gradient(90deg,${person.color}d8,${person.color}80)`
          : isDone
          ? `${person.color}50`
          : `${person.color}25`;
        bar.style.borderLeft = `3px solid ${person.color}${isPlanned?'60':'bb'}`;
        if(isPlanned){ bar.style.borderStyle='dashed'; bar.style.opacity='.6'; }

        const bt = el('span','btext');
        bt.textContent = task.title;
        bar.appendChild(bt);
        bar.addEventListener('mouseenter', e => showTT(e, task, person, sprint));
        bar.addEventListener('mousemove',  moveT);
        bar.addEventListener('mouseleave', hideTT);
        track.appendChild(bar);
        row.appendChild(track);
        body.appendChild(row);

        totTotal++; if(isActive) totActive++; if(isDone) totDone++;
      });
    });
  });

  root.appendChild(body);
  document.getElementById('sTotal').textContent  = totTotal;
  document.getElementById('sActive').textContent = totActive;
  document.getElementById('sDone').textContent   = totDone;

  buildChips();
  buildNav();

  // 오늘 날짜를 수평+수직 중앙으로 초기 스크롤
  requestAnimationFrame(() => {
    scrollToDate(iso(new Date()));
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// PERSON FILTER
// ─────────────────────────────────────────────────────────────────────────────
function buildChips(){
  const sec = document.getElementById('fltSec');
  Object.entries(PEOPLE).forEach(([pid, p]) => {
    const c = el('button','chip');
    c.style.setProperty('--cc', p.color);
    c.dataset.pid = pid;
    c.innerHTML = `<span class="dot" style="background:${p.color}"></span>${p.name.split('(')[0]}`;
    c.addEventListener('click', () => filterBy(pid, c));
    sec.appendChild(c);
  });
}
function filterBy(pid, btn){
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('.t-row').forEach(r => {
    if(pid==='all' || r.dataset.pid===pid) r.classList.remove('dim');
    else r.classList.add('dim');
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// NAVIGATION  (‹‹  NOW  ››)
// ─────────────────────────────────────────────────────────────────────────────
const MONTH_PX = 5.2 * 30; // approx px per month

function buildNav(){
  document.getElementById('btnPrev').addEventListener('click', () => {
    const scr = document.getElementById('tlScroll');
    scr.scrollTo({ left: Math.max(0, scr.scrollLeft - MONTH_PX * 2), behavior: 'smooth' });
  });
  document.getElementById('btnNext').addEventListener('click', () => {
    const scr = document.getElementById('tlScroll');
    scr.scrollTo({ left: scr.scrollLeft + MONTH_PX * 2, behavior: 'smooth' });
  });
  document.getElementById('btnNow').addEventListener('click', () => {
    scrollToDate(iso(new Date()));
  });
}

// 특정 날짜를 수평 중앙으로, 타임라인 섹션을 수직 중앙으로 스크롤
function scrollToDate(dateStr){
  const scr = document.getElementById('tlScroll');
  const x = LW + d2x(dateStr);

  // 수평: 선택 날짜를 화면 중앙으로
  const visibleW = scr.clientWidth - LW;
  const targetX = Math.max(0, x - LW - visibleW / 2);
  scr.scrollTo({ left: targetX, behavior: 'smooth' });

  // 수직: 타임라인 전체 영역의 중앙이 뷰포트 중앙에 오도록
  const wrap = document.getElementById('tlWrap');
  const rect = wrap.getBoundingClientRect();
  const wrapMidY = rect.top + window.scrollY + rect.height / 2;
  const targetY = Math.max(0, wrapMidY - window.innerHeight / 2);
  window.scrollTo({ top: targetY, behavior: 'smooth' });
}

// 월 버튼 클릭: 해당 월의 중앙(15일)을 화면 중앙으로
function scrollToMonth(dateStr){
  const mid = dateStr.slice(0,8) + '15';
  scrollToDate(mid);
}


// ─────────────────────────────────────────────────────────────────────────────
// TOOLTIP
// ─────────────────────────────────────────────────────────────────────────────
const ttEl = document.getElementById('tt');
function showTT(e, task, person, sprint){
  const isA = task.status.includes('진행');
  const isD = task.status.includes('완료') || task.status === 'Close';
  ttEl.innerHTML = `
    <div class="h">${task.title}</div>
    <div class="m"><span style="color:${person.color}">● ${person.name}</span>
    &nbsp;·&nbsp; <strong>${sprint.label}</strong>
    &nbsp;·&nbsp; ${sprint.start} ~ ${sprint.end}
    ${task.key ? `<br>티켓 <strong style="color:#a5b4fc">${task.key}</strong>` : ''}</div>
    <div class="s ${isA?'active':isD?'done':'plan'}">${task.status}</div>`;
  moveT(e); ttEl.classList.add('show');
}
function moveT(e){
  let x=e.clientX+14, y=e.clientY-10;
  const w=ttEl.offsetWidth, h=ttEl.offsetHeight;
  if(x+w>innerWidth-8)  x=e.clientX-w-14;
  if(y+h>innerHeight-8) y=e.clientY-h-10;
  ttEl.style.left=x+'px'; ttEl.style.top=y+'px';
}
function hideTT(){ ttEl.classList.remove('show'); }

// ─────────────────────────────────────────────────────────────────────────────
build();
</script>
