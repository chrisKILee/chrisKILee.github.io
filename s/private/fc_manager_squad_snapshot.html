<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FC온라인 감독모드 스쿼드 스냅샷 — 네덜란드·독일</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --red:        #FF0000;
      --blue:       #0000FF;
      --yellow:     #FFFF00;
      --ink:        #111111;
      --surface:    #FFFFFF;
      --grey:       #808080;
      --grey-light: #DADADA;
      --muted:      #595959;
      --font-h:     'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-b:     'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-mono:  'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font-b);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-top: 48px;
    }

    .page-wrap { max-width: 1280px; margin: 0 auto; padding: 0 1.5rem 96px; }

    /* Hero */
    .hero { padding: clamp(3rem, 6vw, 5rem) 1.5rem clamp(2.5rem, 5vw, 4rem); border-bottom: 3px solid var(--ink); }
    .hero-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 40px; flex-wrap: wrap; }
    .hero-text { flex: 1 1 480px; }
    .hero-eyebrow {
      display: inline-block; background: var(--ink); color: #fff;
      font-family: var(--font-mono); font-size: 12px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 12px; margin-bottom: 20px;
    }
    .hero h1 {
      font-family: var(--font-h); font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin-bottom: 16px;
    }
    .hero p { color: var(--ink); opacity: 0.75; font-size: 1rem; max-width: 640px; line-height: 1.6; }
    .hero-note { margin-top: 20px; border-left: 4px solid var(--blue); padding: 12px 0 12px 16px; font-size: 0.875rem; color: var(--ink); opacity: 0.85; max-width: 640px; }
    .hero-note strong { opacity: 1; font-weight: 700; }

    .mondrian-deco {
      flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 24px); grid-template-rows: repeat(4, 24px);
      gap: 4px; background: var(--ink); padding: 4px; width: fit-content;
    }
    .mondrian-deco span { display: block; }
    .mondrian-deco .m-red { background: var(--red); grid-area: 1 / 1 / 3 / 3; }
    .mondrian-deco .m-surface1 { background: var(--surface); grid-area: 1 / 3 / 2 / 5; }
    .mondrian-deco .m-yellow { background: var(--yellow); grid-area: 2 / 3 / 4 / 4; }
    .mondrian-deco .m-surface2 { background: var(--surface); grid-area: 2 / 4 / 3 / 5; }
    .mondrian-deco .m-blue { background: var(--blue); grid-area: 3 / 4 / 5 / 5; }
    .mondrian-deco .m-surface3 { background: var(--surface); grid-area: 3 / 1 / 5 / 3; }
    .mondrian-deco .m-ink { background: var(--ink); grid-area: 4 / 3 / 5 / 4; }
    @media (max-width: 640px) { .mondrian-deco { display: none; } }

    /* Country tabs */
    .tab-bar { display: flex; gap: 0; border-bottom: 3px solid var(--ink); margin: 40px 0 24px; position: sticky; top: 48px; background: var(--surface); z-index: 100; }
    .tab-btn {
      display: flex; align-items: center; gap: 10px; padding: 14px 24px; font-size: 15px; font-weight: 700;
      border: none; background: none; cursor: pointer; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em;
      border-bottom: 4px solid transparent; margin-bottom: -3px; transition: color 0.2s, border-color 0.2s; font-family: var(--font-b);
    }
    .tab-swatch { width: 12px; height: 12px; display: inline-block; background: var(--grey-light); }
    .tab-btn:hover { color: var(--ink); }
    .tab-btn.active-ned { color: var(--ink); border-bottom-color: var(--red); }
    .tab-btn.active-ned .tab-swatch { background: var(--red); }
    .tab-btn.active-ger { color: var(--ink); border-bottom-color: var(--blue); }
    .tab-btn.active-ger .tab-swatch { background: var(--blue); }
    .country-pane { display: none; }
    .country-pane.active { display: block; }
    #pane-네덜란드 { --accent: var(--red); }
    #pane-독일 { --accent: var(--blue); }

    /* Date tabs */
    .date-tab-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px; }
    .date-btn {
      padding: 8px 18px; font-size: 13px; font-weight: 600; font-family: var(--font-mono);
      border-radius: 8px; border: 1.5px solid var(--grey-light); background: var(--surface); color: var(--ink);
      cursor: pointer; transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
    }
    .date-btn:hover { background: #F5F5F5; }
    .date-btn:active { transform: translateY(1px); }
    .date-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); }

    /* Meta bar — flat Mondrian color blocks, thin ink grid lines */
    .meta-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; background: var(--ink); border: 2px solid var(--ink); margin-bottom: 48px; }
    .meta-item { padding: 20px 18px; }
    .meta-item:nth-child(1) { background: var(--red); color: #fff; }
    .meta-item:nth-child(2) { background: var(--blue); color: #fff; }
    .meta-item:nth-child(3) { background: var(--yellow); color: var(--ink); }
    .meta-item:nth-child(4) { background: var(--surface); color: var(--ink); }
    .meta-num { display: block; font-family: var(--font-mono); font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    .meta-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 6px; opacity: 0.85; }
    @media (max-width: 768px) { .meta-bar { grid-template-columns: repeat(2, 1fr); } }

    .sub-title { font-family: var(--font-h); font-size: clamp(1.3rem, 2.6vw, 1.75rem); font-weight: 700; letter-spacing: -0.01em; margin: 56px 0 20px; padding-bottom: 12px; border-bottom: 3px solid var(--ink); }
    .svg-wrap { background: var(--surface); border: 1px solid var(--grey-light); border-radius: 8px; padding: 16px; max-width: 720px; margin: 0 auto; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06); }
    .svg-wrap svg { width: 100%; height: auto; display: block; }
    .svg-caption { text-align: left; font-size: 13px; color: var(--muted); margin-top: 12px; max-width: 720px; margin-left: auto; margin-right: auto; line-height: 1.6; }

    /* Position rows — asymmetric grid (De Stijl: no equal-width columns), same line = same row */
    .row-label { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 28px 0 12px; }
    .pos-row { display: grid; gap: 20px; margin-bottom: 8px; }
    .pos-row-1 { grid-template-columns: minmax(260px, 520px); justify-content: start; }
    .pos-row-2 { grid-template-columns: 1.3fr 1fr; }
    .pos-row-2.pos-row-alt { grid-template-columns: 1fr 1.3fr; }
    .pos-row-3 { grid-template-columns: 1fr 0.8fr 1.2fr; }
    .pos-row-3.pos-row-alt { grid-template-columns: 1.2fr 0.8fr 1fr; }
    @media (max-width: 768px) {
      .pos-row-1, .pos-row-2, .pos-row-3 { grid-template-columns: 1fr; }
    }

    .pos-box {
      background: var(--surface); border: 1px solid var(--grey-light); border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06); overflow: hidden;
      opacity: 0; animation: fadeInUp 420ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .pos-box-head {
      font-family: var(--font-b); font-weight: 700; font-size: 14px; letter-spacing: 0.03em;
      background: var(--accent); color: #fff; padding: 10px 18px;
    }
    .pos-list { list-style: none; padding: 8px 18px 14px; }
    .pos-list li { padding: 8px 0; border-bottom: 1px solid #F0F0F0; }
    .pos-list li:last-child { border-bottom: none; }
    .pos-rank-row { display: flex; align-items: center; gap: 10px; }
    .pos-rank {
      flex: 0 0 22px; height: 22px; display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-size: 11px; font-weight: 700; background: var(--surface); color: var(--ink);
      border: 1.5px solid var(--ink);
    }
    .pos-rank.pos-rank-1 { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }
    .pos-player { font-weight: 600; font-size: 14px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pos-sub-row { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; padding-left: 32px; font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
    .pos-season { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-b); }
    .pos-stat { flex: 0 0 auto; font-variant-numeric: tabular-nums; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .page-wrap { padding: 0 1rem 60px; }
      .hero { padding: 40px 1rem 32px; }
      .tab-btn { padding: 12px 16px; font-size: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
      .pos-box { opacity: 1; }
    }
  </style>
</head>

  <script>
    const DATA = JSON.parse(document.getElementById('fc-data').textContent);

    const ROW_GROUPS = [
      { label: '공격수 (ST · CF)', positions: ['ST', 'CF'] },
      { label: '공격형 미드필더 (LAM · CAM · RAM)', positions: ['LAM', 'CAM', 'RAM'] },
      { label: '측면 미드필더 (LM · RM)', positions: ['LM', 'RM'] },
      { label: '중앙 미드필더 (LCM · CM · RCM)', positions: ['LCM', 'CM', 'RCM'] },
      { label: '수비형 미드필더 (LDM · CDM · RDM)', positions: ['LDM', 'CDM', 'RDM'] },
      { label: '윙백 (LWB · RWB)', positions: ['LWB', 'RWB'] },
      { label: '풀백 (LB · RB)', positions: ['LB', 'RB'] },
      { label: '센터백 (LCB · CB · RCB)', positions: ['LCB', 'CB', 'RCB'] },
      { label: '골키퍼 (GK)', positions: ['GK'] },
    ];

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function initCountry(country) {
      const dates = Object.keys(DATA[country]).sort().reverse();
      const tabBar = document.getElementById('date-tabs-' + country);
      tabBar.innerHTML = dates.map((d, i) =>
        `<button class="date-btn${i === 0 ? ' active' : ''}" onclick="selectDate('${country}','${d}', this)">${d}</button>`
      ).join('');
      selectDate(country, dates[0], tabBar.querySelector('.date-btn'));
    }

    function selectDate(country, date, btn) {
      document.querySelectorAll('#date-tabs-' + country + ' .date-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderDateContent(country, date);
    }

    function renderDateContent(country, date) {
      const d = DATA[country][date];
      const container = document.getElementById('date-content-' + country);
      const meta = d.meta;

      let html = '';
      html += `<div class="meta-bar">
        <div class="meta-item"><span class="meta-num">${meta.collected ?? '-'}명</span><span class="meta-label">수집 인원</span></div>
        <div class="meta-item"><span class="meta-num">${meta.avgUpgrade ?? '-'}</span><span class="meta-label">강화등급 평균</span></div>
        <div class="meta-item"><span class="meta-num">${meta.sample ?? '-'}건</span><span class="meta-label">표본</span></div>
        <div class="meta-item"><span class="meta-num">${esc(d.formation || '-')}</span><span class="meta-label">기준 포메이션</span></div>
      </div>`;

      html += `<h2 class="sub-title">베스트 11 추천</h2>`;
      html += `<div class="svg-wrap">${d.svg || ''}</div>`;
      html += `<p class="svg-caption">전역 기준 동일 선수가 두 포지션에 중복 배정되지 않도록 조정한 1위, 해당 포지션 차순위 카드를 2위로 표시. 데이터상 최다 채택 포메이션인 ${esc(d.formation || '-')} 기준.</p>`;

      html += `<h2 class="sub-title">포지션별 최다 기용 카드 Top 5</h2>`;
      let rowIdx = 0;
      let boxIdx = 0;
      for (const group of ROW_GROUPS) {
        const present = group.positions.filter(p => d.positions[p] && d.positions[p].length);
        if (!present.length) continue;
        const altClass = rowIdx % 2 === 1 ? ' pos-row-alt' : '';
        html += `<div class="row-label">${group.label}</div>`;
        html += `<div class="pos-row pos-row-${present.length}${altClass}">`;
        for (const pos of present) {
          const delay = Math.min(boxIdx * 70, 560);
          html += `<div class="pos-box" style="animation-delay:${delay}ms"><div class="pos-box-head">${esc(pos)}</div><ol class="pos-list">`;
          for (const card of d.positions[pos]) {
            const rankClass = card.rank === 1 ? 'pos-rank pos-rank-1' : 'pos-rank';
            html += `<li>
              <div class="pos-rank-row"><span class="${rankClass}">${card.rank}</span><span class="pos-player">${esc(card.player)}</span></div>
              <div class="pos-sub-row"><span class="pos-season">${esc(card.season)}</span><span class="pos-stat">${card.avg.toFixed(1)} · ${esc(card.count)}</span></div>
            </li>`;
          }
          html += `</ol></div>`;
          boxIdx++;
        }
        html += `</div>`;
        rowIdx++;
      }

      container.innerHTML = html;
    }

    function switchCountry(country, btn) {
      document.querySelectorAll('.country-pane').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active-ned', 'active-ger'));
      document.getElementById('pane-' + country).classList.add('active');
      btn.classList.add(country === '네덜란드' ? 'active-ned' : 'active-ger');
    }

    initCountry('네덜란드');
    initCountry('독일');
  </script>
