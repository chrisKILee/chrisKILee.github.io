    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; }

    .thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border-radius: 10px 10px 0 0;
      background: #1e2030;
      cursor: pointer;
    }
    .thumb-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 1440px;
      height: 900px;
      border: none;
      transform-origin: top left;
      pointer-events: none;
    }
    .thumb-overlay {
      position: absolute;
      inset: 0;
      background: transparent;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .thumb-wrap:hover .thumb-overlay {
      opacity: 1;
      background: rgba(0,0,0,0.45);
    }
    .card { transition: transform 0.2s, box-shadow 0.2s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }

    .num-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0,0,0,0.75);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .badge-light   { background: rgba(20,184,166,0.12); color: #2dd4bf; border: 1px solid rgba(20,184,166,0.3); }

    templates.forEach((t, i) => {
      const btn = document.createElement('button');
      btn.style.cssText = `width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); color:#94a3b8; font-size:13px; font-weight:700; cursor:pointer; transition:all 0.15s;`;
      btn.textContent = i + 1;
      btn.title = t.name;
      btn.onmouseover = () => { btn.style.background = 'rgba(139,92,246,0.25)'; btn.style.color = '#c4b5fd'; btn.style.borderColor = 'rgba(139,92,246,0.5)'; };
      btn.onmouseout  = () => { btn.style.background = 'rgba(255,255,255,0.06)'; btn.style.color = '#94a3b8'; btn.style.borderColor = 'rgba(255,255,255,0.12)'; };
      btn.onclick = () => {
        document.querySelectorAll('#grid .card')[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
      };
      numWrap.appendChild(btn);
    });
    quickNums.appendChild(numWrap);

    // 템플릿 카드 렌더
    templates.forEach((t, i) => {
      const card = document.createElement('div');
      card.className = 'card rounded-2xl overflow-hidden cursor-pointer';
      card.style.background = 'rgba(255,255,255,0.04)';
      card.style.border = '1px solid rgba(255,255,255,0.08)';

      card.innerHTML = `
        <div class="thumb-wrap" onclick="window.open('${t.file}','_blank')">
          <div class="num-badge">${i + 1}</div>
          <iframe src="${t.file}" loading="lazy" title="${t.name}"></iframe>
          <div class="thumb-overlay">
            <div style="background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 13px; font-weight: 600; padding: 8px 20px; border-radius: 999px;">
              미리보기 열기 ↗
            </div>
          </div>
        </div>
        <div style="padding: 18px 20px 20px;">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px;">
            <div style="display:flex; align-items:center; gap: 8px;">
              <span style="font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.06); color: #64748b; width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;">${i + 1}</span>
              <span style="font-size: 15px; font-weight: 700; color: #f1f5f9;">${t.name}</span>
            </div>
            <span class="${t.badgeClass}" style="font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px;">${t.badge}</span>
          </div>
          <p style="font-size: 13px; color: #64748b; line-height: 1.6; margin-bottom: 10px;">${t.desc}</p>
          <div style="font-size: 12px; color: #475569; margin-bottom: 12px;">
            <span style="color: #94a3b8;">적합한 용도:</span> ${t.when}
          </div>
          <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap: wrap; gap: 8px;">
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              ${t.tags.map(tag => `<span style="font-size:11px; background: rgba(255,255,255,0.06); color: #64748b; padding: 2px 8px; border-radius: 6px;">#${tag}</span>`).join('')}
            </div>
            ${t.ref ? `<a href="${t.ref}" target="_blank" style="font-size:11px; color: #475569; text-decoration:none; display:flex; align-items:center; gap:3px;" onmouseover="this.style.color='#94a3b8'" onmouseout="this.style.color='#475569'">
              ${t.refLabel} ↗
            </a>` : '<span style="font-size:11px; color:#334155;">— (자체 제작)</span>'}
          </div>
          <div style="margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.06); display:flex; align-items:center; gap:8px;">
            <code style="font-size: 12px; background: rgba(255,255,255,0.05); color: #a78bfa; padding: 4px 10px; border-radius: 6px; user-select: all; flex:1;">template=${t.id}</code>
            <span style="font-size: 11px; color: #334155; white-space:nowrap;">또는 "${i+1}번"</span>
          </div>
        </div>
      `;

      grid.appendChild(card);
    });

    // 썸네일 iframe 스케일 자동 계산
    function scaleIframes() {
      document.querySelectorAll('.thumb-wrap').forEach(wrap => {
        const iframe = wrap.querySelector('iframe');
        if (!iframe) return;
        const scale = wrap.clientWidth / 1440;
        iframe.style.transform = `scale(${scale})`;
        iframe.style.height = (wrap.clientWidth / 16 * 10 / scale) + 'px';
      });
    }

    scaleIframes();
    window.addEventListener('resize', scaleIframes);
  </script>
</body>
</html>
